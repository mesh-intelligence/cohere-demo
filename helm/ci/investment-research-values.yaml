# The investment-research case (srd018) on the kind demo: kind-values.yaml with its
# report template bound and its corpus described.
# One RAG unit, minimal resources, no ingress, tiny storage.
image:
  pullPolicy: IfNotPresent

chatbot:
  # The investment-committee memo (srd018 R6), mirroring
  # cases/investment-research/memo-schema.yaml. A test holds the two in step, and holds
  # everything else in this file to kind-values.yaml.
  report:
    instruction: |
      You compose a first-draft investment-committee memo on the US energy sector from the
      documents supplied with the request. The memo is a demonstration artifact.

      Rules:
      - Compose only from the supplied documents. Do not use outside knowledge, and do not
        speculate beyond what they state.
      - Where the documents do not answer the question, say so plainly under Risks and Gaps.
      - Structure the memo as markdown with these headings, in this order: Investment
        Thesis, Analysis, and Risks and Gaps. Use a single # for each. Do not use subheadings
        anywhere in the memo: write paragraphs directly under these three headings.
      - Attribute every assertion to the document it came from.
      - Do not recommend buying, selling, or holding any security, and do not state a price
        target. This is not investment advice.
      - End the memo with this line, unchanged: Demonstration over a small corpus mixing
        public and invented material; not investment advice.
    templateVersion: investment-committee-memo-markdown@1
    sections:
      summary: {headings: "Investment Thesis|Thesis|Summary", label: Investment Thesis}
      body: {headings: "Analysis|Sector Analysis", label: Analysis}
      gaps: {headings: "Risks and Gaps|Risks|Gaps", label: Risks and Gaps}
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

ragUnits:
  - name: rag0
    description: US energy sector research corpus for 2024 -- reported issuer values, government energy analysis, macro releases, and internal analyst notes.
    collection: corpus
    embeddingModel: qwen3-embedding:8b
    replicas: 1

ragServer:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

chroma:
  storage: 256Mi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}

dolt:
  storage: 256Mi

# The chart-local Collector remains the pod-facing gateway while forwarding
# integration traces and metrics to the persistent host ingress. The Mage
# launcher overrides commit and runID for each scenario.
collector:
  externalOTLPEndpoint: host.docker.internal:4317
  integrationResource:
    repository: mesh-intelligence/declarative-agents
    module: applications/chatbot-mesh
    target: integration:helm
    commit: unknown
    runID: local-kind

ingress:
  enabled: false

# The applier image bundles helm, kubectl, and the chart (srd003 R1.3), not the
# runtime image the smoke/swap tests kind-load. Disable it here so those tests do
# not wait on an un-loaded image; the deployment-API flow is exercised by
# Integration.ControlPlane with a fake deployment API.
applier:
  enabled: false

# The smoke/swap tests use an external Ollama on the host; the in-cluster LLM tier
# is exercised by its own values (ci/kind-llm-values.yaml) so these tests do not
# wait on a model preload.
ollama:
  enabled: false

llm:
  externalURL: http://host.docker.internal:11434

# The brief exporter's image is built only by demo:up (images/exporter.Dockerfile)
# and is not published, so a scenario that does not build it cannot pull it.
# These scenarios do not exercise export; integration:exporter proves it against
# the demo, which re-enables it beside the image it builds (GH-759).
exporter:
  enabled: false
