{{- if .Values.controlPlane.enabled }}
{{- $fullname := include "chatbot-mesh.fullname" . -}}
# --- Creator: the control plane's agent lifecycle manager (srd005). It reaches the
# applier deployment API (srd006), which is authenticated apart from chat by a
# NetworkPolicy. ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-creator
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: creator
spec:
  replicas: {{ .Values.controlPlane.creator.replicas }}
  selector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: creator
  template:
    metadata:
      labels:
        {{- include "chatbot-mesh.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: creator
        # The observer's monitor fan-in reads this pod's monitor port from a
        # label, because a pod's container ports live in an array the
        # command-state selector grammar cannot address (srd008 R2.1, GH-1319).
        # The key carries no dot so the dotted selector can reach it.
        monitorPort: {{ .Values.controlPlane.creator.ports.monitor | quote }}
    spec:
      {{- with include "chatbot-mesh.imagePullSecrets" $ }}{{ . | nindent 6 }}{{ end }}
      containers:
        - name: creator
          image: {{ include "chatbot-mesh.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--profile"
            - "{{ .Values.profiles.mountPath }}/agents/creator/profile.yaml"
            - "--directory"
            - "{{ .Values.profiles.workMountPath }}"
            {{- with include "chatbot-mesh.otlpEndpoint" . }}
            - "--otel-otlp-endpoint"
            - {{ . | quote }}
            - "--otel-service-name"
            - "creator"
            {{- end }}
            {{- with include "chatbot-mesh.otlpMetricEndpoint" . }}
            - "--otel-metric-otlp-endpoint"
            - {{ . | quote }}
            {{- end }}
          # The creator reaches the applier deployment API (srd006). The applier's
          # apply surface is network-authenticated (NetworkPolicy), so no bearer is
          # required; the optional token mount below (the #392 file-mount pattern)
          # supplies a credential only when an operator fronts the applier with an
          # auth proxy. It binds 0.0.0.0 so its Services route to the pod.
          env:
            {{- with include "chatbot-mesh.integrationResourceAttributes" . }}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: {{ . | quote }}}
            {{- end }}
            - {name: CREATOR_BIND_HOST, value: "0.0.0.0"}
            # The deployment API is the applier agent (srd006); the creator's client
            # reaches its apply Service.
            - {name: DEPLOYMENT_API_URL, value: "http://{{ $fullname }}-applier:{{ .Values.applier.ports.apply }}"}
            - {name: PROVISIONER_HOST, value: "{{ $fullname }}-applier"}
            {{- /*
            The corpus-ingest child runs as a subprocess of this container and
            inherits its environment, so the ingest's Chroma, its embedding
            provider, and the credential all reach the child from here. Without
            these the child falls back to the loopback addresses a developer host
            answers, which in a pod resolve to nothing.

            The creator's own count words read CHROMA_URL and CHROMA_HOST too, so
            the collection the child writes and the collection the creator counts
            are one authority rather than two that happen to agree.
            */}}
            {{- $ingestUnit := "" }}
            {{- with .Values.controlPlane.creator.ingestRagUnit }}
            {{- $ingestUnit = . }}
            {{- else }}
            {{- with (first .Values.ragUnits) }}{{ $ingestUnit = .name }}{{ end }}
            {{- end }}
            {{- $ingestCollection := "" }}
            {{- $unitEmbedding := "" }}
            {{- range $unit := .Values.ragUnits }}
            {{- if eq $unit.name $ingestUnit }}
            {{- $ingestCollection = $unit.collection }}
            {{- $unitEmbedding = include "chatbot-mesh.embeddingModel" (dict "root" $ "unit" $unit) }}
            {{- end }}
            {{- end }}
            {{- if $ingestUnit }}
            {{- $ingestChroma := printf "%s-%s-chroma" $fullname $ingestUnit }}
            - {name: CHROMA_URL, value: "http://{{ $ingestChroma }}:{{ .Values.chroma.port }}"}
            - {name: CHROMA_HOST, value: {{ $ingestChroma | quote }}}
            - {name: CHROMA_PORT, value: {{ .Values.chroma.port | quote }}}
            {{- end }}
            {{- /*
            The collection is the one that unit's rag-server serves, so documents
            this ingest writes are documents a turn can retrieve.

            An ingest request names its own collection, and run_corpus_ingest
            overlays that name on the child's environment for the run, so this
            value is what the creator's own tooling reaches for outside a request
            rather than a ceiling on where a request may write. A caller that
            names a collection no rag-server serves gets an ingest that succeeds
            and documents no turn retrieves; the collection a unit serves is
            declared here, and it is the provisioning-workflow-orchestrator's
            intent that has to agree with it.
            */}}
            {{- with $ingestCollection }}
            - {name: CORPUS_INGEST_COLLECTION, value: {{ . | quote }}}
            {{- end }}
            {{- $embedder := include "chatbot-mesh.ingestEmbedder" . }}
            {{- $model := .Values.controlPlane.creator.ingestEmbedding.model }}
            {{- /*
            The model is the identity that unit's rag-server reports for its
            collection (RAG_EMBEDDING_MODEL on rag-units.yaml), which srd002 R3.3
            compares against the query vector's. Taking it from the provider block
            instead would diverge the moment an operator repointed one unit.
            */}}
            {{- if not $model }}
            {{- $model = $unitEmbedding }}
            {{- end }}
            {{- /*
            The provider library run_corpus_ingest binds the child's embedder
            root to (srd058 R2.2); empty leaves the profile's Ollama library.
            */}}
            {{- with $embedder }}
            - {name: CORPUS_INGEST_EMBEDDER, value: {{ . | quote }}}
            {{- end }}
            {{- with $model }}
            - {name: CORPUS_EMBEDDING_MODEL, value: {{ . | quote }}}
            {{- end }}
            {{- /*
            The child reaches Ollama through OLLAMA_URL for the invoke_llm word that
            drives its file selection, which a child embedding at Cohere still runs.
            Its Ollama embedding takes the same URL as the allow arguments the
            co-generated embed-rest.yaml renders (srd058 R1.6): the library
            fragment reads no environment.
            */}}
            {{- with .Values.controlPlane.creator.ingestOllamaURL }}
            - {name: OLLAMA_URL, value: {{ . | quote }}}
            {{- end }}
            {{- with .Values.controlPlane.creator.ingestChatModel }}
            - {name: CORPUS_CHAT_MODEL, value: {{ . | quote }}}
            {{- end }}
            {{- if .Values.cohere.enabled }}
            {{- /*
            The endpoint and its allowlist move together (srd009 R1.2), the same
            four the chatbot declares. The credential is referenced, never
            rendered: the chart accepts a Secret name and no value reaches a
            manifest or `helm get values` (srd009 R1.3).
            */}}
            - {name: COHERE_BASE_URL, value: {{ .Values.cohere.baseURL | quote }}}
            - {name: COHERE_HOST, value: {{ .Values.cohere.host | quote }}}
            - {name: COHERE_SCHEME, value: {{ .Values.cohere.scheme | quote }}}
            - {name: COHERE_PORT, value: {{ .Values.cohere.port | quote }}}
            - {name: COHERE_EMBED_MODEL, value: {{ .Values.cohere.embedModel | quote }}}
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cohere.existingSecret | quote }}
                  key: {{ .Values.cohere.secretKey | quote }}
            {{- end }}
          ports:
            - {name: instance, containerPort: {{ .Values.controlPlane.creator.ports.instance }}}
            - {name: control, containerPort: {{ .Values.controlPlane.creator.ports.control }}}
            - {name: monitor, containerPort: {{ .Values.controlPlane.creator.ports.monitor }}}
          readinessProbe:
            httpGet: {path: /api/lifecycle/health, port: control}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlPlane.creator.resources | nindent 12 }}
          volumeMounts:
            - {name: profiles, mountPath: {{ .Values.profiles.mountPath }}, readOnly: true}
            - {name: work, mountPath: {{ .Values.profiles.workMountPath }}}
      volumes:
        {{- /* Four groups, not one: the creator spawns the corpus-ingest child
             inside its own pod, and that child's profile includes reach into
             the knowledge-manager subtree (agents/corpus-ingest/profile.yaml
             machine and declaration paths), whose declarations import from the
             units group, so all four mount here (GH-760). */}}
        {{- include "chatbot-mesh.profilesVolume" (dict "root" $ "groups" (list "creator" "corpus-ingest" "knowledge-manager" "units")) | nindent 8 }}
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-creator
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: creator
spec:
  selector:
    {{- include "chatbot-mesh.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: creator
  ports:
    - {name: instance, port: {{ .Values.controlPlane.creator.ports.instance }}, targetPort: instance}
    - {name: control, port: {{ .Values.controlPlane.creator.ports.control }}, targetPort: control}
    - {name: monitor, port: {{ .Values.controlPlane.creator.ports.monitor }}, targetPort: monitor}
{{- if .Values.controlPlane.creator.networkPolicy.enabled }}
---
# The instance endpoint is reached only by the provisioning-workflow-orchestrator (srd005 R1.1, R5.4).
# Until GH-685 this port carried no policy at all, so anything in the cluster could
# ask the creator to act -- and the creator is the only pod the applier admits to
# its apply surface (srd006 R4.1), which made an unconstrained instance port the
# widest remaining path to apply. The GH-682 kind proof measured exactly that: an
# ingress-controller pod reached this port before this policy existed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-creator
  labels:
    {{- include "chatbot-mesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: creator
spec:
  podSelector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: creator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chatbot-mesh.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: provisioning-workflow-orchestrator
      ports:
        - {protocol: TCP, port: instance}
{{- end }}
{{- end }}
