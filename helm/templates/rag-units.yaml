{{- $root := . -}}
{{- $fullname := include "chatbot-mesh.fullname" . -}}
{{/*
Guard: ragUnit names must be unique. JSON Schema cannot express uniqueness by a
sub-key, so values.schema.json does not catch a duplicate; without this guard the
range below would render two objects with the same metadata.name and the applier's
helm --dry-run (srd006 R2.1) would not reject the patch. Fail render on a duplicate.
*/}}
{{- $ragNames := list -}}
{{- range $unit := .Values.ragUnits -}}
{{- $ragNames = append $ragNames $unit.name -}}
{{- end -}}
{{- if ne (len $ragNames) (len (uniq $ragNames)) -}}
{{- fail (printf "ragUnits names must be unique; got %v" $ragNames) -}}
{{- end -}}
{{- range $unit := .Values.ragUnits }}
{{- $ragName := printf "%s-%s" $fullname $unit.name -}}
{{- $chromaName := printf "%s-%s-chroma" $fullname $unit.name -}}
# --- RAG unit {{ $unit.name }}: rag-server agent + its Chroma database ---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    mesh.cohere-demo/role: "Clearance-filtered vector retrieval over its Chroma collections; serves the query and document read boundaries."
  name: {{ $ragName }}
  labels:
    {{- include "chatbot-mesh.labels" $root | nindent 4 }}
    app.kubernetes.io/component: rag-server
    chatbot-mesh/rag-unit: {{ $unit.name }}
spec:
  replicas: {{ $unit.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" $root | nindent 6 }}
      chatbot-mesh/rag-unit: {{ $unit.name }}
      # The unit's Chroma pod carries the same name, instance, and rag-unit
      # labels, so a selector without a disambiguator matches both pods and
      # kubectl resolves Chroma for the rag-server's logs and port-forwards.
      # A frozen workload key does that job rather than the role label,
      # because this selector is immutable and a role rename spelled here
      # would refuse the upgrade (GH-736; agentic-wiki-mesh GH-105).
      chatbot-mesh/workload: rag-server
  template:
    metadata:
      labels:
        {{- include "chatbot-mesh.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: rag-server
        chatbot-mesh/rag-unit: {{ $unit.name }}
        chatbot-mesh/workload: rag-server
        # The observer's monitor fan-in reads this pod's monitor port from a
        # label, because a pod's container ports live in an array the
        # command-state selector grammar cannot address (srd008 R2.1, GH-1319).
        # The key carries no dot so the dotted selector can reach it.
        monitorPort: {{ $root.Values.ragServer.ports.monitor | quote }}
      annotations:
        # Roll the unit when its mounted profiles change, the rule the chatbot
        # already follows (srd015 R3.2). Without it a machine or declaration
        # edit reached the ConfigMap and never the running pod, which is how
        # the document boundary's clearance fix stayed invisible on a live
        # upgrade.
        checksum/profiles: {{ include "chatbot-mesh.profilesChecksum" (dict "root" $root "groups" (list "rag-server")) }}
    spec:
      {{- with include "chatbot-mesh.imagePullSecrets" $ }}{{ . | nindent 6 }}{{ end }}
      {{- if $root.Values.ollama.enabled }}
      # Do not start an in-cluster RAG agent until the chart-owned preload Job
      # has made every declared model observable from the Ollama API.
      initContainers:
        {{- include "chatbot-mesh.llmReadyInit" $root | nindent 8 }}
      {{- end }}
      containers:
        - name: rag-server
          image: {{ include "chatbot-mesh.image" $root | quote }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          # GH-314 co-generates a per-unit rag-server profile pointing at this
          # unit's Chroma Service and collection; until then the mounted profile
          # reads these from the environment.
          args:
            - "--profile"
            - "{{ $root.Values.profiles.mountPath }}/agents/rag-server/profile.yaml"
            - "--directory"
            - "{{ $root.Values.profiles.workMountPath }}"
            {{- with include "chatbot-mesh.otlpEndpoint" $root }}
            - "--otel-otlp-endpoint"
            - {{ . | quote }}
            - "--otel-service-name"
            - {{ $unit.name | quote }}
            {{- end }}
            {{- with include "chatbot-mesh.otlpMetricEndpoint" $root }}
            - "--otel-metric-otlp-endpoint"
            - {{ . | quote }}
            {{- end }}
          # The rag-server profile is env-parameterized (GH-369): one mounted
          # profile points at this unit's Chroma Service and collection and binds
          # 0.0.0.0 so its Services route to the pod.
          env:
            {{- with include "chatbot-mesh.integrationResourceAttributes" $root }}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: {{ . | quote }}}
            {{- end }}
            - {name: CHROMA_URL, value: "http://{{ $chromaName }}:{{ $root.Values.chroma.port }}"}
            - {name: CHROMA_HOST, value: {{ $chromaName | quote }}}
            - {name: RAG_COLLECTION, value: {{ $unit.collection | quote }}}
            - {name: RAG_EMBEDDING_MODEL, value: {{ include "chatbot-mesh.embeddingModel" (dict "root" $root "unit" $unit) | quote }}}
            - {name: RAG_BIND_HOST, value: "0.0.0.0"}
          ports:
            - {name: query, containerPort: {{ $root.Values.ragServer.ports.query }}}
            - {name: control, containerPort: {{ $root.Values.ragServer.ports.control }}}
            - {name: monitor, containerPort: {{ $root.Values.ragServer.ports.monitor }}}
          readinessProbe:
            httpGet: {path: /api/lifecycle/health, port: control}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.ragServer.resources | nindent 12 }}
          volumeMounts:
            - {name: profiles, mountPath: {{ $root.Values.profiles.mountPath }}, readOnly: true}
            - {name: work, mountPath: {{ $root.Values.profiles.workMountPath }}}
      volumes:
        {{- include "chatbot-mesh.profilesVolume" (dict "root" $root "groups" (list "rag-server")) | nindent 8 }}
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $ragName }}
  labels:
    {{- include "chatbot-mesh.labels" $root | nindent 4 }}
    app.kubernetes.io/component: rag-server
    chatbot-mesh/rag-unit: {{ $unit.name }}
  annotations:
    mesh.cohere-demo/role: "Clearance-filtered vector retrieval over its Chroma collections; serves the query and document read boundaries."
    chatbot-mesh/description: {{ $unit.description | quote }}
    chatbot-mesh/embedding-model: {{ $unit.embeddingModel | quote }}
    chatbot-mesh/collection: {{ $unit.collection | quote }}
spec:
  selector:
    {{- include "chatbot-mesh.selectorLabels" $root | nindent 4 }}
    chatbot-mesh/rag-unit: {{ $unit.name }}
    chatbot-mesh/workload: rag-server
  ports:
    - {name: query, port: {{ $root.Values.ragServer.ports.query }}, targetPort: query}
    - {name: control, port: {{ $root.Values.ragServer.ports.control }}, targetPort: control}
    - {name: monitor, port: {{ $root.Values.ragServer.ports.monitor }}, targetPort: monitor}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    mesh.cohere-demo/role: "Chroma vector store holding this RAG unit's embedded collections."
  name: {{ $chromaName }}
  labels:
    {{- include "chatbot-mesh.labels" $root | nindent 4 }}
    app.kubernetes.io/component: chroma
    chatbot-mesh/rag-unit: {{ $unit.name }}
spec:
  serviceName: {{ $chromaName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "chatbot-mesh.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: chroma
      chatbot-mesh/rag-unit: {{ $unit.name }}
  template:
    metadata:
      labels:
        {{- include "chatbot-mesh.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: chroma
        chatbot-mesh/rag-unit: {{ $unit.name }}
    spec:
      containers:
        - name: chroma
          image: "{{ $root.Values.chroma.image.repository }}:{{ $root.Values.chroma.image.tag }}"
          imagePullPolicy: {{ $root.Values.chroma.image.pullPolicy }}
          {{- with (ternary (include "chatbot-mesh.otlpMetricEndpoint" $root) (include "chatbot-mesh.otlpEndpoint" $root) (eq $root.Values.collector.implementation "agent")) }}
          env:
            - {name: CHROMA_OPEN_TELEMETRY__ENDPOINT, value: {{ printf "http://%s" . | quote }}}
            - {name: CHROMA_OPEN_TELEMETRY__SERVICE_NAME, value: {{ printf "%s-chroma" $unit.name | quote }}}
            {{- with include "chatbot-mesh.integrationResourceAttributes" $root }}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: {{ . | quote }}}
            {{- end }}
          {{- end }}
          ports:
            - {name: http, containerPort: {{ $root.Values.chroma.port }}}
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml $root.Values.chroma.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ $root.Values.chroma.storage }}
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    mesh.cohere-demo/role: "Chroma vector store holding this RAG unit's embedded collections."
  name: {{ $chromaName }}
  labels:
    {{- include "chatbot-mesh.labels" $root | nindent 4 }}
    app.kubernetes.io/component: chroma
    chatbot-mesh/rag-unit: {{ $unit.name }}
spec:
  selector:
    {{- include "chatbot-mesh.selectorLabels" $root | nindent 4 }}
    app.kubernetes.io/component: chroma
    chatbot-mesh/rag-unit: {{ $unit.name }}
  ports:
    - {name: http, port: {{ $root.Values.chroma.port }}, targetPort: http}
---
{{- end }}
