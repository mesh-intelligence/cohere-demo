      Goals --> R1["R1: Export surface and machine shape"]
      Goals --> R2["R2: Exec bindings"]
      Goals --> R3["R3: Isolation and authority boundary"]
      Goals --> R4["R4: Input contract and the human edit"]
      Goals --> R5["R5: Failure handling and temporary files"]
      Goals --> R6["R6: Deployment and packaging"]
      R1 --> AC1["AC1: request-scoped machine, Done or Failed, no retained state"]
      R2 --> AC2["AC2: fixed argv, files not shells, shell escape disabled"]
      R3 --> AC3["AC3: no clients, egress denied, one caller (applier precedent)"]
      R4 --> AC4["AC4: analyst-triggered on the edited markdown (rel14.0)"]
      R5 --> AC5["AC5: rollback, no partial PDF, bounded render, re-exportable"]
