  requirements_trace: |
    ```mermaid
    flowchart LR
      Problem["Problem: a cited brief is not a ministry form, a chunk id is not a source an analyst can read, and a document path that skips the clearance filter reads what retrieval withheld"] --> Goals["Goals: Two-Panel INTSUM Interface"]
      Goals --> R1["R1: The surface inside the panel shell"]
      Goals --> R2["R2: The ministry template artifact"]
      Goals --> R3["R3: The form fills from the turn"]
      Goals --> R4["R4: Retrieval facets"]
      Goals --> R5["R5: The document read boundary"]
      Goals --> R6["R6: The provenance walk"]
      Goals --> R7["R7: The enforced-clearance line"]
      Goals --> R8["R8: Evidence"]
      R1 --> AC1["AC1: two columns on the chat route, other routes unchanged, routes declared twice, narrow viewport collapses"]
      R2 --> AC2["AC2: versioned structure-only artifact, eight sections, form renders from it"]
      R3 --> AC3["AC3: every field traced, empty rather than plausible, ratings carried, index deduplicated"]
      R4 --> AC4["AC4: pre-search facets that narrow only, unfaceted turn unchanged, vocabulary from the corpus"]
      R5 --> AC5["AC5: retrieval-tier reads through the chatbot boundary, clearance underivable from the request, absent rather than refused"]
      R6 --> AC6["AC6: citation to chunk to whole document to versions, span located, duplicates collapsed, over-clearance renders nothing"]
      R7 --> AC7["AC7: enforced level shown, no withheld count by display or by subtraction"]
      R8 --> AC8["AC8: browser tracer at two levels asserting rendered content, bundle reproduces in the same change"]
    ```
  read_path: |
    ```mermaid
    flowchart TD
      Browser["Analyst browser"] -->|"tasking, facets, clearance header"| Chatbot["chatbot request boundary"]
      Browser -->|"chunk or document identifier"| Chatbot
      Chatbot -->|"clearance from authenticated context (srd010 R3.1)"| RagQuery["rag-server vector-in boundary"]
      Chatbot -->|"same clearance, identifier-in"| RagDocs["rag-server identifier-in boundary"]
      RagQuery -->|"where filter ahead of the search"| Retrieval["retrieval collection"]
      RagDocs -->|"get by ids or metadata, no vector"| Documents["document collection"]
