      Goals --> R2["R2: Chunk records on disk"]
      Goals --> R3["R3: Vectors keyed by embedding-model identity"]
      Goals --> R4["R4: Offline build pipeline"]
      Goals --> R5["R5: Seeding from the store"]
      Goals --> R6["R6: Store scope and reproducibility"]
      R1 --> AC1["AC1: multi-source, multi-clearance, Admiralty-rated, below-cutoff, fictional"]
      R2 --> AC2["AC2: chunk beside vector and declared metadata, stable ids, fail-closed clearance"]
      R3 --> AC3["AC3: families coexist by identity, re-embed only on change"]
      R4 --> AC4["AC4: offline, idempotent, one client, no partial record"]
