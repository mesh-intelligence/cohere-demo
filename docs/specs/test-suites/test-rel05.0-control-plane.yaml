id: test-rel05.0-control-plane
title: Test Suite for Release 05.0 Control Plane
release: "05.0"

overview: |
  This suite covers the mesh control plane (srd004 provisioning-workflow-orchestrator, srd005 creator):
  a provisioning intent flows from the UX agent through the provisioning-workflow-orchestrator to the
  creator's instance operations and back as aggregated status, with the
  deployment-API authority held by the creator alone.

  Two cases cover it, and they answer different questions.

  The integration:controlPlane tracer is a fake-backed transport-and-authority
  proof. It runs the real provisioning-workflow-orchestrator and creator agents against a fake deployment
  API and proves the intent flow (chatbot -> provisioning-workflow-orchestrator -> creator -> deployment
  API), the request/response sequencing, and the authority boundary (no endpoint or
  credential crosses, only the creator calls the deployment API). Its trace links
  relate the case to the srd004/srd005 acceptance criteria structurally: a fake
  deployment API accepts whatever it is sent, so the case is evidence about the
  machine and the requests it constructs rather than about helm and kubectl
  behaving as the declarations assume.

  The integration:controlPlaneLive case supplies what a fake cannot. One intent
  carries an ingest request through a real corpus-ingest child run, the
  request-draining rollout the applier executes against a real release, and a chat
  turn grounded in the documents that ingest just wrote. The rollout is judged on
  the release revision moving, because a reported health proves nothing about
  whether helm ran; the turn is judged on what its sources composed from, because
  a mesh composing from nothing also answers 200 with fluent prose.

  What is still uncovered is narrower than the flow: of the create, restart, and
  terminate workflows, only restart is driven.

traces:
  - rel05.0-uc001-control-plane-provisioning

preconditions:
  - agent-core is available for the request runtime and REST client transport.
  - The chatbot, provisioning-workflow-orchestrator, and creator profiles are deployed with declared clients between them; the creator alone holds the deployment-API credentials.
  - A deployment API and the chart's values-to-config co-generation are reachable.

test_cases:
  - use_case: rel05.0-uc001-control-plane-provisioning
    name: Provisioning intent tracer across chatbot, provisioning-workflow-orchestrator, and creator
    integration_target: mage integration:controlPlane
    status: implemented
    description: |
      Drives a provisioning intent through the real provisioning-workflow-orchestrator and creator agents
      against a fake deployment API: the chatbot delegates an add-a-source intent to
      the provisioning-workflow-orchestrator through its declared client; the provisioning-workflow-orchestrator sequences an
      ingest request then a rollout request to the creator, forwarding the desired
      values; the creator drives the deployment API's apply and reads the rollout;
      the provisioning-workflow-orchestrator aggregates status. Asserts the authority boundary: the chatbot
      and provisioning-workflow-orchestrator submit no endpoint or credential, and only the creator calls
      the deployment API. The deployment API is a fake, so this proves transport
      sequencing and authority, not the behavioral lifecycle -- a real corpus-ingest
      with count verification, a real request-draining rollout, or a grounded turn
      on the new source are not asserted (see overview).
    inputs:
      intent: add a directory as a knowledge source
      directories: [one seeded directory]
      agents: [chatbot, provisioning-workflow-orchestrator, creator]
    expected:
      chatbot_delegates_intent_no_credential: true
      provisioning_workflow_orchestrator_sequences_ingest_then_rollout: true
      provisioning_workflow_orchestrator_forwards_values_and_requests_rollout: true
      creator_drives_apply_and_reads_rollout_via_deployment_api: true
      only_creator_calls_deployment_api: true
      # Not proven by this fake-backed tracer (see overview): real corpus-ingest
      # count verification, a real request-draining rollout, and a grounded turn
      # on the newly added source. The live case below proves those.
    traces:
      - rel05.0-uc001-control-plane-provisioning S1
      - rel05.0-uc001-control-plane-provisioning S2
      - rel05.0-uc001-control-plane-provisioning S3
      - rel05.0-uc001-control-plane-provisioning S4
      - rel05.0-uc001-control-plane-provisioning S5
      - srd004-provisioning-workflow-orchestrator AC1
      - srd004-provisioning-workflow-orchestrator AC2
      - srd004-provisioning-workflow-orchestrator AC3
      - srd004-provisioning-workflow-orchestrator AC4
      - srd004-provisioning-workflow-orchestrator AC5
      - srd005-creator AC1
      - srd005-creator AC2
      - srd005-creator AC3
      - srd005-creator AC4
      - srd005-creator AC5
      - srd003-chatbot-deployment AC4

  - use_case: rel05.0-uc001-control-plane-provisioning
    name: A mismatched embedding family is refused before the ingest leg reads a count
    integration_target: mage integration:controlPlane
    status: implemented
    description: |
      Drives the creator's ingest endpoint twice against a fake Chroma, with the
      family this deployment ingests at fixed for the run. An intent expecting
      another family answers 422 embedding_family_mismatch and reports the
      deployment's family rather than the one it asked for; an intent expecting
      the deployed family is admitted past the judge.

      The claim is routing, and the collection count read is what makes it
      observable. The count sits between the family judge and the child run, so
      a refused intent that never reads it is a refused intent that never
      reached the child -- which is what the refusal exists to guarantee, since
      a family the serving rag unit does not report yields documents excluded
      from every turn (srd002 R3.3). Asserting the status alone would pass on a
      refusal that arrived after the leg had started toward the child.

      The admitted half stops at that same observation rather than asserting a
      200. Past the judge the leg runs a real corpus-ingest child, which this
      tracer does not stage, so the run ends IngestFailed; a green ingest end to
      end is the live case below. Driving only the refusal would pass against a
      judge that refused everything, which is why both halves are here.
    inputs:
      deployed_family: the family fixed in the creator's environment for the run
      mismatched_intent: an ingest intent expecting a different family
      matched_intent: an ingest intent expecting the deployed family
    expected:
      mismatched_intent_answers_422_embedding_family_mismatch: true
      refusal_reports_the_deployed_family_not_the_requested_one: true
      refused_intent_never_reads_a_collection_count: true
      matched_intent_is_admitted_past_the_judge: true
      # Not proven here: a corpus-ingest child running, documents written, or a
      # turn over them. The live case below drives those.
    traces:
      - rel05.0-uc001-control-plane-provisioning S2
      - srd004-provisioning-workflow-orchestrator AC2
      - srd005-creator AC3

  - use_case: rel05.0-uc001-control-plane-provisioning
    name: One ingest-carrying intent through ingest, rollout, and a grounded turn
    integration_target: mage integration:controlPlaneLive
    status: implemented
    description: |
      Stands the control plane up on a kind cluster with the Cohere tier enabled,
      stages a corpus into the creator's work mount, and posts one provisioning
      intent carrying an ingest request. The creator resolves the collection the
      intent names, counts before and after, and runs the corpus-ingest child
      against that same collection; the provisioning-workflow-orchestrator then forwards the desired
      values and the creator drives the applier's real helm rollout; the newly
      ingested documents then answer a tasking.

      Each leg is judged on evidence rather than on the response being 200. The
      rollout is held to the release revision moving, because the creator reports
      the health the applier read and a rollout that never reached helm would
      still carry a phase. The turn is held to what its sources composed from --
      a document carrying a phrase only the ingested fixture has -- because a
      model that has read about the subject writes a plausible answer over an
      empty retrieval. A source excluded on embedding identity fails the case
      outright (srd002 R3.3): the ingest embeds at the family the unit reports,
      so an ingest at the other family would leave the new source unreachable
      while every request still answered 200.

      The ingest count is not asserted from the intent's response. A terminal
      response body resolves only $. selectors against the terminal word's own
      output, and that word is the rollout, so the count the creator judged does
      not reach the caller. The grounded turn is the stronger evidence in any
      case: it fails unless a source composed over a document the ingest wrote.
    inputs:
      intent: one provisioning intent carrying an ingest request and the desired values
      corpus: the chroma-corpus fixture, staged into the creator's work mount
      collection: the collection the deployed rag unit serves
      embedding_family: the Cohere family the deployed rag unit reports
    expected:
      ingest_child_runs_and_writes_documents: true
      rollout_moves_the_release_revision: true
      turn_composes_over_the_newly_ingested_documents: true
      no_source_excluded_on_embedding_identity: true
    traces:
      - rel05.0-uc001-control-plane-provisioning S2
      - rel05.0-uc001-control-plane-provisioning S4
      - rel05.0-uc001-control-plane-provisioning S5
      - srd004-provisioning-workflow-orchestrator AC2
      - srd005-creator AC3
