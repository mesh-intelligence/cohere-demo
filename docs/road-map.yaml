        status: implemented

  - version: "14.0"
    name: Brief export to PDF
    lineage: plan
    description: |
      Delivery of the finished brief. An exporter agent converts the approved,
      analyst-edited brief markdown to PDF through md-to-tex and a LaTeX engine, in
      a sandboxed, network-denied container. End-to-end tracer: an analyst edits the
      brief and exports it to a ministry-conformant PDF a reviewer approves. The
      export is analyst-triggered after the human edit the VISION requires, so it
      runs on the reviewed markdown rather than the raw generation and off the
      generation turn's latency. Adds the exporter agent profile with the md_to_tex
      and render_pdf exec words and its Helm workload; the md-to-tex and LaTeX
      binaries are added to the container image, which is packaging rather than
      machine YAML.
    status: implemented
    srds:
      - srd013-exporter-agent
    use_cases:
      - id: rel14.0-uc001-brief-export
        summary: The analyst edits and approves the brief, then exports it to a ministry-conformant PDF rendered in a sandboxed, network-denied container.
        status: implemented
    test_suites:
      - id: test-rel14.0-brief-export
        summary: The edit-then-export tracer, the analyst trigger off the turn's latency, rendering without re-deriving structure or re-running conformance, the request-scoped machine, fixed argv with content as a file, the shell-escape and file-access boundary against hostile fixtures, the isolation and single-caller render, clean failure with no partial PDF, and the separate workload on a sanctioned-divergence image.
        status: implemented
