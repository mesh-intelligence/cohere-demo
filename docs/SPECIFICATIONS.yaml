srd_index:
  - id: srd001-rag-server-agent
    title: RAG Server Agent Functional Block
    summary: Persistent vector-in retrieval service behind a machine_request query endpoint.
    path: docs/specs/software-requirements/srd001-rag-server-agent.yaml
  - id: srd002-chatbot-agent
    title: Chatbot Agent Functional Block
    summary: Browser-facing agent whose request-scoped turn selects a model tier, fans out to RAG servers, composes, and answers.
    path: docs/specs/software-requirements/srd002-chatbot-agent.yaml
  - id: srd003-chatbot-deployment
    title: Chatbot Mesh Deployment Model
    summary: One Helm chart with values-driven RAG pairs, co-generated client config, tiered hot swap, and an in-cluster LLM tier.
    path: docs/specs/software-requirements/srd003-chatbot-deployment.yaml
  - id: srd004-provisioning-workflow-orchestrator
    title: Provisioning Workflow Orchestrator Agent Functional Block
    summary: The current provisioning-workflow-orchestrator actor assumes Executor / Workflow Orchestrator, binds a provisioning intent, and sequences ingestion and reconfiguration through the creator; GH-1077 completed its semantic rename.
    path: docs/specs/software-requirements/srd004-provisioning-workflow-orchestrator.yaml
  - id: srd005-creator
    title: Creator Agent Functional Block
    summary: Actor assuming Creator / Instance Manager and Agent Owner / Agent Lifecycle Manager that realizes decided operations and alone holds deployment-API authority.
    path: docs/specs/software-requirements/srd005-creator.yaml
  - id: srd006-applier
    title: Applier Agent Functional Block
    summary: Executor / Actuation Agent realization that validates a values patch, applies and verifies a rollout, and rolls back, binding helm and kubectl as exec tools.
    path: docs/specs/software-requirements/srd006-applier.yaml
  - id: srd007-collector-agent
    title: Collector Agent Functional Block
    summary: Monitor / Telemetry Collector realization composing bounded OTLP receive, deterministic spool, unchanged relay, lifecycle surfaces, and self-loop prevention while contrib retains metrics.
    path: docs/specs/software-requirements/srd007-collector-agent.yaml
  - id: srd008-observer-agent
    title: Observer Agent Functional Block
    summary: Monitor / Fleet Observer realization that discovers mesh agents and the deployment topology from the Kubernetes API, polls each agent's monitor surface and per-pod resource usage (metrics.k8s.io), and serves a fleet-level view.
    path: docs/specs/software-requirements/srd008-observer-agent.yaml
  - id: srd009-cohere-provider
    title: Cohere Provider Client and Command Tier
    summary: Additive Cohere provider on the chatbot actor -- one declared REST client for embed, rerank, and chat with a configurable base URL and allowlisted egress; invoke_cohere_command as a selectable chat-LLM word composing over a documents list; structured citation surfacing replacing the bracket-scraping heuristic; and the first cascade rerank over the RAG candidates.
    path: docs/specs/software-requirements/srd009-cohere-provider.yaml
  - id: srd010-clearance-gated-retrieval
    title: Clearance-Gated Retrieval
    summary: Per-clearance access control enforced before retrieval -- ingest-time clearance tagging, a rag-server metadata where-filter applied ahead of the vector search so an over-clearance document is never a candidate, and the analyst's maximum clearance carried from the authenticated request context through the fan-out as trusted command state.
    path: docs/specs/software-requirements/srd010-clearance-gated-retrieval.yaml
  - id: srd011-osint-search-cascade-rerank
    title: OSINT Search Branch and Cascade Rerank
    summary: The second retrieval branch and the cascade that orders both -- an OSINT search bounded by a client-enforced approved-domain allowlist and a minimized egress payload, a per-branch rerank, and a fusion rerank that reorders the union on one relevance scale to produce the top-N Command composes from, with external results held as untrusted, provenance-marked, unclearanced data.
    path: docs/specs/software-requirements/srd011-osint-search-cascade-rerank.yaml
  - id: srd012-brief-markdown-conformance
    title: Brief Markdown Composition and Template Conformance
    summary: Ministry-template markdown as the composition target and the deterministic structural check over it -- a versioned schema of required sections, a non-model validation run on every brief before it is surfaced, and a flagged-with-defects outcome that never rewrites the draft; owns the markdown representation among the template's three.
    path: docs/specs/software-requirements/srd012-brief-markdown-conformance.yaml
  - id: srd013-exporter-agent
    title: Exporter Agent Functional Block
    summary: Sandboxed, network-denied agent that renders the approved, analyst-edited brief markdown to PDF through md-to-tex and a LaTeX engine bound as fixed-argv exec words, with shell escape disabled and file access restricted because the document is composed from untrusted-derived content; analyst-triggered off the generation turn, following and tightening the applier's exec-bound precedent.
    path: docs/specs/software-requirements/srd013-exporter-agent.yaml
  - id: srd014-evaluation
    title: Evaluation Methodology over Labeled Taskings
    summary: The measurement specification behind the VISION's numbers -- a labeled-tasking corpus whose relevant sets are labeled independently of any run, retrieval recall reported with and without the rerank passes so Rerank's contribution is a measured difference, citation coverage over a declared deterministic assertion segmentation, first-draft time split into system and analyst-edit segments against the half-day baseline, and an explicit bound on what figures over a synthetic corpus may be claimed to support.
    path: docs/specs/software-requirements/srd014-evaluation.yaml
  - id: srd015-corpus-build
    title: Corpus Build with Cached Embeddings
    summary: The offline build behind the plan corpus -- a synthetic, multi-source, multi-clearance, Admiralty-rated document set sized so a retrieval cutoff bites, chunked into on-disk YAML records that carry each chunk beside its vectors and its declared metadata, with vectors keyed by embedding-model identity so families coexist and a rebuild re-embeds only what changed, and a demo seed that loads from the store rather than calling the embedding provider.
    path: docs/specs/software-requirements/srd015-corpus-build.yaml
  - id: srd016-intsum-ui
    title: Two-Panel INTSUM Interface
    summary: The analyst surface over the corpus -- the chat route rendered as the tasking and its keyword, source-type, source-rating, and clearance facets beside the live ministry INTSUM form, the versioned template artifact that form renders from and rel12.2 later validates markdown against, the walk from a citation to its chunk to the whole parent report and its other chunk-size versions, and the identifier-in read boundary that serves those documents through the request boundary where the analyst's clearance is established so the presentation path withholds exactly what retrieval withholds.
    path: docs/specs/software-requirements/srd016-intsum-ui.yaml
  - id: srd018-investment-research-case
    title: Investment Research Case
    summary: A second regulated domain bound by configuration -- US energy-sector research over numeric issuer facts, government energy analysis, macro releases, and an invented gated tier that cannot name a real issuer, with tiers admitted only after their terms are read, access levels modeling information barriers through a declared mapping onto the existing ordered set, the investment-committee memo as data the existing check reads, and every surface that could not be bound listed.
    path: docs/specs/software-requirements/srd018-investment-research-case.yaml
  - id: srd017-real-demo-corpus
    title: Real Multi-Source Demo Corpus
    summary: The real corpus that replaces the synthetic one -- five Ukraine source tiers read through a single normalized envelope with clearance declared per tier rather than inferred per document, a declared window converted whole and chunked at three coexisting profiles, parent-document and cross-tier lineage on every chunk so a retrieved fragment reconstructs to a citable source, a paid embedding step bounded to a declared selection whose ceiling is checked before the first request, and a second collection in the same vector store that serves documents and their versions to the interface behind the clearance filter that governs retrieval.
    path: docs/specs/software-requirements/srd017-real-demo-corpus.yaml

