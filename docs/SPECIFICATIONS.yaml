id: cohere-demo-specifications
title: cohere-demo Specification Index

overview: |
  The mesh is domain-neutral and the specifications keep the defense profile's
  vocabulary: clearance is its access level, Admiralty its source rating, and the
  INTSUM its report template. srd018 (rel15.0, implemented) binds the same mesh to
  investment research by configuration.

  Specification index for the standalone chatbot mesh example. Fifteen SRDs define
  the program: three data-plane -- the RAG server agent (srd001), the chatbot agent
  (srd002), and the Helm deployment model (srd003) -- two control-plane -- the
  provisioning-workflow-orchestrator (srd004) and the creator (srd005) -- the deployment-plane applier
  (srd006), the collector agent (srd007), the fleet observer agent (srd008), and seven
  for the additive Cohere provider work -- the provider client and Command tier
  (srd009), clearance-gated retrieval (srd010), the OSINT search branch with the
  cascade rerank (srd011), brief markdown composition with its template conformance
  check (srd012), the exporter agent that renders the approved brief to PDF (srd013),
  the evaluation methodology that measures the criteria over labeled taskings
  (srd014), the corpus build whose cached embeddings and declared metadata the
  plan releases read (srd015), and the real multi-source corpus that replaces the
  synthetic one and serves its documents back to the interface (srd017). The
  corpus holds twenty-four use cases and
  twenty-three test suites. Sixteen use cases cover the substrate releases, rel00.0
  through rel10.3, each with a formal test suite, and all sixteen are
  implemented. The substrate covers srd009 in full. rel10.0 carries the
  provider client, the Command composition tier, and the additive boundary; rel10.1
  the structured citations; rel10.2 the RAG rerank pass; and rel10.3 the
  query-embedding repoint that completed the model stack. All four are implemented,
  each proving its response shape against the live provider, and rel10.0 and rel10.3
  each verify a tasking against the deployed mesh. srd010 through srd017
  specify the plan block. srd015 (rel10.4, the corpus build with cached
  embeddings) is implemented: the committed store carries both embedding
  families over one set of records, and its tracer builds, seeds, and serves a
  tasking from the seeded collection. Everything behind it in the plan block
  reads the clearance tags, facets, source-evaluation rows, and synthetic
  documents it supplies. rel11.0 (clearance-gated retrieval) is implemented: the
  rag-server filters the served collection to the requester's level before the
  vector search, so an over-clearance document is never a candidate rather than
  a discarded result. srd017 (rel10.5, the real multi-source corpus) is implemented: it replaces the synthetic corpus with five real Ukraine
  source tiers, chunks a declared month at three profiles carrying parent lineage, bounds the
  paid embedding to a declared selection, and serves each document back to the
  interface from a second collection behind the same clearance filter. Its use
  case and its sixteen-case test suite are authored ahead of the code, so every
  implementation issue in the release is checked against cases that already
  exist. srd016 (rel11.5, the two-panel INTSUM interface) is implemented: the
  chat route renders the ministry form beside the tasking, filling from the
  turn through a declared contract; keyword, source-type, and source-rating
  facets narrow retrieval before the vector search under the clearance window
  the retrieval tier composes itself; and the provenance walk resolves a
  citation to its chunk, the whole report behind it, that report's other
  versions, and its cross-tier derivation, all served through the request
  boundary under the clearance the retrieval path enforces. Its browser tracer
  asserts the rendered surface at two clearance levels against the seeded
  mesh. srd012 (rel12.2, template conformance) is implemented: the markdown
  structural schema is versioned data beside the interface artifact, every
  composed brief is validated against it on the turn by a deterministic
  chain that reaches no model, and the verdict, the schema version, and the
  specific defects travel in response metadata to the form, where a failing
  brief is surfaced as a draft with its defect list and a passing one is
  never described as more than structurally conformant. srd011's rel12.0 half
  (OSINT search tool) is implemented: an allowlisted external search runs as a
  second retrieval branch whose egress carries the tasking alone, results
  normalize into the RAG candidate shape and reach the model only as marked,
  provenance-carrying documents in the composition set, the client's network
  policy is the approved-domain control that drops and reports a
  non-allowlisted request, and the air-gapped deployment removes the
  capability from the rendered policy and answers retrieval-only. srd011's
  rel12.1 half (cascade rerank) is implemented: the search branch is reranked
  on its own and trimmed to the declared budget, a fusion pass re-scores the
  union of both reranked branches against the tasking on one relevance scale
  to produce the composed top-N, all three passes call the one declared
  rerank operation differing only in candidate set, every pass degrades
  without failing the turn, and the single-fusion collapse is recorded as a
  latency tunable that is not the default. srd014 (rel13.0, evaluation) is
  implemented: a versioned labeled-tasking corpus over the Ukraine slice, a
  Go harness that drives the shipped turn through its ordinary boundary and
  measures retrieval recall at the composed top-N with and without the
  rerank pass, citation coverage from structured metadata under a declared
  deterministic segmentation, and first-draft time in measured and assumed
  segments, all folded into one report that carries per-tasking results,
  the run configuration and model identities, and the mixed
  real-and-synthetic qualification in the output itself. srd013 (rel14.0,
  brief export) is implemented: a request-scoped exporter agent renders the
  approved, analyst-edited brief markdown to PDF through fixed-argv md-to-tex
  and LaTeX exec words in its own egress-denied Helm workload, on an image
  that adds the rendering toolchain as a recorded sanctioned divergence; the
  export runs on the analyst's request off the generation turn's latency, a
  failure rolls the workspace back and returns no partial PDF, and the
  hostile shell-escape and outside-path fixtures neither execute nor read
  what they name under the declared engine confinement. This completes the
  road map.

  The application runs on the agent-core runtime and cites agent-core platform SRDs
  (srd021, srd028, srd029, srd030, srd033, srd034, srd035, srd036, and srd016
  traceparent) as external references rather than indexing them here. The control
  plane (provisioning-workflow-orchestrator, creator, and the provisioning surface) is release rel05.0; the
  applier (srd006) that replaces the Go provisioning surface with a declarative
  agent is release rel06.0.

  The corpus is validated by the specification critic (mage audit): it loads and validates with no
  errors. Advisory findings remain visible, including tool-undo-mismatch warnings;
  the gate does not report a warning-free corpus. The traceability chain is complete:
  every use case touchpoint builds an SRD edge (the object-format {id, target, reason} touchpoints
  parse since GH-448), every success criterion traces an acceptance criterion
  alongside its requirement groups, and every acceptance criterion is covered by a
  test case. Every SRD is indexed and placed in ARCHITECTURE, every use case targets
  its SRDs through touchpoints, and every test suite traces its use case.

role_alignment_index:
  authority: ../../declarative-agents/applications/docs/specs/semantic-models/agent-role-realizations.yaml#bindings.chatbot_mesh
  architecture: docs/ARCHITECTURE.yaml#role_realization_alignment
  rule: Actors assume roles; profile, wrapper, Helm workload, and values-selected instance names are realization identities, not canonical role definitions.
  decisions:
    - {current_actor: chatbot, canonical_role_sub_role: "Planner / Intent Handler; Executor / Workflow Orchestrator; Knowledge Manager / Recommendation Generator", retained_or_proposed_name: chatbot, evidence: srd002, migration_impact: none}
    - {current_actor: rag-server, canonical_role_sub_role: "Knowledge Manager / Recommendation Generator", retained_or_proposed_name: rag-server, evidence: srd001, migration_impact: none}
    - {current_actor: corpus-ingest, canonical_role_sub_role: "inherited Knowledge Manager / Ontology Manager", retained_or_proposed_name: corpus-ingest, evidence: "srd001 ingest boundary and wrapper profile", migration_impact: none}
    - {current_actor: provisioning-workflow-orchestrator, canonical_role_sub_role: "Executor / Workflow Orchestrator; not Coordinator", retained_or_proposed_name: provisioning-workflow-orchestrator, evidence: srd004, migration_impact: GH-1077}
    - {current_actor: creator, canonical_role_sub_role: "Creator / Instance Manager; Agent Owner / Agent Lifecycle Manager", retained_or_proposed_name: creator, evidence: srd005, migration_impact: none}
    - {current_actor: applier, canonical_role_sub_role: "Executor / Actuation Agent and Change Manager", retained_or_proposed_name: applier, evidence: srd006, migration_impact: documentation-only}
    - {current_actor: collector, canonical_role_sub_role: "Monitor / Telemetry Collector", retained_or_proposed_name: collector, evidence: srd007, migration_impact: none}
    - {current_actor: observer, canonical_role_sub_role: "Monitor / Fleet Observer", retained_or_proposed_name: observer, evidence: srd008, migration_impact: none}
    - {current_actor: exporter, canonical_role_sub_role: "Executor / Actuation Agent", retained_or_proposed_name: exporter, evidence: srd013, migration_impact: "none; additive new agent"}
  deployment_evidence:
    - helm/templates/chatbot.yaml
    - helm/templates/rag-units.yaml
    - helm/templates/provisioning-workflow-orchestrator.yaml
    - helm/templates/creator.yaml
    - helm/templates/applier.yaml
    - helm/templates/collector.yaml
    - helm/templates/observer.yaml

