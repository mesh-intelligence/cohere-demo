# An enabled Cohere provider with no Secret reference. The workload would render
# and start, then fail every Cohere turn at request time because the credential
# resolver has nothing to read. The schema rejects it so the applier's dry-run
# refuses the rollout rather than the mesh discovering it in production
# (srd009 R1.3).
cohere:
  enabled: true
  existingSecret: ""
