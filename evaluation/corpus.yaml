      - {id: HR-22-013, source: humint}
      - {id: HR-23-030, source: humint}

  - id: eval-t10
    clearance: unclassified
    conditions: [multi_source]
    text: >-
      Prepare a command-staff intelligence brief on the December 31, 2022
