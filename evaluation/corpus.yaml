    relevant:
      - {id: missile-2022-12-31, source: sigint_event}
      - {id: isw-2022-12-31, source: osint_assessment}
      - {id: losses-2022-12-31, source: sigint_series}
      - {id: tg-rian_ru-190343, source: osint_news}
