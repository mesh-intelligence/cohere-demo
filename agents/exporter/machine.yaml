kind: machine
schema_version: 1
name: exporter
purpose: |-
  Host the brief-export boundary as a persistent service (srd013 R1.1, R1.3).
  The host starts the export, control, and monitor listeners, waits for a
  lifecycle exit event, exits the agent, and stops the listeners -- the same
  lifecycle sequencing every mesh agent runs. The export work itself is
  request-scoped: each inbound request binds one run of the export machine,
  and this host holds no document, no cache, and no state between requests
  (R1.4).
invariants:
  - REST authority is supplied by the profile and never by request input.
  - The host binds no model, retrieval, or provider client, and holds no lifecycle, deployment, or configuration authority over anything else (srd013 R3.1, R3.4).
initial_state: Idle
budget:
  command_timeout: 11m
  max_iterations: 10000
states:
  - {name: Idle, meaning: Initial state before the exporter servers start.}
  - {name: LaunchingRequests, meaning: The export request server is starting.}
  - {name: LaunchingControl, meaning: The control server is starting.}
  - {name: LaunchingMonitor, meaning: The monitor server is starting.}
  - {name: AwaitingControl, meaning: Serving; waiting for a lifecycle exit event.}
  - {name: Exiting, meaning: Routing ExitRequested to exit_agent.}
  - {name: StoppingMonitor, meaning: Stopping the monitor server.}
  - {name: StoppingRequests, meaning: Stopping the export request server.}
  - {name: Failed, meaning: Terminal. A server or boundary word failed., run_status: failed}
  - {name: Done, meaning: Terminal. Clean shutdown after a lifecycle exit., run_status: succeeded}
terminal_states:
  - Done
  - Failed
signals:
  - {name: Seed, trigger: Agent startup.}
  - {name: ServerLaunched, trigger: A server launched.}
  - {name: ExitRequested, trigger: A lifecycle exit event was enqueued.}
  - {name: AgentExited, trigger: exit_agent completed.}
  - {name: ServerStopped, trigger: A server stopped.}
  - {name: AwaitTimedOut, trigger: No lifecycle event arrived before the await timeout.}
  - {name: CommandError, trigger: A server or boundary word failed.}
transitions:
  - {state: Idle,              signal: Seed,           next: LaunchingRequests, action: launch_exporter_requests}
  - {state: LaunchingRequests, signal: ServerLaunched, next: LaunchingControl,  action: launch_exporter_control}
  - {state: LaunchingRequests, signal: CommandError,   next: Failed}
  - {state: LaunchingControl,  signal: ServerLaunched, next: LaunchingMonitor,  action: launch_monitor_rest, label: monitor, report_output: $.address}
  - {state: LaunchingControl,  signal: CommandError,   next: Failed}
  - {state: LaunchingMonitor,  signal: ServerLaunched, next: AwaitingControl,   action: await_exporter_control}
  - {state: LaunchingMonitor,  signal: CommandError,   next: Failed}
  - {state: AwaitingControl,   signal: ExitRequested,  next: Exiting,           action: exit_agent}
  - {state: AwaitingControl,   signal: AwaitTimedOut,  next: AwaitingControl,   action: await_exporter_control}
  - {state: AwaitingControl,   signal: ServerStopped,  next: Failed}
  - {state: AwaitingControl,   signal: CommandError,   next: Failed}
  - {state: Exiting,           signal: AgentExited,    next: StoppingMonitor,   action: stop_monitor_rest}
  - {state: Exiting,           signal: CommandError,   next: Failed}
  - {state: StoppingMonitor,   signal: ServerStopped,  next: StoppingRequests,  action: stop_exporter_requests}
  - {state: StoppingMonitor,   signal: CommandError,   next: Failed}
  - {state: StoppingRequests,  signal: ServerStopped,  next: Done}
  - {state: StoppingRequests,  signal: CommandError,   next: Failed}
