# Source-count-independent multi-RAG fan-out. The query result shape is the
# shared retrieval contract (declarative-agents srd060); this application's
# clearance_enforced_at rides beside it, and the clearance-bearing operations
# themselves stay local because clearance is outside the shared fragment.
kind: tool-declaration
schema_version: 1
unit: cohere-chatbot-request-fanout-declarations
imports:
  - /opt/agent-core/tools/units/types-collections.yaml
  - /opt/agent-core/tools/units/types-retrieval.yaml
  - request-fanout-declarations-types.yaml
tools:
  - name: rag_query
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Query the currently bound RAG source with the message vector.
    problem: The chatbot must fan one embedding out over an ordered runtime topology without one word per source.
    goals:
      - Read the selected RAG authority from the trusted for_each item binding.
      - Return chunks and the source's reported embedding model.
    requirements:
      input:
        - The query embedding and current topology item are selected from command state.
      output:
        - Output includes ids, documents, distances, and embedding_model.
      errors:
        - A mapped 400 emits QueryRejected; transport and mapping failures emit CommandError.
    non_goals:
      - Does not accept a model-authored URL, method, credential, or operation.
    output:
      description: Mapped RAG query response.
    side_effects:
      - {kind: external_api, target: rag_server.query, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Querying a RAG source does not mutate it.}
    config:
      rest_ref: rag
      operation: query
    signature:
      input: builtin.Message
      emits:
        - {signal: QueryResponded, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.RagQueryOutput>}
        - {signal: QueryRejected, message: builtin.Message<builtin.Text>}
        - {signal: ClearanceRefused, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: rag_query_faceted
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Query the currently bound RAG source with the message vector under the analyst's facet constraints.
    problem: A faceted turn must fan the same embedding out over the same topology while carrying the facets to the boundary that conjoins them under the clearance window (srd016 R4.2).
    goals:
      - Read the selected RAG authority from the trusted for_each item binding.
      - Carry the facet constraint and keyword to the retrieval tier's faceted boundary.
      - Return chunks, their metadata, and the source's reported embedding model.
    requirements:
      input:
        - The query embedding, facet constraints, and current topology item are selected from command state.
      output:
        - Output includes ids, documents, distances, metadatas, and embedding_model.
      errors:
        - A mapped 400 emits QueryRejected; transport and mapping failures emit CommandError.
    non_goals:
      - Does not accept a model-authored URL, method, credential, or operation.
      - Does not compose the clearance filter; the retrieval tier conjoins it (srd016 R4.3).
    output:
      description: Mapped RAG query response.
    side_effects:
      - {kind: external_api, target: rag_server.query, state: read_only}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Querying a RAG source does not mutate it.}
    config:
      rest_ref: rag
      operation: query_faceted
    signature:
      input: builtin.Message
      emits:
        - {signal: QueryResponded, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.RagQueryFacetedOutput>}
        - {signal: QueryRejected, message: builtin.Message<builtin.Text>}
        - {signal: ClearanceRefused, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: check_facets
    type: builtin
    init: value_predicate
    visibility: internal
    category: response
    description: Decide whether this turn carries retrieval facets.
    problem: |
      The plain and faceted fan-outs are different operations against different
      boundaries, and a machine branches on signals. A turn with no facets must
      take the plain leg unchanged (srd016 R4.4), so the presence check is a
      word rather than a field a template branches around.
    goals:
      - Send a turn with no facets down the plain query leg it takes today.
      - Send a turn carrying facets down the faceted leg.
    requirements:
      input:
        - The facets ride the embed carry and are read through the shared query_embedding label.
      output:
        - Output is the emptiness outcome.
      errors:
        - An unresolved selector emits CommandError.
    non_goals:
      - Does not validate the facet shape; the chat boundary's schema owns that.
    output: {description: Facet presence outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Comparison changes no external state.}
    config:
      left: $from(query_embedding).body.carried.facets
      # empty is satisfied by null as well as by an empty object, and an absent facets field seeds the carry as null, so the unfaceted turn -- and any caller predating the facet contract -- lands on the plain leg.
      op: empty
      satisfied: FacetsAbsent
      unsatisfied: FacetsPresent
    signature:
      input: builtin.Message
      emits:
        - {signal: FacetsAbsent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: FacetsPresent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: check_proposed_tiers
    type: builtin
    init: value_predicate
    visibility: internal
    category: response
    description: Decide whether the source selection proposed collection tiers.
    problem: With no analyst facets, a selection that proposed tiers takes the faceted leg (GH-694); the machine branches on signals, so the emptiness check is a word.
    goals:
      - Route a tierless turn down the plain leg unchanged.
    requirements:
      input: [Command state.]
      output: [Per description.]
      errors: [Declared error signal.]
    non_goals: [None.]
    output: {description: Tier-proposal outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      left: $from(parsed_selection).body.source_types
      op: empty
      satisfied: TiersAbsent
      unsatisfied: TiersProposed
    signature:
      input: builtin.Message
      emits:
        - {signal: TiersAbsent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: TiersProposed, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: check_proposed_window
    type: builtin
    init: value_predicate
    visibility: internal
    category: response
    description: Decide whether the selection proposed a reporting window.
    problem: A tier selection may also bound the dates (GH-730).
    goals:
      - Route a windowless selection to the plain tier leg.
    requirements:
      input: [Command state.]
      output: [Per description.]
      errors: [Declared error signal.]
    non_goals: [None.]
    output: {description: Window outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      left: $from(parsed_selection).body.date_from
      op: empty
      satisfied: WindowAbsent
      unsatisfied: WindowProposed
    signature:
      input: builtin.Message
      emits:
        - {signal: WindowAbsent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: WindowProposed, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: publish_analyst_facets
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Republish the analyst's facets under the shared retrieval-facets label.
    problem: Both facet legs feed one faceted query op, so both publish one label (GH-694); the analyst's facets always win.
    goals:
      - Do the one step the description states.
    requirements:
      input: [Command state.]
      output: [Per description.]
      errors: [Declared error signal.]
    non_goals: [None.]
    output: {description: The facet payload.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: AnalystFacetsPublished
      inputs:
        facet_where: $from(query_embedding).body.carried.facets.facet_where
        keyword: $from(query_embedding).body.carried.facets.keyword
      template: '{"facet_where": {{ json facet_where }}, "keyword": {{ json keyword }}}'
    signature:
      input: builtin.Message
      emits:
        - {signal: AnalystFacetsPublished, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.RetrievalFacets>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: publish_proposed_facets
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Render the selection's proposed tiers as the retrieval facet filter.
    problem: The model proposes tiers, the machine renders and applies the filter (GH-694); the template is declared, so the proposal cannot shape anything but the tier list.
    goals:
      - Do the one step the description states.
    requirements:
      input: [Command state.]
      output: [Per description.]
      errors: [Declared error signal.]
    non_goals: [None.]
    output: {description: The facet payload.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: ProposedFacetsPublished
      inputs:
        tiers: $from(parsed_selection).body.source_types
      template: '{"facet_where": {"source_type": {"$in": {{ json tiers }}}}, "keyword": ""}'
    signature:
      input: builtin.Message
      emits:
        - {signal: ProposedFacetsPublished, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.RetrievalFacets>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: publish_windowed_facets
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Render the proposed tiers and window as the facet filter.
    problem: The machine renders the proposed window as the filter (GH-730).
    goals:
      - Do the one step the description states.
    requirements:
      input: [Command state.]
      output: [Per description.]
      errors: [Declared error signal.]
    non_goals: [None.]
    output: {description: The facet payload.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: WindowedFacetsPublished
      inputs:
        tiers: $from(parsed_selection).body.source_types
        date_from: $from(parsed_selection).body.date_from
        date_to: $from(parsed_selection).body.date_to
      template: '{"facet_where": {"$and": [{"source_type": {"$in": {{ json tiers }}}}, {"date_key": {"$gte": {{ json date_from }}}}, {"date_key": {"$lte": {{ json date_to }}}}]}, "keyword": ""}'
    signature:
      input: builtin.Message
      emits:
        - {signal: WindowedFacetsPublished, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.RetrievalFacets>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: partition_clearance_refusals
    type: builtin
    init: partition
    visibility: internal
    category: response
    description: Separate sources that refused the requester's clearance from sources that failed.
    problem: |
      A clearance refusal and a broken boundary both leave a source out of the
      answer, and only the first means the remaining sources answered correctly.
      Collapsing them would report an access-control event as an outage, and an
      outage as an access-control event.
    goals:
      - Keep ClearanceRefused distinguishable from QueryRejected and CommandError.
      - Preserve topology order in both sets.
    requirements:
      input:
        - The failed entries come from the query partition, which has already removed the answered ones.
      output:
        - matched contains clearance refusals; unmatched contains rejected and degraded queries.
      errors:
        - An unresolved or malformed partition emits CommandError.
    non_goals:
      - Does not retry a refused source without the filter, which srd010 R4.3 forbids.
      - Does not record anything about what the refusing source withheld.
    output:
      description: Ordered clearance-refused and otherwise-failed query outcomes.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Partitioning changes no external state.}
    config:
      items: $from(partition_query_results).body.unmatched
      field: result.signal
      op: eq
      right: ClearanceRefused
      operand_type: string
      satisfied: ClearanceRefusalsPartitioned
    signature:
      input: builtin.Message
      emits:
        - {signal: ClearanceRefusalsPartitioned, message: builtin.Message<builtin-types-collections.Partition>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: render_clearance_refused_sources
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render the clearance-refused sources as reportable entries.
    problem: A reader has to see that a source was withheld for clearance rather than that it broke.
    goals:
      - Name the source and the outcome.
      - Report nothing about what the filter excluded.
    requirements:
      input:
        - Entries come from the clearance partition and carry the topology entry the fan-out iterated.
      output:
        - Each entry names the source and the refusal.
      errors:
        - Rendering is deterministic.
    non_goals:
      # srd010 R5.3.
      - Does not report the content, the identifiers, or the count of what the filter excluded.
    output: {description: Rendered clearance-refused source entries.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Rendering changes no external state.}
    config:
      items: $from(partition_clearance_refusals).body.matched
      item_template: '{"name": {{ json input.name }}, "signal": {{ json result.signal }}}'
      separator: ","
      signal: ClearanceRefusedSourcesRendered
    signature:
      input: builtin.Message
      emits:
        - {signal: ClearanceRefusedSourcesRendered, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: partition_query_results
    type: builtin
    init: partition
    visibility: internal
    category: response
    description: Separate answered RAG queries from rejected or degraded queries.
    problem: Only successful REST results contain structured chunks and a reported embedding model.
    goals:
      - Preserve topology order in answered and failed sets.
      - Keep QueryRejected distinguishable from CommandError in the unmatched entries.
    requirements:
      input:
        - The for_each join items are selected through one fixed command-state selector.
      output:
        - matched contains QueryResponded items; unmatched contains rejected and degraded items.
      errors:
        - An unresolved or malformed join emits CommandError.
    non_goals:
      - Does not interpret embedding model identity.
    output:
      description: Ordered answered and failed query outcomes.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Partitioning changes no external state.}
    config:
      items: $from(rag_queries).body.items
      field: result.signal
      op: eq
      right: QueryResponded
      operand_type: string
      satisfied: QueryResultsPartitioned
    signature:
      input: builtin.Message
      emits:
        - {signal: QueryResultsPartitioned, message: builtin.Message<builtin-types-collections.Partition>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: partition_embedding_models
    type: builtin
    init: partition
    visibility: internal
    category: response
    description: Keep answered sources whose reported embedding model matches the query model.
    problem: A same-width foreign embedding can return 200, so vector acceptance alone does not prove model compatibility.
    goals:
      - Exclude model-mismatched sources from grounding.
      - Preserve the mismatched entries for explicit response metadata.
    requirements:
      input:
        - Answered join entries expose redacted JSON at result.structured_output.
      output:
        - matched sources may ground the answer; unmatched sources are embedding-model exclusions.
      errors:
        - Missing structured output or model fields emit CommandError.
    non_goals:
      - Does not merge, rank, or rewrite chunks.
    output:
      description: Ordered model-compatible and model-excluded query results.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Partitioning changes no external state.}
    config:
      items: $from(partition_query_results).body.matched
      field: result.structured_output.mapped.embedding_model
      op: eq
      right: $from(declare_query_model).body.model
      operand_type: string
      satisfied: EmbeddingModelsPartitioned
    signature:
      input: builtin.Message
      emits:
        - {signal: EmbeddingModelsPartitioned, message: builtin.Message<builtin-types-collections.Partition>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: render_grounding
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render model-compatible RAG chunks under their topology names.
    problem: Grounding must scale with topology size without indexed compose inputs.
    goals:
      - Render compatible sources in declared order.
      - Produce an empty string when no source survives.
    requirements:
      input:
        - The model-compatible partition is selected through one fixed selector.
      output:
        - Output is the joined per-source grounding text.
      errors:
        - Missing source names or documents emit CommandError.
    non_goals:
      - Does not filter, rank, or merge source arrays.
    output: {description: Joined grounding sections.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Rendering changes no external state.}
    config:
      items: $from(partition_embedding_models).body.matched
      item_template: |-
        [{{ input.name }}]
        {{ json result.structured_output.mapped.documents }}
      separator: "\n\n"
      signal: GroundingRendered
    signature:
      input: builtin.Message
      emits:
        - {signal: GroundingRendered, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_prompt
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Compose the question and rendered compatible grounding sections.
    problem: The answer model needs one fixed prompt independent of the RAG source count.
    goals:
      - Preserve the original question.
      - Include only model-compatible rendered sources.
    requirements:
      input:
        - The question and rendered grounding are selected from command state.
      output:
        - Output is the complete grounding prompt.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not call a model or choose sources.
    output: {description: Grounded answer prompt.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Prompt composition changes no external state.}
    config:
      signal: Composed
      inputs:
        message: $from(chat_message).body.question
        # Addressed by label rather than positionally.
        grounding: $from(render_grounding).$
      template: |
        A user asked the following question:

        {{ message }}

        The following corpus chunks were retrieved to ground the answer. Each item
        is a document; cite the retrieved chunk when you use it. The chunks are
        grouped by the RAG source they came from.

        {{ grounding }}

        Answer the user's question using only these retrieved chunks. If the chunks
        do not contain the answer, say so plainly and do not speculate.
    signature:
      input: builtin.Message
      emits:
        - {signal: Composed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  # The three words below shape the model-compatible partition into the documents list the Cohere chat operation sends (srd009 R3.2).
  - name: flatten_chunks
    type: builtin
    init: flat_map
    visibility: internal
    category: response
    description: Flatten each compatible source's parallel id and chunk arrays into one row per retrieved chunk.
    problem: |
      The rag-server returns chunks as parallel id and document arrays, and
      Command cites the documents it is given. One document per source can only
      be cited as that source, never the passage that carried the assertion
      (srd009 R4.2).
    goals:
      - Zip each source's record ids with its chunk texts, in source and element order.
      - Carry the source name onto every row, so a chunk citation still names the unit that served it.
      - Produce no rows for a source that matched but retrieved nothing.
    requirements:
      input:
        - The model-compatible partition is selected through one fixed selector.
        - The id and chunk paths address the first query's arrays, which is the shape the rag-server returns.
      output:
        - Output is one row per retrieved chunk carrying its id, its text, and its source name.
      errors:
        - A selector that does not resolve, an element field that is not an array, or parallel arrays of differing length emit CommandError.
    non_goals:
      - Does not filter, rank, merge, or retrieve.
      - Does not decide which chunks are composed from; it changes their granularity, not their membership.
    output:
      description: One row per retrieved chunk, with the row count.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Flattening reads prior state and changes no external state.}
    config:
      items: $from(partition_embedding_models).body.matched
      # Ids and chunks arrive as one list per query and the fan-out sends one query, so the first element of each is this source's chunk set.
      element_fields: {id: result.structured_output.mapped.ids.0, text: result.structured_output.mapped.documents.0, metadata: result.structured_output.mapped.metadatas.0}
      carry_fields: {source: input.name}
      signal: ChunksFlattened
    signature:
      input: builtin.Message
      emits:
        - {signal: ChunksFlattened, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.FlattenChunksOutput>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  # The revision re-grounding (GH-604). A revision turn retrieves on the note, so
  - name: check_prior_sources
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Decide whether this turn carries the record ids the prior brief cited.
    problem: A revision turn that names the prior brief's cited records can re-ground its carried claims;
    goals:
      - Branch on the carried prior record ids being present and non-empty, and nothing else.
    requirements:
      input:
        - The ids are read from the intake carry under the shared query_embedding label.
      output:
        - PriorSourcesPresent when ids ride the request, PriorSourcesAbsent otherwise.
      errors:
        - An unresolved carry emits CommandError;
    non_goals:
      - Does not validate, read, or trust the ids;
    output: {description: Predicate outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: A comparison changes nothing.}
    config:
      left: $from(query_embedding).body.carried.prior_record_ids
      op: empty
      satisfied: PriorSourcesAbsent
      unsatisfied: PriorSourcesPresent
    signature:
      input: builtin.Message
      emits:
        - {signal: PriorSourcesAbsent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: PriorSourcesPresent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: declare_prior_read_request
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Publish the prior brief's cited record ids as the read request the document read binds.
    problem: The identifier-in read (srd016 R5.2) takes its ids from the read-request label the document machine publishes;
    goals:
      - Emit a JSON object whose record_ids field is the carried id list, unchanged.
    requirements:
      input:
        - The ids come from the intake carry.
      output:
        - A JSON object with a record_ids array.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not choose which units are read;
    output: {description: The read request.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: PriorReadDeclared
      inputs:
        record_ids: $from(query_embedding).body.carried.prior_record_ids
      template: '{"record_ids": {{ json record_ids }}}'
    signature:
      input: builtin.Message
      emits:
        - {signal: PriorReadDeclared, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.DeclarePriorReadRequestOutput>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: partition_prior_reads
    type: builtin
    init: partition
    visibility: internal
    category: word
    description: Keep the units whose read answered with records.
    problem: A unit that refused the level, rejected the read, or failed carries no record arrays, and flattening it would fail the whole re-grounding rather than drop one unit's account.
    goals:
      - Split the joined reads on the DocumentsRead outcome.
    requirements:
      input:
        - The joined reads are selected through the prior_reads label.
      output:
        - matched holds the units that read;
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not report refused units;
    output: {description: The partitioned reads.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      items: $from(prior_reads).body.items
      field: result.signal
      op: eq
      right: DocumentsRead
      operand_type: string
      satisfied: PriorReadsPartitioned
    signature:
      input: builtin.Message
      emits:
        - {signal: PriorReadsPartitioned, message: builtin.Message<builtin-types-collections.Partition>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: flatten_prior_chunks
    type: builtin
    init: flat_map
    visibility: internal
    category: response
    description: Flatten each unit's read into one row per record, in the shape flatten_chunks produces.
    problem: The read returns flat id, document, and metadata arrays per unit, where the query returns one nested set per query;
    goals:
      - Zip each unit's record ids with its texts and metadata rows, in unit and element order.
    requirements:
      input:
        - The units that read are selected through one fixed selector.
      output:
        - One row per record carrying its id, text, metadata, and source.
      errors:
        - A field that is not an array, or parallel arrays of differing length, emit CommandError.
    non_goals:
      - Does not deduplicate against the note's rows;
    output:
      description: One row per read record, with the row count.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Flattening reads prior state and changes no external state.}
    config:
      items: $from(partition_prior_reads).body.matched
      element_fields: {id: result.structured_output.mapped.ids, text: result.structured_output.mapped.documents, metadata: result.structured_output.mapped.metadatas}
      carry_fields: {source: input.name}
      signal: PriorChunksFlattened
    signature:
      input: builtin.Message
      emits:
        - {signal: PriorChunksFlattened, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.FlattenPriorChunksOutput>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: select_new_prior_ids
    type: builtin
    init: select_subset
    visibility: internal
    category: word
    description: Find the cited record ids the note's own retrieval did not already return.
    problem: A record both retrieved by the note and carried from the prior brief would reach Command twice, and the provider refuses a documents array with a repeated id.
    goals:
      - Match the carried ids against the ids of the note's rows.
    requirements:
      input:
        - The carried ids are the candidates;
      output:
        - unmatched lists the ids the note did not retrieve.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not read records;
    output: {description: The matched and unmatched ids.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      candidates: $from(declare_prior_read_request).body.record_ids
      vocabulary: $from(flatten_chunks).body.items
      match_field: id
      all_matched: PriorIdsAlreadyRetrieved
      partial: NewPriorIdsFound
      empty: NewPriorIdsFound
    signature:
      input: builtin.Message
      emits:
        - {signal: PriorIdsAlreadyRetrieved, message: builtin.Message<builtin-types-collections.SubsetSelection>}
        - {signal: NewPriorIdsFound, message: builtin.Message<builtin-types-collections.SubsetSelection>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: select_new_prior_rows
    type: builtin
    init: select_subset
    visibility: internal
    category: word
    description: Select one read row for each cited id the note did not retrieve.
    problem: The read rows may hold an id twice when two units carry the same record, and only the ids the note missed should join its rows.
    goals:
      - Keep the first read row for each new id, in the carried order.
    requirements:
      input:
        - The new ids are the candidates;
      output:
        - selected holds the rows to join, at most one per id.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not reorder by relevance;
    output: {description: The selected rows.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      candidates: $from(select_new_prior_ids).body.unmatched
      vocabulary: $from(flatten_prior_chunks).body.items
      match_field: id
      all_matched: NewPriorRowsSelected
      partial: NewPriorRowsSelected
      empty: NoPriorRowsRead
    signature:
      input: builtin.Message
      emits:
        - {signal: NoPriorRowsRead, message: builtin.Message<builtin-types-collections.SubsetSelection>}
        - {signal: NewPriorRowsSelected, message: builtin.Message<builtin-types-collections.SubsetSelection>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: render_joined_rows
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render the rows being joined as a comma-separated run of row objects.
    problem: The union of two row lists is textual concatenation of two rendered runs, the same way the RAG and search documents join (compose_documents_augmented).
    goals:
      - Render each row with its id, text, metadata, and source, unchanged.
    requirements:
      input:
        - The rows are selected through the joined_rows label every row-selection word publishes under -- the carried records (GH-604) or one proposed query's (GH-611).
      output:
        - Comma-separated JSON row objects.
      errors:
        - Selector and render failures emit CommandError.
    non_goals:
      - Does not wrap the run in an array;
    output: {description: The rendered rows.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      items: $from(joined_rows).body.selected
      item_template: '{"id": {{ json id }}, "text": {{ json text }}, "metadata": {{ json metadata }}, "source": {{ json source }}}'
      separator: ","
      signal: JoinedRowsRendered
    signature:
      input: builtin.Message
      emits:
        - {signal: JoinedRowsRendered, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: check_note_chunks
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Decide whether the note's own retrieval produced any rows.
    problem: The union joins two rendered runs with a comma, and an empty first run would leave the array starting with one.
    goals:
      - Branch on whether the turn holds any rows yet.
    requirements:
      input:
        - The rows are read from the flatten_chunks label, which holds the flattened rows or an earlier join.
      output:
        - NoteChunksAbsent at zero rows, NoteChunksPresent otherwise.
      errors:
        - An unresolved count emits CommandError.
    non_goals:
      - Does not judge the rows.
    output: {description: Predicate outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: A comparison changes nothing.}
    config:
      left: $from(flatten_chunks).body.items
      op: empty
      satisfied: NoteChunksAbsent
      unsatisfied: NoteChunksPresent
    signature:
      input: builtin.Message
      emits:
        - {signal: NoteChunksAbsent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: NoteChunksPresent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: render_note_rows
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render the note's own rows as a comma-separated run of row objects.
    problem: The note's rows lead the union, so the rerank sees what the instruction asked for first and the carried records after it.
    goals:
      - Render each row with its id, text, metadata, and source, unchanged.
    requirements:
      input:
        - The rows are selected from flatten_chunks.
      output:
        - Comma-separated JSON row objects.
      errors:
        - Selector and render failures emit CommandError.
    non_goals:
      - Does not wrap the run in an array;
    output: {description: The rendered rows.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      items: $from(flatten_chunks).body.items
      item_template: '{"id": {{ json id }}, "text": {{ json text }}, "metadata": {{ json metadata }}, "source": {{ json source }}}'
      separator: ","
      signal: NoteRowsRendered
    signature:
      input: builtin.Message
      emits:
        - {signal: NoteRowsRendered, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_chunk_union
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Wrap the note's rows and the carried rows as one row array.
    problem: Membership was decided by the selection words;
    goals:
      - Keep the note's rows first and the carried rows after them.
    requirements:
      input:
        - Both rendered runs are selected from command state;
      output:
        - A JSON object with an items array.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not reorder or validate the rows.
    output: {description: The joined rows.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: ChunkUnionComposed
      inputs:
        note: $from(render_note_rows).$
        joined: $from(render_joined_rows).$
      template: '{"items": [{{ note }},{{ joined }}]}'
    signature:
      input: builtin.Message
      emits:
        - {signal: ChunkUnionComposed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_joined_chunks
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Wrap the joined rows alone as the row array when the turn holds no rows yet.
    problem: A revision whose instruction retrieved nothing still carries the prior brief's claims, and those keep their sources only if the carried records reach Command.
    goals:
      - Emit the carried rows in the same object shape the union uses.
    requirements:
      input:
        - The rendered carried run is selected from command state.
      output:
        - A JSON object with an items array.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not reorder or validate the rows.
    output: {description: The carried rows.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: ChunkUnionComposed
      inputs:
        joined: $from(render_joined_rows).$
      template: '{"items": [{{ joined }}]}'
    signature:
      input: builtin.Message
      emits:
        - {signal: ChunkUnionComposed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: parse_chunk_union
    type: builtin
    init: parse_structured
    visibility: internal
    category: response
    description: Parse the joined rows into the object every chunk reader selects items from.
    problem: The rerank, the unranked render, and the fused marshalling all read $from(flatten_chunks).body.items;
    goals:
      - Validate the joined rows against the row shape and publish them.
    requirements:
      input:
        - The joined text is selected through the chunk_union_text label both compose words publish under.
      output:
        - An object with an items array of row objects.
      errors:
        - Text that does not parse emits ParseFailed and the turn fails rather than read a malformed row set.
    non_goals:
      - Does not deduplicate or reorder.
    output: {description: The parsed rows.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      source: $from(chunk_union_text).$
      schema:
        type: object
        properties:
          items:
            type: array
            items:
              type: object
              properties:
                id: {type: string}
                text: {type: string}
                metadata: {}
                source: {type: string}
              required: [id, text, source]
        required: [items]
      parsed: ChunkUnionParsed
      unparsed: ParseFailed
    signature:
      input: builtin.Message
      emits:
        - {signal: ChunkUnionParsed, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.ParseChunkUnionOutput>}
        - {signal: ParseFailed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  # The revision's agentic search (GH-611). A revision re-grounded on its
  - name: check_revision_search
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Decide whether this turn is a revision, which is the only turn that searches on its own proposals.
    problem: Agentic search belongs to revision, where accuracy outweighs latency;
    goals:
      - Branch on the carried prior brief's presence, the same predicate check_revision_requested uses.
    requirements:
      input:
        - The prior brief is read from the intake carry.
      output:
        - RevisionSearchRequested for a revision, RevisionSearchSkipped otherwise.
      errors:
        - An unresolved carry emits CommandError;
    non_goals:
      - Does not judge the brief or the instruction.
    output: {description: Predicate outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      left: $from(query_embedding).body.carried.prior_brief
      op: empty
      satisfied: RevisionSearchSkipped
      unsatisfied: RevisionSearchRequested
    signature:
      input: builtin.Message
      emits:
        - {signal: RevisionSearchSkipped, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: RevisionSearchRequested, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_propose_searches_prompt
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: "Compose the message the search proposal reads: the revision instruction and the prior brief."
    problem: The model proposes what the revision needs and the brief lacks, so it has to see both.
    goals:
      - Carry the instruction and the prior brief verbatim.
    requirements:
      input:
        - The instruction is the declared question;
      output:
        - The proposal prompt text.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not propose queries;
    output: {description: The proposal prompt.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: SearchProposalComposed
      inputs:
        instruction: $from(declare_question).body.question
        prior_brief: $from(query_embedding).body.carried.prior_brief
      template: |-
        Revision instruction:
        {{ instruction }}

        Prior brief:
        {{ prior_brief }}
    signature:
      input: builtin.Message
      emits:
        - {signal: SearchProposalComposed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: propose_searches_via_tool
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Ask Command, in one forced tool call, for the retrieval queries the revision needs.
    problem: A revision's own retrieval embeds the instruction alone, so what the brief refers to without the reporting behind it is never fetched;
    goals:
      - Return the tool call whose arguments carry one to three queries.
    requirements:
      input:
        - The prompt is the composed proposal message.
      output:
        - The provider's tool calls.
      errors:
        - Authentication, throttling, and availability failures emit their provider signals;
    non_goals:
      - Does not retrieve;
    output: {description: The provider's tool calls.}
    side_effects:
      - kind: external_api
        target: cohere.chat
        state: read_only
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: A read changes no external state.}
    config:
      rest_ref: cohere_agentic
      operation: propose_searches_tool
    signature:
      input: builtin.Message
      emits:
        - {signal: LLMResponded, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.ProposeSearchesViaToolOutput>}
        - {signal: ProviderUnauthorized, message: builtin.Message<builtin.Text>}
        - {signal: ProviderThrottled, message: builtin.Message<builtin.Text>}
        - {signal: ProviderUnavailable, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: project_proposed_searches
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Project the proposal tool call's arguments, which the parse reads as JSON.
    problem: The provider returns the arguments as a JSON string inside the tool call;
    goals:
      - Emit the one call's arguments string.
    requirements:
      input:
        - The tool calls are selected from the proposal word.
      output:
        - The arguments JSON text.
      errors:
        - Selector and render failures emit CommandError.
    non_goals:
      - Does not validate the queries;
    output: {description: The arguments text.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      items: $from(propose_searches_via_tool).body.mapped.tool_calls
      item_template: '{{ function.arguments }}'
      separator: ""
      signal: ProposalArgumentsProjected
    signature:
      input: builtin.Message
      emits:
        - {signal: ProposalArgumentsProjected, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: parse_proposed_searches
    type: builtin
    init: parse_structured
    visibility: internal
    category: response
    description: "Validate the proposed searches: the declared fields first, second, and third."
    problem: Selectors path into maps only, so the proposals arrive as named fields rather than an array, and each pass reads its own field (GH-611).
    goals:
      - Accept a first query, and optionally a second and a third, and nothing else.
    requirements:
      input:
        - The projected arguments text.
      output:
        - An object whose first, second, and third fields hold the proposed searches.
      errors:
        - A proposal outside the schema emits ParseFailed and the turn composes without the search.
    non_goals:
      - Does not rewrite or filter the queries.
    output: {description: The parsed proposal.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      source: $from(project_proposed_searches).$
      schema:
        type: object
        additionalProperties: false
        properties:
          first: {type: string}
          second: {type: string}
          third: {type: string}
        required: [first]
      parsed: ProposedSearchesParsed
      unparsed: ParseFailed
    signature:
      input: builtin.Message
      emits:
        - {signal: ProposedSearchesParsed, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.ParseProposedSearchesOutput>}
        - {signal: ParseFailed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: search_proposed_query
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Run one proposed query through the mesh's own search surface at the requester's clearance.
    problem: A pass must embed its query and read every declared unit, and the /search surface already does exactly that -- one embed, one fan over the declared topology, the clearance and identity partitions -- so the pass runs it rather than restating it (GH-611).
    goals:
      - Post the pass's query to the declared self search endpoint with the requester's clearance level.
      - Return the search's rows in the row shape the union renders.
    requirements:
      input:
        - The query is read from the proposal_query label the pass's selection publishes under.
        - The clearance level rides the request header from the shared analyst_clearance label, so the search sees exactly the caller's level (srd010 R3.2).
      output:
        - Output holds the search's rows under mapped.results.
      errors:
        - A failed search emits CommandError; the pass abandons itself and the turn keeps its rows.
    non_goals:
      - Does not choose which units are read; the search surface fans over the declared topology itself.
      - Does not deduplicate; the following selection does.
    output: {description: The search's rows.}
    side_effects:
      - kind: external_api
        target: chatbot.search
        state: read_only
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: A read changes no external state.}
    config:
      rest_ref: chatbot_self
      operation: search_proposed
    signature:
      input: builtin.Message
      emits:
        - {signal: ProposalSearched, message: builtin.Message<cohere-chatbot-request-fanout-declarations-types.SearchProposedQueryOutput>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: check_proposal_1
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Decide whether the first proposed search exists.
    problem: Command proposes one to three searches as the declared fields first, second, and third, and a field it did not fill must skip its pass rather than search for nothing.
    goals:
      - Branch on the first field being present and non-empty, and nothing else.
    requirements:
      input:
        - The field is read from the parsed proposal.
      output:
        - ProposalPresent when the field carries a query, ProposalAbsent when it is empty.
      errors:
        - An absent field does not resolve and emits CommandError, which the machine routes exactly as ProposalAbsent.
    non_goals:
      - Does not validate the query text.
    output: {description: Predicate outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: A comparison changes nothing.}
    config:
      left: $from(parse_proposed_searches).body.first
      op: empty
      satisfied: ProposalAbsent
      unsatisfied: ProposalPresent
    signature:
      input: builtin.Message
      emits:
        - {signal: ProposalAbsent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: ProposalPresent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: select_proposal_1
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Publish the first proposed search as the query the self search reads.
    problem: The one self-search operation reads its query through the proposal_query label, so each pass publishes its own field there rather than declaring an operation per field.
    goals:
      - Publish the first field as the text the search operation's mapping selects whole.
    requirements:
      input:
        - The field is read from the parsed proposal.
      output:
        - Output is the proposed search text.
      errors:
        - An unresolved field emits CommandError.
    non_goals:
      - Does not alter the query text.
    output: {description: The query object.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: ProposalQuerySelected
      inputs:
        query: $from(parse_proposed_searches).body.first
      template: '{{ query }}'
    signature:
      input: builtin.Message
      emits:
        - {signal: ProposalQuerySelected, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
