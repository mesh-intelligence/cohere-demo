# The chat-LLM vocabulary a $tool transition may dispatch in the request machine.
#
# This selection is separate from the persistent agent's tools.yaml, and the
# separation is load-bearing rather than tidy. A request machine registers the
# words its transitions name and adds the externally-visible words only if they
# also appear in its profile's selection, so the words below have to be listed
# somewhere for the tier selector's choice to resolve at all.
#
# Listing them in the persistent agent's selection instead makes that agent
# register them, and an invoke_llm word's max_time becomes the whole run's
# budget (agent-core cmd/agent/factories_llm.go onModelResolved, main.go
# runBudget). The chat words declare max_time: 120, so the persistent agent
# would cancel itself after two minutes of an otherwise healthy idle wait.
# GH-86 is that failure; it reached a deployment before anything noticed,
# because every gate drives a turn immediately and stops the agent seconds later.
kind: tool-selection
schema_version: 1
tools:
  - invoke_llm_fast
  - invoke_llm_deep
  - invoke_cohere_command
