        - must emit CommandError for provider setup, model discovery, or chat failures
      side_effects:
        - must call local Ollama POST /api/chat
      undo:
        - must restore conversation history from the pre-call snapshot
      errors:
        - Provider setup, model discovery, and chat failures emit CommandError.
    non_goals:
      - Does not call embedding or RAG endpoints directly.
      - Does not author or alter the retrieved chunks.
    output:
      description: Raw model response text.
    side_effects:
      - kind: external_api_call
        target: ollama.chat
        description: Sends the composed grounding prompt to the configured local model.
      - kind: state_mutation
        target: conversation_history
        state: appended
        description: Appends the model response after a successful provider call.
    reversibility:
      classification: reversible
      requires_confirmation: false
    undo:
      strategy: conversation_truncate
      description: Restore conversation history captured before the model call.
      requires: [conversation_checkpoint]
    errors:
      - signal: CommandError
        condition: provider configuration is invalid, the model is unavailable, or the model call fails
        message_shape: 'invoke_llm: <provider/model>: <error>'
        state_after_failure: conversation history is unchanged unless the provider response was already appended
    relationships:
      after:
        - compose_prompt
        - parse_tier
    config:
      model: "${CHATBOT_DEEP_MODEL:-ornith:9b}"
      dialect: /opt/local/chat-dialect.yaml
      provider_url: "${OLLAMA_URL:-http://localhost:11434}"
      manifest_state: Answering
      response_profile: qwen
      user_prompt_from: "$from(compose_prompt)"
      answer_only: true
      max_time: 120
      llm_timeout: 120
      system_prompt: |
        You are a chatbot that answers a user's question using only the corpus
        chunks retrieved from a RAG server. The user question and the retrieved
        chunks arrive together in the message as a composed grounding prompt.

        Rules:
        - Answer only from the retrieved chunks. Do not use outside knowledge.
        - If the retrieved chunks do not contain the answer, say so plainly.
        - Cite the chunk identity (the record id) for each claim you make.
        - Keep the answer concise and grounded; do not speculate beyond the chunks.
    signature:
      emits:
        - {signal: LLMResponded, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: invoke_cohere_command
    type: builtin
    init: rest_client_invoke
    visibility: external
    category: boundary
    description: Compose the command-staff brief with Cohere Command over the retrieved documents.
    problem: A concatenated prompt string makes attribution a property of the prose; composing over documents makes it a property of the answer.
    goals:
      - Send the tasking and the retrieved documents to the Cohere chat operation.
      - Join the existing chat-LLM words so the tier selector reaches this path through the established $tool indirection.
      - Return the content blocks and the citation spans for the states that follow.
    requirements:
      input:
        - The tasking is read from the seeded request through command state.
        - The documents array is read from the validated parse_documents output.
      output:
        - Output carries the mapped content blocks, citations, and finish reason.
        - A provider transport, authentication, or rate-limit failure emits its own signal rather than a generic error.
      side_effects:
        - Calls the declared Cohere chat operation and nothing else.
      undo:
        - Composing a brief mutates nothing; the operation is read-only at the provider.
      errors:
        - A transport, authentication, or rate-limit failure emits its own provider signal; a request, egress, or mapping failure emits CommandError.
    non_goals:
      - Does not retrieve, rerank, or alter the retrieved chunks.
      - Does not accept a runtime method, URL, host, credential, or model override.
      - Does not surface the citations it returns; the citation chain that follows composition does.
    output:
      description: Mapped Cohere chat result carrying content blocks and citation spans.
    side_effects:
      - kind: external_api
        target: cohere.chat
        state: read_only
        description: Sends the tasking and the retrieved documents to the configured Cohere chat operation.
    reversibility:
      classification: reversible
      requires_confirmation: false
    undo:
      strategy: noop
      description: Composing a brief changes no external state.
    errors:
      - signal: ProviderUnauthorized
        condition: the credential is absent, malformed, or refused
        state_after_failure: no brief was composed; the turn falls back to the default chat-LLM word
      - signal: ProviderThrottled
        condition: the provider rate-limited the request
        state_after_failure: no brief was composed; the turn falls back to the default chat-LLM word
      - signal: ProviderUnavailable
        condition: the provider returned a server error
        state_after_failure: no brief was composed; the turn falls back to the default chat-LLM word
      - signal: CommandError
        condition: the request could not be built, the host is outside the declared allowlist, or the response did not map
        state_after_failure: no brief was composed
    relationships:
      after:
        - parse_documents
        - parse_tier
    config:
      rest_ref: cohere
      operation: compose_brief
    signature:
      input: builtin.Message
      emits:
        - {signal: BriefComposed, message: builtin.Message<chatbot-request-declarations-types.InvokeCohereCommandOutput>}
        - {signal: ProviderUnauthorized, message: builtin.Message<builtin.Text>}
        - {signal: ProviderThrottled, message: builtin.Message<builtin.Text>}
        - {signal: ProviderRejected, message: builtin.Message<builtin.Text>}
        - {signal: ProviderUnavailable, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: partition_brief_blocks
    type: builtin
    init: partition
    visibility: internal
    category: response
    description: Divide the returned content blocks by type, keeping the text blocks.
    problem: |
      The assistant turn is a list of typed content blocks, and not every block
      carries text: a reasoning model returns a thinking block whose only
      payload key is thinking, ahead of the text block (measured live
      2026-08-29). Joining every block through one template faulted on the
      first thinking block, which is why the chat model was pinned to a
      non-reasoning one; selecting on type here is what retires that pin as a
      constraint.
    goals:
      - Keep the text blocks, in order, for capture_brief to join.
      - Preserve the non-text blocks in the unmatched set rather than faulting on them.
    requirements:
      input:
        - The content block array is selected from the invoke_cohere_command result.
      output:
        - matched holds the text blocks; unmatched holds every other type.
      errors:
        - A block without a type, or an unreadable array, emits CommandError.
    non_goals:
      - Does not read, render, or surface the thinking blocks; they are withheld from the response.
      - Does not edit or re-order the text blocks.
    output:
      description: Content blocks divided by type.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Partitioning changes no external state.}
    config:
      items: $from(invoke_cohere_command).body.mapped.content
      field: type
      op: eq
      right: text
      operand_type: string
      satisfied: BriefBlocksPartitioned
    signature:
      input: builtin.Message
      emits:
        - {signal: BriefBlocksPartitioned, message: builtin.Message<builtin-types-collections.Partition>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: capture_brief
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Join the Cohere content blocks into the answer text the response composes.
    problem: compose_response reads the previous result whole, and a REST result is a mapped object rather than the text the Ollama words emit.
    goals:
      - Concatenate every text block Command returned, in order.
      - Present the Cohere path and the Ollama path to compose_response in the same shape.
    requirements:
      input:
        - The text blocks are selected from the partition_brief_blocks matched set.
      output:
        - Output is the joined brief text.
      errors:
        - A block without text emits CommandError.
    non_goals:
      - Does not edit, summarize, or re-order the composed brief.
      - Does not read or resolve the citation spans; flatten_citations and the words after it do.
    output: {description: Joined brief text.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Joining text changes no external state.}
    config:
      # The text blocks alone, already selected by type: partition_brief_blocks runs first, so a reasoning model's thinking block never reaches this template.
      items: $from(partition_brief_blocks).body.matched
      item_template: "{{ text }}"
      separator: ""
      signal: BriefCaptured
    signature:
      input: builtin.Message
      emits:
        - {signal: BriefCaptured, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: declare_read_request
    type: builtin
    # compose, the same way the other declaration words publish trusted values: the runtime's builtin set has no separate declare init, and a request machine registers its tools at request time, so the wrong name here was invisible to the boot smoke and surfaced only when the boundary was first called end to end.
    init: compose
    visibility: internal
    category: response
    description: Put the seeded read parameters into command state so the fan-out binds them by selector.
    problem: |
      The read boundary is dispatched once per declared unit, and every dispatch
      must bind the same identifiers or the same filter. Reading them from the
      seeded request inside the loop would let each item see a different value;
      declaring them once is what makes the fan-out uniform.
    goals:
      - Publish the caller's identifiers and filter under one label the fan-out reads.
      - Carry the seeded level forward for the clearance words, which run after this word and cannot reach the seeded body themselves.
    requirements:
      input:
        - The values come from the trusted read endpoint's seeded body.
      output:
        - Output carries the record identifiers, the caller's filter, and the seeded level.
      errors:
        - Declaring configured JSON is deterministic.
    non_goals:
      - Does not read any record.
      - Does not derive, validate, or widen the clearance level; it carries what the authenticated header seeded, exactly as the embed words do on the chat turn.
    output:
      description: The seeded read parameters.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Declaring request parameters changes no external state.}
    config:
      signal: ReadRequestDeclared
      # The machine seed's body is the mapped request (srd066 R1.2), so a
      # compose word addresses its fields directly.
      inputs:
        record_ids: $.record_ids
        document_filter: $.document_filter
        max_clearance: $.max_clearance
      template: '{"record_ids": {{ json record_ids }}, "document_filter": {{ json document_filter }}, "max_clearance": {{ json max_clearance }}}'
    signature:
      input: builtin.Message
      emits:
        - {signal: ReadRequestDeclared, message: builtin.Message<chatbot-request-declarations-types.DeclareReadRequestOutput>}
  - name: declare_requested_read_clearance
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Put the read's seeded level into command state as the candidate for the window lookup.
    problem: |
      The chat turn's requested-clearance word reads the level off the embed
      carry, and a document read runs no embed. This is the read machines' leg
      of the same step, reading the level the read declaration carried, and it
      runs under the shared declare_requested_clearance label so the words
      after it bind one selector on both machines.
    goals:
      - Publish the seeded level in the shape the window lookup consumes.
    requirements:
      input:
        - The level comes from the read declaration's carry, never from a body field.
      output:
        - Output carries the level as a one-entry candidate list.
      errors:
        - Rendering configured JSON is deterministic.
    non_goals:
      - Does not validate, raise, or default the level.
    output:
      description: The requested level as a candidate list.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Declaring a candidate changes no external state.}
    config:
      signal: RequestedClearanceDeclared
      inputs:
        level: $from(read_request).body.max_clearance
      template: '{"names": [{{ json level }}]}'
    signature:
      input: builtin.Message
      emits:
        - {signal: RequestedClearanceDeclared, message: builtin.Message<chatbot-request-declarations-types.DeclareRequestedReadClearanceOutput>}
  - name: read_documents
    type: builtin
    init: rest_client_invoke
    # Internal like rag_query: machines dispatch it by transition (the document
    # routes and the chat turn's revision re-grounding, GH-604), never the tier
    # selector's $tool.
    visibility: internal
    category: boundary
    description: Read the named records from one RAG unit's document boundary.
    problem: |
      A citation names a record identifier and the analyst needs the record. The
      read has to go through this agent because the requester's clearance is
      established here, at the authenticated request boundary, and a path that
      goes around it has no authenticated level to enforce (srd010 R3.1).
    goals:
      - Read the caller's identifiers from the unit the fan-out is on.
      - Bind the analyst clearance uniformly across every dispatch.
    requirements:
      input:
        - The address comes from the declared topology item; the level comes from the clearance words.
      output:
        - Output includes the records the unit returned and the level it enforced.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not choose which units are read.
      - Does not accept a clearance level from the request.
    output:
      description: One unit's read result.
    side_effects:
      - kind: external_api
        target: rag_server.documents
        state: read_only
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading documents does not mutate state.}
    config:
      rest_ref: rag_documents
      operation: documents
    signature:
      input: builtin.Message<chatbot-request-declarations-types.ReadDocumentsInput>
      emits:
        - {signal: DocumentsRead, message: builtin.Message<chatbot-request-declarations-types.ReadDocumentsOutput>}
        - {signal: ReadRejected, message: builtin.Message<builtin.Text>}
        - {signal: ClearanceRefused, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: read_documents_by_filter
    type: builtin
    init: rest_client_invoke
    category: boundary
    description: Read the records matching the caller's filter from one RAG unit's document boundary.
    problem: |
      Listing a document's versions and querying the corpus by facet carry no
      identifier, and the unit serves them on a separate boundary because an
      empty identifier list is not an absent restriction.
    goals:
      - Read the matching records from the unit the fan-out is on.
      - Bind the analyst clearance uniformly across every dispatch.
    requirements:
      input:
        - The address comes from the declared topology item; the level comes from the clearance words.
      output:
        - Output includes the records the unit returned and the level it enforced.
      errors:
        - Network, timeout, schema, and mapping failures emit CommandError.
    non_goals:
      - Does not choose which units are read.
      - Does not accept a clearance level from the request.
    output:
      description: One unit's read result.
    side_effects:
      - kind: external_api
        target: rag_server.documents
        state: read_only
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Reading documents does not mutate state.}
    config:
      rest_ref: rag_documents
      operation: documents_query
    signature:
      input: builtin.Message<chatbot-request-declarations-types.ReadDocumentsByFilterInput>
      emits:
        - {signal: DocumentsRead, message: builtin.Message<chatbot-request-declarations-types.ReadDocumentsByFilterOutput>}
        - {signal: ReadRejected, message: builtin.Message<builtin.Text>}
        - {signal: ClearanceRefused, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: render_read_records
    type: builtin
    init: render_each
    visibility: internal
    category: response
    description: Render each unit's read as the served record shape, keeping the mapped response and dropping the join bookkeeping.
    problem: |
      A join entry carries its unit's output twice -- the digest string and the
      structured copy -- beside the topology item it was dispatched to. Served
      whole, the envelope listing more than doubles, and the in-cluster address
      rides to the browser. The interface reads one path,
      result.structured_output.mapped, and this renders exactly that.
    goals:
      - Keep each unit's name, outcome signal, and mapped read.
      - Leave the topology entry, and the address in it, inside the mesh.
    requirements:
      input:
        - The entries are the document-read join.
      output:
        - Output is the served record objects, comma separated.
      errors:
        - An entry missing the projected fields emits CommandError.
    non_goals:
      - Does not filter, reorder, or count the entries.
    output: {description: Rendered read records.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Rendering changes no external state.}
    config:
      items: $from(document_reads).body.items
      item_template: '{"name": {{ json input.name }}, "result": {"signal": {{ json result.signal }}, "structured_output": {"mapped": {{ json result.structured_output.mapped }}}}}'
      separator: ","
      signal: ReadRecordsRendered
    signature:
      input: builtin.Message
      emits:
        - {signal: ReadRecordsRendered, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_read_response
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Merge the units' read results into one response body naming the level enforced.
    problem: |
      The fan-out returns one result per declared unit and the caller gets one
      response. The merge has to report the level that was enforced and must not
      report what any unit withheld -- a count of records a requester did not
      receive maps the corpus they are not cleared to read (srd016 R7.2).
    goals:
      - Flatten the units' records into one list.
      - Report the enforced level as the units reported it.
    requirements:
      input:
        - Records come from the joined fan-out; the level comes from the clearance words.
      output:
        - Output carries the records and the enforced level and nothing about what was withheld.
      errors:
        - Rendering configured JSON is deterministic.
    non_goals:
      - Does not report a withheld count, identifier, or content.
      - Does not report a matched total beside a returned total, from which a withheld count follows by subtraction (srd016 R7.3).
    output:
      description: The merged read response.
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Composing a response changes no external state.}
    config:
      signal: ReadResponseComposed
      inputs:
        # The rendered projections, not the raw join entries: an entry carries its output twice (the digest string and the structured copy) plus the topology it was dispatched to, and merging entries whole more than doubled the envelope listing past any sane listener bound.
        reads: $from(render_read_records).$
        level: $from(analyst_clearance).body.level
      template: '{"records": [{{ reads }}], "clearance_enforced_at": {{ json level }}}'
    signature:
      input: builtin.Message
      emits:
        - {signal: ReadResponseComposed, message: builtin.Message<chatbot-request-declarations-types.ComposeReadResponseOutput>}
  - name: check_revision_requested
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Decide whether this turn revises a retained prior draft.
    problem: A second turn's job is inducing change in the generated document, and whether a prior draft rides the request is a fact the machine should branch on, not a classification (GH-446).
    goals:
      - Branch on the carried prior draft's presence and nothing else.
    requirements:
      input:
        - The prior draft is read from the embed carry under the shared query_embedding label.
      output:
        - The presence outcome as the predicate's structured output.
      errors:
        - An unresolved carry emits CommandError; the machine degrades to the plain turn.
    non_goals:
      - Does not read, judge, or alter the draft.
    output: {description: Predicate outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: A comparison changes nothing.}
    config:
      left: $from(query_embedding).body.carried.prior_brief
      op: empty
      satisfied: RevisionAbsent
      unsatisfied: RevisionRequested
    signature:
      input: builtin.Message
      emits:
        - {signal: RevisionAbsent, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: RevisionRequested, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: declare_revision_question
    type: builtin
    init: pipeline
    visibility: internal
    category: word
    description: Fuse the revision instruction with the retained prior draft under the shared chat_message label.
    problem: The chat model must see the instruction against the draft it revises, while retrieval, rerank, and source selection keep scoring the bare instruction -- so the fused text stands under its own label and only the prompt consumers read it (GH-446).
    goals:
      - Publish the revision question the chat_message consumers read, leaving the declared question untouched.
    requirements:
      input:
        - The instruction is the declared question; the prior draft rides the embed carry.
      output:
        - A JSON object whose question field carries the fused revision tasking.
      errors:
        - Selector failures emit CommandError; the machine degrades to the plain turn.
    non_goals:
      - Does not retrieve, embed, or alter what the rerank scores.
    output: {description: Fused revision question under the shared label.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: RevisionQuestionDeclared
      stages:
        - name: fuse_text
          init: compose
          config:
            signal: RevisionTextComposed
            inputs:
              instruction: $from(declare_question).body.question
              prior_brief: $from(query_embedding).body.carried.prior_brief
            template: |-
              Revise the prior intelligence brief according to this instruction.
              Return the complete revised brief, never only the changed part. Keep
              everything the instruction does not touch, keep every citation that
              still applies, and keep these template headings exactly: Bottom Line
              Up Front, Threat Activity, Gaps, Outlook. Material the instruction
              adds goes under its own new heading placed among them.

              Instruction:
              {{ instruction }}

              Prior brief:
              {{ prior_brief }}
        - name: wrap_question
          init: compose
          config:
            signal: RevisionQuestionDeclared
            inputs: {fused: $.}
            template: '{"question": {{ json fused }}}'
    signature:
      input: builtin.Message
      emits:
        - {signal: RevisionQuestionDeclared, message: builtin.Message<chatbot-request-declarations-types.DeclareQuestionOutput>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_summary_prompt
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Compose the summarization prompt from the seeded document.
    problem: The /summarize command answers over the document the window holds, so the prompt is composed from the seeded request body alone (GH-448).
    goals:
      - Wrap the document with the summarization instruction.
    requirements:
      input:
        - The document is selected from the seeded request parameters.
      output:
        - The prompt text the Command model reads.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not retrieve or alter the document.
    output: {description: Summarization prompt.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: SummaryPromptComposed
      inputs:
        # The trusted request input is addressable as the seed entry's parameters (srd030 R3.2); the bare $.document form is the REST-client convention, not compose's.
        document: $from(seed).body.document
      template: |-
        Summarize the following intelligence document for a command-staff
        reader. Keep the key judgements, name the actors and dates the
        document names, and stay strictly within what it states -- do not add
        outside knowledge and do not speculate. Answer as a short paragraph
        followed by up to five bullet points.

        Document:
        {{ document }}
    signature:
      input: builtin.Message
      emits:
        - {signal: SummaryPromptComposed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: summarize_with_cohere
    type: builtin
    init: invoke_llm
    visibility: internal
    category: boundary
    description: Summarize the composed document with the Cohere Command model.
    problem: The /summarize command exists to show the chat model isolated, so the call carries the composed prompt and nothing else -- no documents mode, no citations (GH-448).
    goals:
      - Answer the summarization prompt with the same Command model the brief uses.
    requirements:
      input:
        - The composed prompt is selected from command state.
      output:
        - The model's summary text.
      errors:
        - Provider configuration, credential, transport, and model failures emit CommandError.
    non_goals:
      - Does not compose the brief; invoke_cohere_command stays the brief's word.
    output: {description: The model's summary text.}
    side_effects:
      - {kind: external_api, state: read_only, target: cohere.chat}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Conversation history is request-scoped.}
    config:
      dialect: /opt/providers/chat-dialect.yaml
      provider_url: ${COHERE_BASE_URL:-https://api.cohere.com}
      model: ${COHERE_CHAT_MODEL:-command-a-03-2025}
      response_profile: cohere
      answer_only: true
      manifest_state: Summarizing
      user_prompt_from: $from(compose_summary_prompt).$
      system_prompt: |
        You summarize intelligence documents. Follow the instruction in the
        message exactly and answer with the summary alone.
      max_time: 60
      llm_timeout: 60
    signature:
      input: builtin.Message
      emits:
        - {signal: LLMResponded, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_summary_response
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Wrap the summary as the /summarize response body.
    problem: The HTTP reply needs one JSON object carrying the summary text (GH-448).
    goals:
      - Compose the summary under the key the endpoint maps.
    requirements:
      input:
        - The summary is the previous result.
      output:
        - The response body the summarize endpoint maps.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not judge or trim the summary.
    output: {description: Summarize response body.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: SummaryResponseComposed
      inputs:
        summary: $.
      template: '{"summary": {{ json summary }}}'
    signature:
      input: builtin.Message
      emits:
        - {signal: SummaryResponseComposed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_audit_prompt
    type: builtin
    init: compose
    visibility: internal
    category: word
    description: Compose the judge prompt from the seeded claim and document.
    problem: The /audit command verifies one cited span against the chunk it cites, so the prompt carries both seeded texts and nothing else (GH-543).
    goals:
      - Wrap the claim and document with the scoring instruction.
    requirements:
      input:
        - The claim and document are selected from the seeded request parameters.
      output:
        - The prompt text the judge reads.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not retrieve or alter either text.
    output: {description: Judge prompt.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: AuditPromptComposed
      inputs:
        claim: $from(seed).body.summary
        document: $from(seed).body.document
      template: |-
        Does the document support this statement? Rate 1 to 10: 10 means
        the document fully supports every element of the statement, 1 means
        the document contradicts it or does not mention it. If any number,
        date, or place in the statement conflicts with the document, score 3
        or lower. The statement is not a summary — omissions are not errors;
        judge support only, and only against the document. Reply with the
        number first, then one short reason.

        Statement:
        {{ claim }}

        Document:
        {{ document }}
    signature:
      input: builtin.Message
      emits:
        - {signal: AuditPromptComposed, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: judge_with_cohere
    type: builtin
    init: invoke_llm
    visibility: internal
    category: boundary
    description: Score the claim against its document with the Cohere classifier tier.
    problem: The audit's judge must be a different, cheaper call than the model that composed the brief, so the classifier tier scores it (GH-543).
    goals:
      - Answer the judge prompt with a 1-10 verdict and one reason.
    requirements:
      input:
        - The composed judge prompt is selected from command state.
      output:
        - The model's verdict text.
      errors:
        - Provider configuration, credential, transport, and model failures emit CommandError.
    non_goals:
      - Does not compose or revise the brief.
    output: {description: The verdict text.}
    side_effects:
      - {kind: external_api, state: read_only, target: cohere.chat}
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Conversation history is request-scoped.}
    config:
      dialect: /opt/providers/chat-dialect.yaml
      provider_url: ${COHERE_BASE_URL:-https://api.cohere.com}
      model: ${COHERE_CLASSIFIER_MODEL:-command-r7b-12-2024}
      response_profile: cohere
      answer_only: true
      manifest_state: Judging
      user_prompt_from: $from(compose_audit_prompt).$
      system_prompt: |
        You verify summaries against documents. Follow the instruction in
        the message exactly and answer with the score and reason alone.
      max_time: 45
      llm_timeout: 45
    signature:
      input: builtin.Message
      emits:
        - {signal: LLMResponded, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: compose_audit_response
    type: builtin
    init: compose
    visibility: internal
    category: response
    description: Wrap the verdict as the /audit response body.
    problem: The endpoint maps the terminal output to JSON, so the verdict must arrive as one JSON document (GH-543).
    goals:
      - Publish the verdict under the response label.
    requirements:
      input:
        - The verdict is selected from the judge's label.
      output:
        - One JSON object carrying the verdict.
      errors:
        - Selector failures emit CommandError.
    non_goals:
      - Does not judge or alter the verdict.
    output: {description: Response body.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Pure.}
    config:
      signal: AuditResponseComposed
      inputs:
