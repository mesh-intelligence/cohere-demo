kind: machine
schema_version: 1
name: cohere-rerank-refused-critic
purpose: |-
  Critiques the rerank pass against isolated mock dependencies, scripting the
  rerank endpoint and requiring the turn to report degraded.

  The outcome is the assertion because nothing else carries it. A degraded turn
  and a reranked one both return 200 with a composed brief over the same chunks
  in a different order, which a reader cannot see and the answer cannot show
  (srd009 R5.4).

  What a mock cannot be evidence about is whether reranking improves retrieval:
  it returns whatever ordering its fixture declares. That is the live probe's
  job, and it is recorded on GH-130.
configuration:
  machine: machine.yaml
  tools: tools.yaml
initial_state: Idle
budget:
  command_timeout: 2m
  max_iterations: 8
states:
  - name: Idle
    meaning: Before the chatbot is driven.
  - name: Checking
    meaning: The turn has run; its signal decides whether the outcome is read.
  - name: ComposingReport
    meaning: The reported outcome is being composed into a comparable line.
  - name: Asserting
    meaning: The composed report is being compared against the scripted outcome.
  - name: Passed
    run_status: succeeded
    meaning: Terminal. The turn reported the degraded ordering.
  - name: Failed
    run_status: failed
    meaning: Terminal. The turn reported the wrong ordering outcome, or did not answer.
terminal_states: [Passed, Failed]
signals:
  - name: Seed
    trigger: Loop initialization.
  - name: SubjectAnswered
    trigger: The chatbot returned an answer for the turn.
  - name: SubjectBroke
    trigger: The chatbot reported a command error.
  - name: ReportComposed
    trigger: The reported outcome was composed into one line.
  - name: ReportMatched
    trigger: The reported outcome matches the scripted one.
  - name: ReportMismatched
    trigger: The reported outcome differs from the scripted one.
  - name: CommandError
    trigger: The chatbot was unreachable, returned an unmapped status, or a citation list could not be read.
transitions:
  - {state: Idle, signal: Seed, next: Checking, action: drive_chat_turn}
  - {state: Checking, signal: SubjectAnswered, next: ComposingReport, action: compose_rerank_report}
  - {state: Checking, signal: SubjectBroke, next: Failed}
  - {state: Checking, signal: CommandError, next: Failed}
  - {state: ComposingReport, signal: ReportComposed, next: Asserting, action: assert_rerank_report}
  - {state: ComposingReport, signal: CommandError, next: Failed}
  - {state: Asserting, signal: ReportMatched, next: Passed}
  - {state: Asserting, signal: ReportMismatched, next: Failed}
  - {state: Asserting, signal: CommandError, next: Failed}
