# The chatbot ships fixed listeners: chat on 18080, lifecycle control and
# health on 18081. Its client limits and its chat words' provider_url allow
# only the real dependency ports, so every mock is pinned to stand exactly
# where the real service stands: the LLM provider at 11434, the RAG servers
# at 18085 and 18095.
#
# The Cohere client is the exception, and deliberately so. Its base URL and its
# egress allowlist are one deployment-supplied pair (srd009 R1.2, R1.4), which
# is what lets a private in-boundary deployment differ from the hosted endpoint
# by configuration alone. The same pair is what lets this scenario stand a mock
# on loopback: fixture_env publishes the mock's base URL, and env moves the
# allowlist to match it. Pinning the allowlist while leaving the base URL
# configurable would leave the mock unreachable and the sovereignty claim
# untestable.
subject_address: 127.0.0.1:18080
subject_health_path: http://127.0.0.1:18081/api/lifecycle/health
fixture_address:
  llm: 127.0.0.1:11434
  rag0: 127.0.0.1:18085
  rag1: 127.0.0.1:18095
  cohere: 127.0.0.1:18120
fixture_env:
  cohere: COHERE_BASE_URL
env:
  - COHERE_HOST=127.0.0.1
  - COHERE_SCHEME=http
  - COHERE_PORT=18120
  # The mock does not verify the bearer. A literal value here proves the
  # credential resolves by reference through the declared token_ref; the live
  # target proves it against the real provider.
  - COHERE_API_KEY=scenario-not-a-real-key
