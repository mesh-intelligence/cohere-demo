kind: tool-declaration
schema_version: 1
unit: cohere-command-declarations
imports:
  - /opt/agent-core/tools/units/types-collections.yaml
  - declarations-types.yaml
tools:
  - name: drive_chat_turn
    type: builtin
    init: rest_client_invoke
    visibility: internal
    category: boundary
    description: Post one tasking to the chatbot the rig started and map its answer.
    problem: The Cohere composition tier must be proven against controlled dependencies rather than the live provider.
    goals:
      - Post a tasking to the chatbot at the address the rig published.
      - Map the answer so the assertion can compare it.
    requirements:
      input:
        - Tool config fixes the operation; the tasking is literal fixture data.
      output:
        - Output reports the answer field of the turn response.
      errors:
        - Unreachable or unmapped responses emit CommandError.
    non_goals:
      - Does not start or stop the chatbot; the rig owns that.
      - Does not inspect which word answered; the assertion does that by comparison.
    output:
      description: The chatbot's turn response.
    side_effects:
      - kind: external_api
        target: chatbot.chat
        state: read_only
    reversibility:
      classification: reversible
    undo:
      strategy: noop
      description: A chat turn against mocks changes nothing durable.
    errors:
      - signal: CommandError
        condition: The chatbot is unreachable or returns an unmapped status.
        state_after_failure: No state changes.
    config:
      rest_ref: subject
      operation: chat_turn
    signature:
      input: builtin.Message
      emits:
        - {signal: SubjectAnswered, message: builtin.Message<cohere-command-declarations-types.DriveChatTurnOutput>}
        - {signal: SubjectBroke, message: builtin.Message<builtin.Text>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
  - name: assert_brief
    type: builtin
    init: value_predicate
    visibility: internal
    category: word
    description: Compare the returned answer against the brief the mock Cohere endpoint composed.
    problem: A 200 with an answer proves a turn ran, not that the Cohere tier answered it.
    goals:
      - Pass only when the answer is exactly the joined text of the mock's two content blocks.
      - Separate an unreadable answer from a mismatched one.
    requirements:
      input:
        - The answer is read from the mapped drive_chat_turn output.
      output:
        - BriefMatched when the answer equals the mock brief; BriefMismatched otherwise.
      errors:
        - An unresolvable or uncoercible answer emits CommandError rather than BriefMismatched.
    non_goals:
      - Does not inspect spans, citations, or source metadata.
    output: {description: Comparison outcome.}
    side_effects: []
    reversibility: {classification: reversible}
    undo: {strategy: noop, description: Comparing a value changes no external state.}
    config:
      left: $from(drive_chat_turn).body.mapped.answer
      op: eq
      # The two content blocks of mocks/cohere.yaml, joined. An Ollama fallback
      # answer, or a REST result that reached the response without being
      # normalized, is not equal to this string.
      right: "ASSESSMENT: the corpus describes the rig subject. GAPS: no reporting addresses timelines."
      operand_type: string
      satisfied: BriefMatched
      unsatisfied: BriefMismatched
    signature:
      input: builtin.Message
      emits:
        - {signal: BriefMatched, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: BriefMismatched, message: builtin.Message<builtin-types-collections.Comparison>}
        - {signal: CommandError, message: builtin.Message<builtin.Text>}
