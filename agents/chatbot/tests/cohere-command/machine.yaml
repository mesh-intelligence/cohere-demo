kind: machine
schema_version: 1
name: cohere-command-critic
purpose: |-
  Critiques one chat turn answered on the Cohere Command tier against isolated
  mock dependencies. The mocked tier selector names invoke_cohere_command, the mock
  Cohere endpoint returns a two-block brief, and the turn passes only when the
  answer is exactly the joined text of those two blocks.

  Equality against the mock's own brief is what makes this a Cohere proof rather
  than an answered-a-turn proof. A turn that fell back to an Ollama word still
  returns 200 with a fluent answer, and a turn whose REST result reached the
  response unnormalized still returns 200 with a populated answer field; both
  fail this comparison. Two content blocks rather than one because the capture
  word joins the block array, and a word that took the first block and dropped
  the rest would satisfy a prefix check.

  The drive runs on the way into Checking so its signal decides the outcome,
  and the assertion runs on the way into Asserting for the same reason.
configuration:
  machine: machine.yaml
  tools: tools.yaml
initial_state: Idle
budget:
  command_timeout: 2m
  max_iterations: 8
states:
  - name: Idle
    meaning: Before the chatbot is driven.
  - name: Checking
    meaning: The turn has run; its signal decides whether the answer is compared.
  - name: Asserting
    meaning: The answer is being compared against the mock Cohere brief.
  - name: Passed
    run_status: succeeded
    meaning: Terminal. The turn was answered by the Cohere tier with the composed brief.
  - name: Failed
    run_status: failed
    meaning: Terminal. The turn did not answer, or did not answer with the Cohere brief.
terminal_states: [Passed, Failed]
signals:
  - name: Seed
    trigger: Loop initialization.
  - name: SubjectAnswered
    trigger: The chatbot returned an answer for the turn.
  - name: SubjectBroke
    trigger: The chatbot reported a command error.
  - name: BriefMatched
    trigger: The answer equals the joined mock Cohere brief.
  - name: BriefMismatched
    trigger: The answer differs from the mock Cohere brief, so another word answered or the brief was not normalized.
  - name: CommandError
    trigger: The chatbot was unreachable, returned an unmapped status, or the answer could not be read.
transitions:
  - state: Idle
    signal: Seed
    next: Checking
    action: drive_chat_turn
  - state: Checking
    signal: SubjectAnswered
    next: Asserting
    action: assert_brief
  - state: Checking
    signal: SubjectBroke
    next: Failed
  - state: Checking
    signal: CommandError
    next: Failed
  - state: Asserting
    signal: BriefMatched
    next: Passed
  - state: Asserting
    signal: BriefMismatched
    next: Failed
  - state: Asserting
    signal: CommandError
    next: Failed
