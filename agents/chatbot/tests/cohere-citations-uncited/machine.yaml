kind: machine
schema_version: 1
name: cohere-citations-uncited-critic
purpose: |-
  Critiques the uncited outcome against isolated mock dependencies. The mock
  Cohere endpoint composes a brief and cites nothing, and the turn passes only
  when the response surfaces no citation and reports no drop.

  Both halves are required, and the second is the point. A turn whose citations
  were all dropped also surfaces none, so surfacing nothing is not by itself the
  uncited outcome -- what separates them is that this turn reports no drop
  either. A response carrying one list could not tell the two apart, and a
  reader would not know whether the provider cited nothing or cited only
  sources the turn could not vouch for (srd009 R4.5).

  The arrays are compared by rendering them, because a selector walks maps and
  cannot index an array.
configuration:
  machine: machine.yaml
  tools: tools.yaml
initial_state: Idle
budget:
  command_timeout: 2m
  max_iterations: 8
states:
  - name: Idle
    meaning: Before the chatbot is driven.
  - name: Checking
    meaning: The turn has run; its signal decides whether the citations are read.
  - name: RenderingSurfaced
    meaning: The surfaced citation ids are being rendered for comparison.
  - name: RenderingDropped
    meaning: The reported drop reasons are being rendered for comparison.
  - name: ComposingReport
    meaning: The two lists are being composed into one comparable line.
  - name: Asserting
    meaning: The composed report is being compared against the scripted outcome.
  - name: Passed
    run_status: succeeded
    meaning: Terminal. The turn surfaced no citation and reported no drop.
  - name: Failed
    run_status: failed
    meaning: Terminal. A citation was surfaced or a drop reported for a brief the provider cited nothing for.
terminal_states: [Passed, Failed]
signals:
  - name: Seed
    trigger: Loop initialization.
  - name: SubjectAnswered
    trigger: The chatbot returned an answer for the turn.
  - name: SubjectBroke
    trigger: The chatbot reported a command error.
  - name: SurfacedRendered
    trigger: The surfaced citation ids were rendered.
  - name: DroppedRendered
    trigger: The reported drop reasons were rendered.
  - name: ReportComposed
    trigger: The two lists were composed into one line.
  - name: ReportMatched
    trigger: Both lists match the scripted outcome.
  - name: ReportMismatched
    trigger: A list differs from the scripted outcome.
  - name: CommandError
    trigger: The chatbot was unreachable, returned an unmapped status, or a citation list could not be read.
transitions:
  - {state: Idle, signal: Seed, next: Checking, action: drive_chat_turn}
  - {state: Checking, signal: SubjectAnswered, next: RenderingSurfaced, action: render_surfaced_ids}
  - {state: Checking, signal: SubjectBroke, next: Failed}
  - {state: Checking, signal: CommandError, next: Failed}
  - {state: RenderingSurfaced, signal: SurfacedRendered, next: RenderingDropped, action: render_dropped_reasons}
  - {state: RenderingSurfaced, signal: CommandError, next: Failed}
  - {state: RenderingDropped, signal: DroppedRendered, next: ComposingReport, action: compose_citation_report}
  - {state: RenderingDropped, signal: CommandError, next: Failed}
  - {state: ComposingReport, signal: ReportComposed, next: Asserting, action: assert_citation_report}
  - {state: ComposingReport, signal: CommandError, next: Failed}
  - {state: Asserting, signal: ReportMatched, next: Passed}
  - {state: Asserting, signal: ReportMismatched, next: Failed}
  - {state: Asserting, signal: CommandError, next: Failed}
