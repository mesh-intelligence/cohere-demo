# Mock for the Ollama provider, claiming these behaviors:
# - POST /api/embeddings: the embed_query REST word maps $.embedding.
# - POST /api/chat: adapter chatResp shape {message:{role,content},...}.
# The chat route is a script, and order is what makes this scenario work: the
# source selector calls it first, the tier selector second, and the fallback
# word third once the provider has refused.
routes:
  - method: POST
    path: /api/embeddings
    responses:
      - status: 200
        body:
          embedding: [0.11, 0.22, 0.33, 0.44]

  - method: POST
    path: /api/chat
    responses:
      # First call: the source selector keeps both declared sources, so the
      # fallback answers over the same grounding the Cohere word would have used.
      - status: 200
        body:
          message:
            role: assistant
            content: '{"names":["rag0","rag1"]}'
          eval_count: 4
          prompt_eval_count: 12
      # Second call: the tier selector routes the tasking to the Cohere word.
      # Without this the turn never reaches the provider, the probe reports
      # CohereUntouched, and the scenario fails rather than passing on a
      # fallback that proves nothing.
      - status: 200
        body:
          message:
            role: assistant
            content: "[tool_call]\n{\"tool\":\"invoke_cohere_command\",\"parameters\":{}}\n[/tool_call]"
          eval_count: 6
          prompt_eval_count: 14
      # Third call: the fallback word answers after the provider refuses. The
      # critic compares the turn's answer against exactly this text.
      - status: 200
        body:
          message:
            role: assistant
            content: "FALLBACK ANSWER: the corpus describes the rig subject and Solar Ridge."
          eval_count: 12
          prompt_eval_count: 40
