# Fixture pinning follows single-turn: the chatbot's client limits and its chat
# words' provider_url admit only the real dependency ports, so each mock stands
# exactly where the real service stands.
#
# The Cohere client is the exception, and deliberately so. Its base URL and its
# egress allowlist are one deployment-supplied pair (srd009 R1.2, R1.4), which
# is what lets a private in-boundary deployment differ from the hosted endpoint
# by configuration alone, and what lets this scenario stand a mock on loopback.
subject_address: 127.0.0.1:18080
subject_health_path: http://127.0.0.1:18081/api/lifecycle/health
fixture_address:
  llm: 127.0.0.1:11434
  rag0: 127.0.0.1:18085
  rag1: 127.0.0.1:18095
  cohere: 127.0.0.1:18120
fixture_env:
  cohere: COHERE_BASE_URL
env:
  - COHERE_HOST=127.0.0.1
  - COHERE_SCHEME=http
  - COHERE_PORT=18120
  # A literal value: the credential must resolve for the request to be built at
  # all, and this scenario is about what happens after it is sent.
  - COHERE_API_KEY=scenario-not-a-real-key
