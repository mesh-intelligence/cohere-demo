# Mock for the Cohere endpoints, returning a rerank that succeeded and ordered
# nothing.
#
# An empty ordering is the case a machine treating only error statuses as
# degradation gets wrong: the call returned 200, so nothing looks like a
# failure, and a turn that composed from an order it never received would report
# the rerank as applied. reorder_by_index cannot apply an empty ordering, and
# that fault takes the same degradation route as a refusal (srd009 R5.4).
routes:
  - method: POST
    path: /v2/embed
    responses:
      - status: 200
        body:
          id: scenario-embed-1
          embeddings:
            float:
              - [0.11, 0.22, 0.33, 0.44]
  - method: POST
    path: /v2/rerank
    responses:
      - status: 200
        body:
          id: scenario-rerank-empty
          results: []
  - method: POST
    path: /v2/chat
    responses:
      - status: 200
        body:
          id: scenario-brief-1
          finish_reason: COMPLETE
          message:
            role: assistant
            content:
              - type: text
                text: "ASSESSMENT: the corpus describes the rig subject."
            citations: []
