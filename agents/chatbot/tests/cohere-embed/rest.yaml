kind: rest-definition
schema_version: 1
rest:
  version: v1
  auth:
    none:
      type: none
  limits:
    local:
      timeout: 60s
      read_timeout: 60s
      max_request_bytes: 65536
      max_response_bytes: 262144
      network:
        schemes: [http]
        hosts: [127.0.0.1, localhost]
  clients:
    subject:
      # The rig publishes the chatbot's pinned chat address here.
      base_url: ${SUBJECT_URL:-http://127.0.0.1:1}
      auth_ref: none
      limits_ref: local
      operations:
        chat_turn:
          method: POST
          path: /api/v1/chat
          params:
            body_source: none
          body:
            message: "Prepare a command-staff brief on what the corpus describes."
          success: {status: [200], signal: SubjectAnswered}
          failures:
            - status: [500]
              signal: SubjectBroke
              domain_error_code: command_error
          response:
            output:
              answer: $.answer
          side_effects:
            - kind: external_api
              target: chatbot.chat
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
    rag0_mock:
      # The mock records every request it served. Reading its log is the only way
      # to see the query vector: the answer is identical whether the vector
      # arrived flat, nested, or serialized, because the mock returns its canned
      # chunk regardless of what was queried.
      base_url: http://127.0.0.1:18085
      auth_ref: none
      limits_ref: local
      operations:
        read_log:
          method: GET
          path: /_mock/log
          params:
            body_source: none
          success: {status: [200], signal: RagLogRead}
          response:
            output:
              requests: $.requests
          side_effects:
            - kind: external_api
              target: rag0_mock.log
              state: read_only
          reversibility:
            classification: reversible
            undo: noop
