# Mock for the first declared RAG server, and the one this scenario reads back.
# The critic asserts on the request body this mock recorded, which is where the
# unwrapped query vector becomes observable -- the answer cannot show it,
# because a nested or serialized vector still retrieves the canned chunk below.
#
# embedding_model matches the identity declare_query_model publishes now that
# the turn embeds at Cohere. Reporting the old Ollama identity would exclude
# this source (srd002 R3.3) and the turn would compose from nothing while still
# answering.
routes:
  - method: POST
    path: /api/v1/rag/query
    responses:
      - status: 200
        body:
          ids: [["rag0-doc-1"]]
          documents: [["rag0 chunk about the rig"]]
          distances: [[0.1]]
          embedding_model: "embed-v4.0"
          # The level the rag-server reports the filter ran at (srd010 R2.5).
          clearance_enforced_at: "unclassified"
