# The rag-clearance-refusal-critic keeps refusal scope in this scenario path and
# configuration rather than in the canonical Critic role identity.
# The rag-server ships fixed listeners: query on 18085, lifecycle control and
# health on 18086. The rig therefore pins the address instead of allocating
# one, probes health on the control listener, and the critic drives the query
# listener through SUBJECT_URL.
subject_address: 127.0.0.1:18085
subject_health_path: http://127.0.0.1:18086/api/lifecycle/health
# The rag-server's client limits allow only Chroma's real port, so the mock
# is pinned to stand exactly where Chroma stands. It answers anything it is
# asked, which is deliberate here: the critic passes only if the subject never
# asks, so a mock that could refuse on its own would hide the behavior at test.
fixture_address:
  chroma: 127.0.0.1:8000
