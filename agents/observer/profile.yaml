# A wrapper around the catalog's fleet observer, as agents/applier wraps the
# catalog's applier. The machine, its words, and their selection are the same
# in every mesh that runs an observer; what differs is where this one binds,
# which agents it proxies, and the UI it serves, all of which live in rest.yaml
# beside this file.
kind: agent-profile
schema_version: 1
name: observer
machine: ../../catalog/observer/machine.yaml
tools:
  - ../../catalog/observer/tools.yaml
tool_declarations:
  - ../../catalog/observer/declarations.yaml
  - /opt/agent-core/tools/builtin/lifecycle/exit-agent.yaml
rest_definitions:
  - rest.yaml
  - monitor-rest.yaml
