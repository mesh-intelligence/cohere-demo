t x="0.000000" y="0.000000" width="1140.000000" height="355.000000" stroke="#c9ccd1" fill="transparent" style="stroke-width:2;" /></g></g><g class="dGFibGUuYzAw"><g class="shape" ><rect x="0.000000" y="0.000000" width="280.000000" height="59.000000" stroke="#3d4a5c" fill="#3d4a5c" style="stroke-width:2;" /></g><text x="140.000000" y="35.000000" fill="#ffffff" class="text-bold" style="text-anchor:middle;font-size:15px">Model</text></g><g class="dGFibGUuYzAx"><g class="shape" ><rect x="280.000000" y="0.000000" width="430.000000" height="59.000000" stroke="#3d4a5c" fill="#3d4a5c" style="stroke-width:2;" /></g><text x="495.000000" y="35.000000" fill="#ffffff" class="text-bold" style="text-anchor:middle;font-size:15px">What the model does</text></g><g class="dGFibGUuYzAy"><g class="shape" ><rect x="710.000000" y="0.000000" width="430.000000" height="59.000000" stroke="#3d4a5c" fill="#3d4a5c" style="stroke-width:2;" /></g><text x="925.000000" y="35.000000" fill="#ffffff" class="text-bold" style="text-anchor:middle;font-size:15px">Why it is used at this step</text></g><g class="dGFibGUuYzEw"><g class="shape" ><rect x="0.000000" y="59.000000" width="280.000000" height="74.000000" stroke="#d5c8ef" fill="#f1eafc" style="stroke-width:2;" /></g><text x="140.000000" y="94.000000" fill="#4b2d91" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="140.000000" dy="0.000000">Embed 4</tspan><tspan x="140.000000" dy="17.000000">embed-v4.0</tspan></text></g><g class="dGFibGUuYzEx"><g class="shape" ><rect x="280.000000" y="59.000000" width="430.000000" height="74.000000" stroke="#e3e5e8" fill="#ffffff" style="stroke-width:2;" /></g><text x="495.000000" y="94.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="495.000000" dy="0.000000">Turns text into embeddings for</tspan><tspan x="495.000000" dy="16.000000">semantic search, across 100+ languages</tspan></text></g><g class="dGFibGUuYzEy"><g class="shape" ><rect x="710.000000" y="59.000000" width="430.000000" height="74.000000" stroke="#e3e5e8" fill="#ffffff" style="stroke-width:2;" /></g><text x="925.000000" y="94.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="925.000000" dy="0.000000">Indexes every document at ingest</tspan><tspan x="925.000000" dy="16.000000">and turns the tasking into the query</tspan></text></g><g class="dGFibGUuYzIw"><g class="shape" ><rect x="0.000000" y="133.000000" width="280.000000" height="74.000000" stroke="#d5c8ef" fill="#f1eafc" style="stroke-width:2;" /></g><text x="140.000000" y="168.000000" fill="#4b2d91" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="140.000000" dy="0.000000">Rerank 3.5</tspan><tspan x="140.000000" dy="17.000000">rerank-v3.5</tspan></text></g><g class="dGFibGUuYzIx"><g class="shape" ><rect x="280.000000" y="133.000000" width="430.000000" height="74.000000" stroke="#e3e5e8" fill="#ffffff" style="stroke-width:2;" /></g><text x="495.000000" y="168.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="495.000000" dy="0.000000">Scores how relevant each</tspan><tspan x="495.000000" dy="16.000000">document is to a query</tspan></text></g><g class="dGFibGUuYzIy"><g class="shape" ><rect x="710.000000" y="133.000000" width="430.000000" height="74.000000" stroke="#e3e5e8" fill="#ffffff" style="stroke-width:2;" /></g><text x="925.000000" y="168.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="925.000000" dy="0.000000">Orders the retrieved reporting before</tspan><tspan x="925.000000" dy="16.000000">the brief is written from it</tspan></text></g><g class="dGFibGUuYzMw"><g class="shape" ><rect x="0.000000" y="207.000000" width="280.000000" height="74.000000" stroke="#d5c8ef" fill="#f1eafc" style="stroke-width:2;" /></g><text x="140.000000" y="242.000000" fill="#4b2d91" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="140.000000" dy="0.000000">Command A</tspan><tspan x="140.000000" dy="17.000000">command-a-03-2025</tspan></text></g><g class="dGFibGUuYzMx"><g class="shape" ><rect x="280.000000" y="207.000000" width="430.000000" height="74.000000" stroke="#e3e5e8" fill="#ffffff" style="stroke-width:2;" /></g><text x="495.000000" y="242.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="495.000000" dy="0.000000">Generates text grounded in supplied</tspan><tspan x="495.000000" dy="16.000000">documents, with citations</tspan></text></g><g class="dGFibGUuYzMy"><g class="shape" ><rect x="710.000000" y="207.000000" width="430.000000" height="74.000000" stroke="#e3e5e8" fill="#ffffff" style="stroke-width:2;" /></g><text x="925.000000" y="242.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="925.000000" dy="0.000000">Writes the brief with citations, picks sources and</tspan><tspan x="925.000000" dy="16.000000">web queries by tool call, renders /translate</tspan></text></g><g class="dGFibGUuYzQw"><g class="shape" ><rect x="0.000000" y="281.000000" width="280.000000" height="74.000000" stroke="#d5c8ef" fill="#f1eafc" style="stroke-width:2;" /></g><text x="140.000000" y="316.000000" fill="#4b2d91" class="text-bold" style="text-anchor:middle;font-size:15px"><tspan x="140.000000" dy="0.000000">Command R7B</tspan><tspan x="140.000000" dy="17.000000">command-r7b-12-2024</tspan></text></g><g class="dGFibGUuYzQx"><g class="shape" ><rect x="280.000000" y="281.000000" width="430.000000" height="74.000000" stroke="#e3e5e8" fill="#ffffff" style="stroke-width:2;" /></g><text x="495.000000" y="316.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="495.000000" dy="0.000000">A lighter, faster Command for</tspan><tspan x="495.000000" dy="16.000000">short structured answers</tspan></text></g><g class="dGFibGUuYzQy"><g class="shape" ><rect x="710.000000" y="281.000000" width="430.000000" height="74.000000" stroke="#e3e5e8" fill="#ffffff" style="stroke-width:2;" /></g><text x="925.000000" y="316.000000" fill="#0A0F25" class="text-bold fill-N1" style="text-anchor:middle;font-size:14px"><tspan x="925.000000" dy="0.000000">The audit judge — scores each sentence</tspan><tspan x="925.000000" dy="16.000000">against its chunks, classifies facets</tspan></text></g><mask id="d2-1675134979" maskUnits="userSpaceOnUse" x="-11" y="-11" width="1162" height="377">
