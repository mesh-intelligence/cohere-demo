      Corvale Refining's planning group expects distillate margins to soften through the summer as demand stays soft and new refining capacity abroad reaches export markets. They have moved maintenance forward rather than run through a weaker margin period.

      The view is consistent with lower distillate consumption so far this year, though one refiner's planning case is thin evidence for the market as a whole.
