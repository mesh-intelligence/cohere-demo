text: |-
  Marathon Petroleum Corporation (MPC) reported the following values in its Form 10-K filed 2024-02-28 for fiscal 2023 FY.

  Reported net income was $9.68 billion for the period 2023-01-01 to 2023-12-31.

  Reported operating cash flow was $14.12 billion for the period 2023-01-01 to 2023-12-31.

  Reported capital expenditure was $1.89 billion for the period 2023-01-01 to 2023-12-31.

  Reported total assets was $85.99 billion as of 2023-12-31.

  Reported cash and cash equivalents was $5.44 billion as of 2023-12-31.
