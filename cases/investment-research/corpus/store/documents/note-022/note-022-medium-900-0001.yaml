text: |-
  Our deal team was wall-crossed on Project Marlowe. Tessarine Petroleum's board has received an unsolicited approach from Velmora Energy for a stock merger, and it has asked advisers to evaluate combined drilling inventory and overhead savings.

  Wall-crossed staff only. This is highly sensitive and unannounced. It is also why Tessarine remains restricted for reasons beyond the notes offering, which staff below this barrier are not told.
