      EOG Resources, Inc. (EOG) reported the following values in its Form 10-Q filed 2024-11-07 for fiscal 2024 Q3.

      Reported revenue was $5.96 billion for the period 2024-07-01 to 2024-09-30.

      Reported net income was $1.67 billion for the period 2024-07-01 to 2024-09-30.

      Reported operating cash flow was $9.38 billion for the period 2024-01-01 to 2024-09-30.

      Reported total assets was $46.15 billion as of 2024-09-30.

      Reported cash and cash equivalents was $6.12 billion as of 2024-09-30.
