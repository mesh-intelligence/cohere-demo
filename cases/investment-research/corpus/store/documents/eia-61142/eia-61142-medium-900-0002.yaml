text: In the first half of 2023, crude oil prices fluctuated following the EU import ban on Russia’s crude oil and products, several interest rate hikes among global central banks, and inflation and recession concerns. However, Brent crude oil prices in the first half of 2023 were significantly less volatile than in 2022, when prices reached multi-year highs as a result of Russia’s full-scale invasion of Ukraine. In the second half of 2023, geopolitical tensions and concerns around crude oil demand resulted in more price fluctuations. Brent crude oil prices ended the year at $78/b, $4 below the start of 2023.
