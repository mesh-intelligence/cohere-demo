text: The price of Brent crude oil averaged $83 per barrel (b) in 2023, down from $101/b in 2022, a difference of $19/b after rounding. Global markets adjusted to new trade dynamics, with crude oil from Russia finding destinations outside the EU, and global crude oil demand fell short of expectations. Those dynamics offset the impacts from OPEC+ crude oil supply curbs.
