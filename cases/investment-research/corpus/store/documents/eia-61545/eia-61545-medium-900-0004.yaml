text_sha256: 6833f8820a104385bb6cc394c118c26e7808087ac373d6da81ecf84590a4ba1b
text: Russia was the country with the most crude oil production in 2017, but production growth in Russia has since lagged behind the United States. Average annual production in Russia peaked in 2019 at 10.8 million b/d, when it trailed the United States by 1.4 million b/d. More recently, Russia was among the OPEC+ countries that announced production cuts in November 2022, and in February 2023, it separately announced additional voluntary cuts of 500,000 b/d. Although voluntary cuts have reduced recent production in Russia, we believe sanctions and voluntary actions by companies in response to the full-scale invasion of Ukraine have been the primary cause of the cuts. Actual cuts to production appear to be smaller than anticipated, however, and we estimate that production in Russia declined by only 200,000 b/d in 2023.
