text: Average annual production in Saudi Arabia peaked in 2022 at 10.6 million b/d, which was 1.3 million b/d less than in the United States that year. In 2023, crude oil production in Saudi Arabia declined by about 900,000 b/d because of OPEC+ cuts and further voluntary cuts Saudi Arabia made to offset weaker demand growth. Production in Saudi Arabia could not exceed the 2023 production volume in the United States because state-owned Saudi Aramco’s stated production capacity is 12.0 million b/d, with about 300,000 b/d of additional capacity from its share of the Neutral Zone area shared with Kuwait.
