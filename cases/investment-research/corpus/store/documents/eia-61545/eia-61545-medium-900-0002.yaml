text: Together, the United States, Russia, and Saudi Arabia accounted for 40% (32.8 million b/d) of global oil production in 2023. These three countries have produced more oil than any others since 1971 (counting production in the Russian Federation of the Soviet Union prior to 1991), although the top spot has shifted among them over the past five decades. By comparison, the next three largest producing countries—Canada, Iraq, and China—combined produced 13.1 million b/d in 2023, only slightly more than what was produced in the United States alone.
