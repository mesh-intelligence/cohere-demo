text: After peaking at 9.6 million b/d in 1970, annual U.S. crude oil production flattened and then generally declined for decades to a low of 5.0 million b/d in 2008. Crude oil production in the United States began increasing again in 2009, as producers increasingly applied hydraulic fracturing and horizontal drilling techniques, and has increased steadily since. The only exception to U.S. production growth since 2009 was in 2020 and 2021, when demand and prices decreased because of the economic effects of the COVID-19 pandemic. In recent years, crude oil production in the Permian Basin (in western Texas and eastern New Mexico) drove the increases in total crude oil and natural gas production in the United States.
