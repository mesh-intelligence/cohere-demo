text: Natural gas prices at several price hubs in Europe and Asia remain relatively high over the forecast period compared with U.S. natural gas prices. We assume that U.S. LNG over the forecast period will continue to replace natural gas that had been exported from Russia by pipeline to Europe. Because global LNG liquefaction capacity additions will be limited in the next two years, demand for flexible LNG supplies, mainly from the United States, will increase to meet incremental growth in global demand.
