text: We expect natural gas consumption to grow in all sectors in 2024 except the industrial sector, where we expect consumption will decrease slightly. Sectoral changes in natural gas consumption depend mostly on the weather. Natural gas-fired power plants provide about 40% of U.S. electricity generation annually, so electricity demand from heating and air-conditioning equipment influences how much natural gas the electric power sector consumes. We expect about 11% more U.S. natural gas consumption for electricity in 2024 than the previous five-year average.
