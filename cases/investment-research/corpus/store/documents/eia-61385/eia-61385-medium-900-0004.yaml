text: In the residential and commercial sectors, colder temperatures in the winter also affect direct natural gas consumption by heating equipment. We expect combined consumption in the residential and commercial sectors to be 5% higher in 2024 than in 2023 because January 2023 and December 2023 had warmer-than-average temperatures, leading to relatively low consumption of natural gas for space heating. Our assumptions for future weather largely reflect the trend of the past 30 years.
