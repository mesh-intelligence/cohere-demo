text_sha256: d234963e99053fee00c40ebfa2778aa664adadf94e2e1f2fd9d3fbc377e40341
text: The Permian was the source of 45% of U.S. crude oil production in 2023—the most of any region in the United States—and 20% of the marketed natural gas—the second most of any U.S. region. We forecast crude oil production in the Permian will increase by 320,000 barrels per day (b/d) to average 6.6 million b/d in 2025. Most of the natural gas produced in the Permian is associated natural gas, produced from oil directed wells. Completion of new natural gas pipelines will allow producers to transport more of the associated natural gas, removing constraints on crude oil production. We estimate that marketed natural gas production from the Permian will also grow by 1.8 billion cubic feet per day (Bcf/d) to 25.5 Bcf/d in 2025 with the new pipelines in place.
