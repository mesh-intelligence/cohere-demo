text: |-
  Velmora Energy's investor relations team now frames 2025 planning around the capital needed to hold production flat, with anything above that needing to compete with buybacks. They expect lower well costs to absorb some service-cost inflation.

  This is a common framing across large independents this year, and it makes maintenance capital the figure to pin down when comparing reported capital expenditure.
