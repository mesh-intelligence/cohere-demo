text_sha256: 47fa307e0a27f127a5b41e889be01824402cb1cc8cc06cd831cac1013afba246
text: The large buildout of LNG export capacity enabled LNG exports to grow from an annual average of 0.5 Bcf/d in 2016 to 11.9 Bcf/d in 2023. Currently, the United States has seven LNG export terminals in operation and five terminals under construction. In 2023, the United States was the world’s largest LNG exporter. By the end of this year, we expect two new LNG export facilities—Plaquemines LNG and Corpus Christi LNG Stage 3 (an expansion of the existing Corpus Christi LNG export terminal)—to start LNG exports.
