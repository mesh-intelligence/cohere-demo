text: U.S. natural gas pipeline imports from Canada play an important role in balancing the U.S. natural gas market, particularly in the winter. Most natural gas imported by pipeline from Canada arrives in the Western and Midcontinent regions of the United States. In 2023, net U.S. pipeline imports from Canada averaged 5.2 Bcf/d, of which 83% was imported into the western United States. In the first six months of 2024, net U.S. pipeline imports from Canada averaged 5.4 Bcf/d, an increase of 11% (0.5 Bcf/d) compared with the same period in 2023, mainly because of increased imports into the Midcontinent region.
