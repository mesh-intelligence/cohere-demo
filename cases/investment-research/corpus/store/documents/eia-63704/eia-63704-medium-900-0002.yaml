text: In 2023, 2.3 Bcf/d of associated gas was produced in North Dakota’s Bakken region, which accounted for 70% of the region’s total natural gas production—the largest share among the five oil-producing regions. The Eagle Ford region in southern Texas was the source of 1.8 Bcf/d of associated gas, while a combined 1.5 Bcf/d of associated gas was produced in the Niobrara and Anadarko regions in the midcontinent in 2023.
