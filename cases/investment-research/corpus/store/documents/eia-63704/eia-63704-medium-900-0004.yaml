text: Associated gas contains natural gas plant liquids (NGPLs) such as ethane, butane, and propane. Associated gas is sometimes characterized as wet gas because it must be treated at gas processing plants to remove impurities and liquids before being marketed. The increase in associated gas has led to record ethane production, which is used as a feedstock to produce plastics, fibers, and other products.
