text: Associated natural gas accounted for 36.7% of U.S. natural gas production in 2023, compared with 37.4% in 2022. Non-associated natural gas is natural gas produced from wells that predominantly produce natural gas. We define oil wells as those with a gas-to-oil ratio (GOR) of less than or equal to 6.0 thousand cubic feet of natural gas per barrel of oil produced (Mcf/b). We classify wells with a GOR of more than 6.0 Mcf/b as natural gas wells. Associated natural gas production has grown at a rate commensurate with dry natural gas production.
