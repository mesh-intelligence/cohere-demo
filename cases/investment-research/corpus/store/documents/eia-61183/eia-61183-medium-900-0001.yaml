text: The U.S. benchmark Henry Hub natural gas price averaged $2.57 per million British thermal units (MMBtu) in 2023, about a 62% drop from the 2022 average annual price, according to data from Refinitiv Eikon. Record-high natural gas production, flat consumption, and rising natural gas inventories contributed to lower prices in 2023 compared with 2022. The monthly average Henry Hub price was below $3.00/MMBtu in every month except January, with the lowest monthly average in May at $2.19/MMBtu.
