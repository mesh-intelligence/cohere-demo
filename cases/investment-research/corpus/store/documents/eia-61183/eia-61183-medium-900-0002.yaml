text: Record-high natural gas production that outpaced growth in natural gas consumption was the primary driver of lower prices in 2023. We estimate that U.S. dry natural gas production averaged a record-high 104 billion cubic feet per day (Bcf/d) in 2023 in our December Short-Term Energy Outlook, 4% higher than the 2022 annual average. Production increased in the Permian region, driven by improved well-level productivity and higher crude oil prices in 2023, as well as in the Haynesville region and the Appalachia region, according to our Drilling Productivity Report.
