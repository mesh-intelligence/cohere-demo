text: |-
  Domestic natural gas production in China provided 58% of its natural gas supply in 2023, averaging 21.7 Bcf/d, an increase of 6% (1.2 Bcf/d) from 2022. Domestic production has grown by more than 1.0 Bcf/d every year since 2017, mainly from discrete natural gas reservoirs and associated natural gas from oil production. Production from low-permeability formations, such as tight gas, shale, and coal-bed methane, has also increased and averaged 8.6 Bcf/d in 2023. China’s 14 th Five-Year Plan (2021–25) set a domestic natural gas production target of 22.3 Bcf/d by 2025, most of which was met in 2023.

  In 2023, China’s natural gas imports averaged 16.0 Bcf/d and accounted for 42% of China’s total natural gas supply, compared with 15% of its supply in 2010. Natural gas is imported into China by pipeline and as liquefied natural gas (LNG).
