      Marathon Petroleum Corporation (MPC) reported the following values in its Form 10-Q filed 2024-04-30 for fiscal 2024 Q1.

      Reported net income was $937.0 million for the period 2024-01-01 to 2024-03-31.

      Reported operating cash flow was $1.53 billion for the period 2024-01-01 to 2024-03-31.

      Reported capital expenditure was $585.0 million for the period 2024-01-01 to 2024-03-31.

      Reported total assets was $85.53 billion as of 2024-03-31.

      Reported cash and cash equivalents was $3.17 billion as of 2024-03-31.
