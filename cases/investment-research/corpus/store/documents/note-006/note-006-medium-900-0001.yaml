text: |-
  Our deal team was wall-crossed on Project Larkspur, in which Velmora Energy is evaluating a bid for Sablecrest Midstream's Delaware Basin gathering assets. The rationale Velmora gave is control of residue takeaway ahead of its planned 2025 well program.

  This note is limited to wall-crossed staff. The approach has not been announced, and nothing here may reach research, sales, or investing clients until the matter is public or abandoned.
