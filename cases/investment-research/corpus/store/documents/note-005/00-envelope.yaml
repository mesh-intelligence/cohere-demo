    text: |-
      Brannock Drilling Services says its Permian customers are drilling longer laterals with fewer rigs, and that dayrate discussions now center on efficiency bonuses rather than rig count. Velmora Energy was one of the customers cited as extending lateral length again this year.

      This matches the broader pattern of production growing on productivity rather than activity. It also means rig count is a weaker signal of supply growth than it used to be.
