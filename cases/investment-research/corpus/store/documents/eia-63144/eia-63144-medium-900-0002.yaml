text: Processing plants in Texas use a cryogenic cooling process to recover natural gas liquids (NGLs) from the natural gas stream to make dry natural gas meet pipeline and consumer quality standards, including for heat content. In removing NGLs such as ethane and propane from the natural gas stream, the heat content of dry natural gas delivered to consumers in Texas was among the lowest nationwide in 2023 even though the NGL content of wet natural gas produced in the Permian Basin is among the highest nationwide.
