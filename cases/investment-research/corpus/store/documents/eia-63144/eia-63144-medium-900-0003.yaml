text: Ethane made up 44% of the NGL removed from the natural gas stream in the Permian Basin in 2023, and propane represented an additional 30%, according to our Petroleum Supply Annual. In the United States, consumer natural gas-fueled appliances generally use natural gas with a heat content between 950 Btu/cf and 1,100 Btu/cf. Liquefied natural gas (LNG) export facilities—significant consumers of Texas natural gas—can install separators to reduce the heat content of the natural gas they receive when needed.
