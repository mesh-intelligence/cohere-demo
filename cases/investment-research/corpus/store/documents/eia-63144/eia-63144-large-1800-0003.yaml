text: Once the natural gas meets pipeline quality standards, natural gas plant operators can choose to recover additional ethane from the natural gas stream when prices create a favorable premium. The ethane premium to natural gas has increased in recent years in response to growing demand in domestic and international petrochemical markets. Excluding the severe impact of Winter Storm Uri on natural gas prices in early 2021, the annual average ethane premium in the United States has risen every year since 2019 from 79 cents per million British thermal units (MMBtu) to $1.47/MMBtu in 2023, according to data from Bloomberg and Natural Gas Intelligence. As more ethane has been recovered from natural gas flows because of the higher premium, the heat content of natural gas has fallen in recent years in several states including North Dakota, West Virginia, and Pennsylvania.
