text: Operators in Texas also face pipeline takeaway capacity constraints for natural gas in the Permian. The recovery of more NGLs, particularly ethane, from the natural gas stream allows natural gas pipelines in the Permian to transport more methane. The recovered NGLs are transported on separate NGL pipeline networks and sold to the petrochemical sector, typically at higher prices compared with dry natural gas.
