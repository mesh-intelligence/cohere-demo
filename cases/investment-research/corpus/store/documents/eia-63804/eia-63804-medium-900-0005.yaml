text: During the past two winters spanning 2022–23 and 2023–24, exceptionally mild weather reduced heating demand in both Europe and Asia. In both 2023 and 2024, Europe ended the winter heating season with record storage inventories. In 2024, the European Union (EU) extended coordinated demand-reduction measures through March 2025, aimed to reduce natural gas consumption by at least 15% on an annual basis compared with the average during the previous five years (from April 1, 2017, to March 31, 2022). Since these policies were implemented starting in 2022, natural gas consumption in the EU declined by more than 15% in both 2023 and 2024 compared with the five-year (2017–22) average.
