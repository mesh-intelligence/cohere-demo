text: Storage capacity in East Asia is mostly limited to above-ground cryogenic storage tanks co-located with LNG import (regasification) terminals, and it helps meet seasonal peaks in demand. LNG inventories in Japan and South Korea were relatively low at the end of this past winter heating season but remained close to 2023 peak levels in subsequent months. In China, where natural gas storage capacity can meet about 12% of the country’s annual natural gas consumption, record LNG imports from August to October 2024 may indicate strong refill of storage inventories ahead of winter. In the United States—the world’s largest LNG exporter —storage inventories were close to maximum volumes as of November 8, exceeding last year’s inventories by 3%.
