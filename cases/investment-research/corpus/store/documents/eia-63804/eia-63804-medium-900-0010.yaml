text: One or more regions in the Northern Hemisphere may experience colder winter temperatures this year, as weather models point to a possible shift from El Niño to La Niña. Weather models indicate the likelihood of the formation of La Niña, which is generally associated with colder, drier weather in much of the Northern Hemisphere during the winter. The European Centre for Medium-Range Weather Forecasts predicts a colder winter in Northwest and Central Europe. The last two winters were exceptionally warm, contributing to relatively low natural gas consumption in Europe, higher end-of-season storage inventories, and lower natural gas prices.
