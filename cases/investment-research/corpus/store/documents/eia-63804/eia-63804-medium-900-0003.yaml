text_sha256: 7e994ead9462b797c9f6396ad0bfabe73dea10fa800adef3f07b9f40a59b6300
text: We expect limited LNG capacity additions to come online this winter. Most of the new LNG export projects are in the United States, including the first of seven mid-scale trains at Corpus Christi LNG Stage 3 (an expansion of the existing Corpus Christi LNG facility), Plaquemines LNG Phase 1 (consisting of 18 mid-scale trains), and additional capacity at Freeport LNG achieved through engineering and operational optimization. The combined nominal capacity of these U.S. LNG export projects is 1.7 billion cubic feet per day (Bcf/d). However, during the initial start-up phase, new LNG export projects operate below nominal capacity and require several months to reach full production.
