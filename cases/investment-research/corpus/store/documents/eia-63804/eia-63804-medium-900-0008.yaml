text: U.S. LNG exports will continue to help balance global natural gas markets this winter. The United States became the world’s largest LNG exporter in 2023 and will be the key supplier to global LNG markets. In our November 2024 Short-Term Energy Outlook, we forecast that U.S. LNG exports will average 13.7 Bcf/d in the 2024–25 winter, 8% (1.0 Bcf/d) more than in the previous winter as new and expanded projects come online in the next several months. Potential project start-up delays or other technical issues may affect our forecast.
