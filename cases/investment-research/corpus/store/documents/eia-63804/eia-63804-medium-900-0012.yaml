text: |-
  EU countries expanded LNG import capacity by more than one-third between 2021 and 2024 and expect more regasification capacity expansions this winter. We estimate regasification capacity to expand in Germany, Italy, Greece, and Poland by a combined 3.5 Bcf/d by January 2025.

  The potential expiration of the Russia-Ukraine natural gas transit contract at the end of December could reduce natural gas pipeline flows into Europe. After declining by more than 40% in 2022, Russia’s pipeline exports to the EU via the sole remaining route transiting Ukraine consistently averaged 1.2 Bcf/d to 1.4 Bcf/d in 2023–24. Imports by pipeline from Norway and North Africa have limited potential for growth. Europe would have to offset the further loss of Russian supply mainly by importing more LNG and drawing down natural gas in storage. The European Network of Transmission System Operators for Gas (ENTSOG) estimates in its Winter Supply Outlook 2024–25 that without Russian supplies Europe would exit the winter heating season with storage 40% full under a normal winter scenario.
