text: A colder winter could lead to high storage draws and lower storage inventory in the United States this winter, increasing domestic Henry Hub prices, which in turn would affect U.S. LNG export prices. Operational issues such as unplanned maintenance and/or production freeze-offs could affect both export volumes and prices at U.S. LNG facilities and raise international LNG prices.
