text: Other markets are also adding LNG export capacity. In Mexico, a new LNG export facility on the east coast—Fast LNG Altamira— shipped its first cargo in August 2024 and reached full production capacity in October. A new LNG export project offshore Senegal and Mauritania is on track to start LNG production by the end of 2024. After shipping several cargoes, Russia’s Arctic-2 LNG export facility shut down in October mainly because of sanctions and may not produce LNG during the upcoming winter.
