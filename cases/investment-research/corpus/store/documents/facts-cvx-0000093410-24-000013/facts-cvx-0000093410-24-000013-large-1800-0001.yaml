text: |-
  Chevron Corporation (CVX) reported the following values in its Form 10-K filed 2024-02-26 for fiscal 2023 FY.

  Reported revenue was $200.95 billion for the period 2023-01-01 to 2023-12-31.

  Reported net income was $21.37 billion for the period 2023-01-01 to 2023-12-31.

  Reported operating cash flow was $35.61 billion for the period 2023-01-01 to 2023-12-31.

  Reported capital expenditure was $15.83 billion for the period 2023-01-01 to 2023-12-31.

  Reported total assets was $261.63 billion as of 2023-12-31.

  Reported cash and cash equivalents was $8.18 billion as of 2023-12-31.
