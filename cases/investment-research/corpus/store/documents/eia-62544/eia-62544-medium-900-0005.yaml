text: Storage Because of high production and flat consumption, less natural gas was withdrawn from storage inventories this winter. Over the winter 2023–24 heating season (November 1–March 31), U.S. working natural gas inventories averaged 13% more than the year-ago average and nearly 18% more than the five-year (2019–23) average, according to our Weekly Natural Gas Storage Report. Relatively full storage contributed to lower natural gas prices over this heating season. In our most recent report for the week ending July 12, 2024, 17% more natural gas was in working U.S. storage than the previous five-year average for this time of the year.
