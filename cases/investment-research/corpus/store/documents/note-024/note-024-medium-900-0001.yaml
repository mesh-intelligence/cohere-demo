text: |-
  Talks with Fenwright Power on the gas tolling agreement will extend into 2025, because the company wants more certainty on its data-center load first. The restriction stays in place while our desk remains engaged.

  Any sector view on power-driven gas demand should be built from public sources and should not draw on what the desk has learned from Fenwright.
