  Reported net income was $8.61 billion for the period 2024-07-01 to 2024-09-30.

  Reported operating cash flow was $42.79 billion for the period 2024-01-01 to 2024-09-30.

  Reported capital expenditure was $17.47 billion for the period 2024-01-01 to 2024-09-30.

  Reported total assets was $461.92 billion as of 2024-09-30.

  Reported cash and cash equivalents was $26.93 billion as of 2024-09-30.
