text: The 2024 Refinery Capacity Report only reflects changes in U.S. refining capacity in effect as of January 1, 2024. Phillips 66 formally ended petroleum refining operations at its Rodeo refinery in February 2024. The facility previously reported a capacity of 120,200 b/cd in 2023, but it has been scaling back operations and only reported a capacity of 58,200 b/cd as of January 1, 2024. This year-on-year reduction in capacity does not reflect the end of petroleum refining operations the following month, although the loss of the remaining capacity is reflected in our monthly refinery capacity and utilization data, beginning in March 2024. The facility has been transitioning to the production of biofuels, particularly renewable diesel.
