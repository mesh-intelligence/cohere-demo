text: Desulfurization capacity, which is used to bring gasoline and diesel fuel into compliance with on-road emissions standards, also increased by 1.2%, which reflects the inclusion of the Enterprise and Targa Mont Belvieu facilities. Alkylation capacity, which is used to produce higher octane grades of gasoline, also increased by 1.2%, while isomerization capacity, which is also used to produce certain gasoline blend components, increased by 1.5%. Production capacity of on-site hydrogen increased by 1.3%. Aromatics production capacity increased by 19.8%.
