text: |-
  U.S. refining capacity increased this year for the second time since the COVID-19 pandemic, according to our annual Refinery Capacity Report. U.S. operable atmospheric crude oil distillation capacity, the primary measure of refinery capacity, totaled 18.4 million barrels per calendar day (b/cd) at the start of 2024, a 2% increase compared with the start of 2023.

  Calendar day capacity represents the operator’s estimate of the input volume that a distillation unit can process in a 24-hour period under usual operating conditions, considering the effects of both planned and unplanned maintenance. The calendar day capacity companies report to EIA may differ from the headline capacity numbers that companies use elsewhere because of differences in estimation methodology.

  Most additions to U.S. refinery capacity in the last 10 years have been expansions to existing facilities, the reactivation of previously decommissioned units, or the addition of relatively small facilities. Reductions in refinery capacity largely reflect facilities that were decommissioned due to damage, as well as facilities that transitioned from petroleum refining to renewable fuels processing.

  In 2024, the three largest refiners in the United States—Marathon, Valero, and ExxonMobil—all reported increases in capacity compared with 2023. Phillips 66, the fourth-largest U.S. refiner, reduced capacity last year. PBF Energy overtook Chevron to become the fifth-largest U.S. refiner by portfolio capacity.
