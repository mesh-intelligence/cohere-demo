text: |-
  This year’s Refinery Capacity Report includes 132 operable refineries, compared with 129 at the beginning of 2023. One new facility is included in our report: the reactivated 32,000-b/cd CPI Operations facility in Paulsboro, New Jersey, accounting for 10% of the additional distillation capacity last year.

  This year our report also includes two natural gasoline hydrotreaters operated by Enterprise and Targa Midstream near Mont Belvieu, Texas. The facilities were operating prior to January 1, 2024, but were only included beginning with this year’s report because of a methodological expansion in our surveys to include certain facilities that are not conventional petroleum refineries. Neither the Enterprise facility nor the Targa facility possess any atmospheric distillation capacity, which typically serves as the primary unit in most petroleum refineries.
