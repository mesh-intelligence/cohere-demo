text: |-
  U.S. refining capacity increased this year for the second time since the COVID-19 pandemic, according to our annual Refinery Capacity Report. U.S. operable atmospheric crude oil distillation capacity, the primary measure of refinery capacity, totaled 18.4 million barrels per calendar day (b/cd) at the start of 2024, a 2% increase compared with the start of 2023.

  Calendar day capacity represents the operator’s estimate of the input volume that a distillation unit can process in a 24-hour period under usual operating conditions, considering the effects of both planned and unplanned maintenance. The calendar day capacity companies report to EIA may differ from the headline capacity numbers that companies use elsewhere because of differences in estimation methodology.

  Most additions to U.S. refinery capacity in the last 10 years have been expansions to existing facilities, the reactivation of previously decommissioned units, or the addition of relatively small facilities. Reductions in refinery capacity largely reflect facilities that were decommissioned due to damage, as well as facilities that transitioned from petroleum refining to renewable fuels processing.

  In 2024, the three largest refiners in the United States—Marathon, Valero, and ExxonMobil—all reported increases in capacity compared with 2023. Phillips 66, the fourth-largest U.S. refiner, reduced capacity last year. PBF Energy overtook Chevron to become the fifth-largest U.S. refiner by portfolio capacity.

  The increase in capacity in the beginning of 2024 primarily reflects increases in capacity at existing facilities. In particular, ExxonMobil completed a major refinery capacity addition in Beaumont, Texas, in March 2023, boosting the facility’s total crude oil distillation capacity from 369,000 b/cd to 609,000 b/cd.

  Valero also completed an expansion project at its Port Arthur refinery, increasing its distillation capacity by 25,000 b/cd to 360,000 b/cd. The increase in distillation capacity came alongside a 50,000-b/cd increase in the refinery’s coking capacity, increasing its ability to process heavier crude oil grades into more high value products, such as gasoline or diesel fuel.

  Finally, Marathon’s Galveston Bay refinery increased its capacity 6%, to 631,000 b/cd. The additional capacity means the Galveston Bay refinery has overtaken Motiva’s 626,000-b/cd Port Arthur refinery as the largest refinery in the United States in terms of atmospheric distillation capacity.

  Three major refining transactions took place in 2023. In February 2023, Canadian refiner Cenovus acquired the 150,800-b/cd Toledo refinery in Ohio from BP-Husky Refining. In June, ExxonMobil sold its 61,500-b/cd refinery in Billings, Montana, to Par Montana —a portfolio company of Par Pacific. Finally, in September, Oneok acquired Magellan Midstream Partners, including Magellan’s 42,500-b/cd condensate splitter in Corpus Christi, Texas, as well as the company’s network of petroleum product and natural gas liquid pipeline infrastructure.

  This year’s Refinery Capacity Report includes 132 operable refineries, compared with 129 at the beginning of 2023. One new facility is included in our report: the reactivated 32,000-b/cd CPI Operations facility in Paulsboro, New Jersey, accounting for 10% of the additional distillation capacity last year.

  This year our report also includes two natural gasoline hydrotreaters operated by Enterprise and Targa Midstream near Mont Belvieu, Texas. The facilities were operating prior to January 1, 2024, but were only included beginning with this year’s report because of a methodological expansion in our surveys to include certain facilities that are not conventional petroleum refineries. Neither the Enterprise facility nor the Targa facility possess any atmospheric distillation capacity, which typically serves as the primary unit in most petroleum refineries.

  The 2024 Refinery Capacity Report only reflects changes in U.S. refining capacity in effect as of January 1, 2024. Phillips 66 formally ended petroleum refining operations at its Rodeo refinery in February 2024. The facility previously reported a capacity of 120,200 b/cd in 2023, but it has been scaling back operations and only reported a capacity of 58,200 b/cd as of January 1, 2024. This year-on-year reduction in capacity does not reflect the end of petroleum refining operations the following month, although the loss of the remaining capacity is reflected in our monthly refinery capacity and utilization data, beginning in March 2024. The facility has been transitioning to the production of biofuels, particularly renewable diesel.

  LyondellBasell previously said it would close its 263,776-b/cd refinery in Houston by the end of 2023, but it later announced it was delaying the closure. The firm currently expects to close the refinery by the end of the first quarter in 2025. Unless the closure is completed by January 1, 2025, the closure will not be reflected in next year’s Refinery Capacity Report.

  Annual refinery utilization decreased by one percentage point to 91% in 2023 because refinery capacity increases exceeded the increase in annual inputs.

  Utilization decreases when refineries go offline for necessary maintenance, unforeseen disruptions, or safety considerations. Running at 100% utilization of capacity for a sustained period is extremely difficult. Annual refinery utilization over the last 10 years (2014–23) has averaged about 89%.

  Utilization has been relatively high the last two years as refiners increased operations in response to high petroleum product prices, producing greater quantities of petroleum products such as motor gasoline and diesel. High prices reflected reduced global refinery capacity and changing global petroleum trade flows. However, refining capacity additions last year gradually contributed to decreasing product prices relative to 2022.

  U.S. thermal cracking (or coking) capacity increased 1.9% in 2023. Catalytic cracking capacity and hydrocracking capacity each increased by 0.4% from January 2023. Catalytic cracking, hydrocracking, and coking capacity all help refineries to reduce their yields of low-value residual products and increase their yields of high value products such as motor gasoline, diesel, and jet fuel.

  Desulfurization capacity, which is used to bring gasoline and diesel fuel into compliance with on-road emissions standards, also increased by 1.2%, which reflects the inclusion of the Enterprise and Targa Mont Belvieu facilities. Alkylation capacity, which is used to produce higher octane grades of gasoline, also increased by 1.2%, while isomerization capacity, which is also used to produce certain gasoline blend components, increased by 1.5%. Production capacity of on-site hydrogen increased by 1.3%. Aromatics production capacity increased by 19.8%.

  We produce two measures of refinery capacity: barrels per calendar day and barrels per stream day. Stream day capacity reflects the maximum input that a distillation facility can process within a 24-hour period when running at full capacity with an optimal crude oil and product slate and with no allowance for downtime. Stream day capacity is typically about 6% higher than calendar day capacity. Both measures for atmospheric distillation capacity are available in the report.
