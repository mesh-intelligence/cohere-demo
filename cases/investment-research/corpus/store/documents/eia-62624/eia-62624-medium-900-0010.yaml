text: 'We produce two measures of refinery capacity: barrels per calendar day and barrels per stream day. Stream day capacity reflects the maximum input that a distillation facility can process within a 24-hour period when running at full capacity with an optimal crude oil and product slate and with no allowance for downtime. Stream day capacity is typically about 6% higher than calendar day capacity. Both measures for atmospheric distillation capacity are available in the report.'
