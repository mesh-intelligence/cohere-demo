      A field contact says Quillon Basin Resources has returned a portion of its deferred gas wells to the completion schedule for late in the year, anticipating winter demand and more LNG export capacity. The company has not confirmed this.

      We would not read this as a change of strategy. It looks like an option being exercised on a forward curve that improved.
