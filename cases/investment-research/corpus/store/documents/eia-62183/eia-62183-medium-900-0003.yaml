text: U.S. crude oil exports to Canada are typically made up of low-density and low-sulfur crude oil grades shipped to Eastern Canada and make up only 8% of all U.S. crude oil export volumes, which reached a record in 2023. U.S. crude oil imported from Canada tends to be high-sulfur crude oil from oil sands in Western Canada, most of which is shipped to Midwestern and Gulf Coast U.S. refineries.
