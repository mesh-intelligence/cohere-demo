text_sha256: 85d5f87c6209b761cc882b7b20033089499605f7b04fd22312c9b7753c479cb7
text: Historically, exports from Canada’s key producing area in the West of the country have been limited mostly to the United States, comprising 80% of Canada’s total oil production in 2023. As a result, U.S. refineries have been able to capitalize on discounted Canadian crude oil volumes from Alberta. However, the recent startup of the Trans Mountain Pipeline expansion nearly tripled the crude oil produced in Alberta to be sent to Burnaby, a port in British Columbia with access to global oil tankers. The completion of the expansion is likely to shift some future crude oil volumes away from the United States and to new export markets.
