text: Electricity. Electricity trade between the two countries is small compared with trade in other energy sources. The value of electricity trade between the United States and Canada totaled $5 billion in 2023, most of which was electricity imported from Canada into the United States. The value of imported electricity from Canada into the United States fell by 19% in 2023 but accounted for 74% of the total electricity traded between the two countries.
