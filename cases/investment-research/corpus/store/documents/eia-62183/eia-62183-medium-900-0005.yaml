text: Petroleum products. Petroleum product trade between the United States and Canada decreased by about 6% by volume in 2023 and by about 19% by value, driven in part by more domestic motor gasoline supplies in Canada. The United States imported 549,000 b/d of petroleum products from Canada, a 3% decrease. The combination of lower fuel prices and smaller volumes led to an 18%, or $4 billion, decrease in the value of petroleum imports from Canada. Meanwhile, U.S. petroleum product exports to Canada in 2023 averaged 460,000 b/d, 10% less than in 2022. Similarly, the value of U.S. petroleum product exports to Canada in 2023 was 20% less than in 2022.
