    text: |-
      In conversations this quarter, Velmora Energy favored base dividends and buybacks, while Tessarine Petroleum talked mostly about adding drilling inventory before it gets more expensive. Both describe themselves as disciplined, and they mean different things by the word.

      A useful question for any memo on capital discipline is whether a company measures it against production growth, against cash returned, or against the cost of the next decade of locations.
