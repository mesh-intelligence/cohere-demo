text: Economic indicators that correlate with U.S. distillate fuel consumption suggest subdued economic activity. Industrial production —which measures output from manufacturing, mining, and utilities—declined on an annual basis for the second consecutive month in February 2024 and showed no growth in March. The American Trucking Association’s truck tonnage index —which measures domestic freight such as manufactured and retail goods carried by trucks—declined 1% in March 2024 compared with the same month in 2023, the 13th consecutive month of year-over-year declines.
