text: U.S. consumers used less heating oil than usual in the first quarter of 2024 (1Q24), part of the warmest winter on record, which we discussed recently in our Winter Fuels Outlook retrospective. Heating oil typically accounts for between 10% and 15% of U.S. distillate fuel consumption in the first quarter of every year, depending on the weather; it accounts for only about 4% the rest of the year. The winter of 2023–24 was 5% warmer than the winter of 2022–23 (measured as heating degree days). We estimate 6% less heating oil was consumed in the United States because of the warmer weather.
