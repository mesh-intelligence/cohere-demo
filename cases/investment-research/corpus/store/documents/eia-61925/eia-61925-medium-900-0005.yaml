text: On the West Coast, continued substitution of biofuels (particularly renewable diesel) for petroleum distillate is reducing consumption of petroleum-based distillate fuel in that region. Renewable diesel and biodiesel are biofuels that can be used in place of petroleum distillate fuel oil. Unlike conventional biodiesel, renewable diesel is chemically identical to petroleum diesel and can be blended as a drop-in replacement fuel. Renewable diesel has a growing share of the region’s diesel fuel market because clean-fuel programs that began in 2011 provide incentives for its consumption.
