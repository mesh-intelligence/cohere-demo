text_sha256: 1d3c90eebd7e6c69767742264488eb8010ff9b2d67050a0a92f2c6a6ad034540
text: The top regional destinations for U.S. crude oil exports since 2018 have been Europe as well as Asia and Oceania. Europe became the top export destination in 2023 following the effects of Russia’s full-scale invasion of Ukraine and the inclusion of West Texas Intermediate (WTI) crude oil in Dated Brent. In 2022, U.S. crude oil exports to Europe increased significantly following Russia’s full-scale invasion of Ukraine and subsequent EU sanctions banning imports of seaborne crude oil from Russia (adopted June 3, effective December 5). These effects of the sanctions contributed to continued growth in U.S. exports to Europe in 2023. In 2023, U.S. crude oil exports to Europe averaged 1.8 million b/d, slightly more than U.S. exports to Asia and Oceania of 1.7 million b/d.
