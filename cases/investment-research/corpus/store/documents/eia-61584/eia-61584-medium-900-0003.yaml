text: Another factor affecting the volume of U.S. crude oil exports to Europe is the inclusion of WTI crude oil in Dated Brent, a European crude oil benchmark. Prior to May 2023, the price of Dated Brent was determined based on a basket of different European crude oils. Starting in May 2023 (for physical delivery in June), WTI cargoes delivered to Rotterdam were included, likely attracting additional volumes to Europe.
