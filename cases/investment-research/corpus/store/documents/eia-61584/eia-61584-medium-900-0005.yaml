text: China received the second-most U.S. crude oil in 2023, averaging 452,000 b/d, more than double 2022 volumes. China’s crude oil imports in 2023, the most since at least 2005, also included significantly more oil from Russia, according to data from China’s General Administration of Customs. Refinery expansions and initiatives to reopen the economy after China’s government eased COVID-19 mobility restrictions drove the rise in China’s crude oil imports. In addition, increased crude oil imports also helped increase commercial and government crude oil stockpiles in China, according to trade press.
