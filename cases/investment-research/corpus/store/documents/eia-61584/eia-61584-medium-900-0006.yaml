text: In contrast to increasing U.S. crude oil exports to the Netherlands and China, U.S. crude oil exports to India fell 47% (146,000 b/d). India increased imports from Russia following sanctions that limited the price Russia could charge for crude oil exported using the services of sanctioning countries; importers in India have been favoring the lower-cost crude oil from Russia over crude oil from the United States. According to data from Vortexa Analytics, average annual crude oil exports from Russia to India doubled from 0.9 million b/d in 2022 to 1.8 million b/d in 2023.
