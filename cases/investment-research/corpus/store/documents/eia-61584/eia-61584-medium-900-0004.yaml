text: The WTI crude oil to be included in determining the Dated Brent price is delivered into Rotterdam, a large crude oil storage and trading hub in the Netherlands. The Netherlands received more U.S. crude oil exports than any other country in 2023, averaging 652,000 b/d. The combination of sanctions against Russia and U.S. exports reacting to WTI’s inclusion in Brent contributed to U.S. exports to the Netherlands increasing 82% (293,000 b/d) in 2023 compared with 2022, the largest volumetric growth for any country.
