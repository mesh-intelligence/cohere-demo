text: |-
  First-round indications for Ardenfall Gas Gathering came in below Marrowick Capital's valuation case, with bidders haircutting the 2025 gas price recovery. Marrowick is deciding whether to extend the process into next year.

  Wall-crossed staff only. Bidder identities and the valuation gap are not to be shared across the barrier under any circumstances.
