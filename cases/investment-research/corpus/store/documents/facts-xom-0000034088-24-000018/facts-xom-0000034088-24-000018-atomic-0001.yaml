text: |-
  Exxon Mobil Corporation (XOM) reported the following values in its Form 10-K filed 2024-02-28 for fiscal 2023 FY.

  Reported revenue was $344.58 billion for the period 2023-01-01 to 2023-12-31.

  Reported net income was $36.01 billion for the period 2023-01-01 to 2023-12-31.

  Reported operating cash flow was $55.37 billion for the period 2023-01-01 to 2023-12-31.

  Reported capital expenditure was $21.92 billion for the period 2023-01-01 to 2023-12-31.

  Reported total assets was $376.32 billion as of 2023-12-31.

  Reported cash and cash equivalents was $31.54 billion as of 2023-12-31.
