    text: |-
      ConocoPhillips (COP) reported the following values in its Form 10-Q filed 2024-08-01 for fiscal 2024 Q2.

      Reported revenue was $13.62 billion for the period 2024-04-01 to 2024-06-30.

      Reported net income was $2.33 billion for the period 2024-04-01 to 2024-06-30.

      Reported operating cash flow was $9.90 billion for the period 2024-01-01 to 2024-06-30.

      Reported total assets was $95.99 billion as of 2024-06-30.

      Reported cash and cash equivalents was $4.29 billion as of 2024-06-30.
