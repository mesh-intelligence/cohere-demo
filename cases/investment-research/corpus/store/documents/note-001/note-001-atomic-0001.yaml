text: |-
  Management at Velmora Energy told our sector team that the 2024 budget holds rig count flat in its Permian acreage despite weaker natural gas realizations. Their stated priority is free cash flow over volume growth, and they describe any additional rig as needing to clear a return hurdle at a lower oil price than they assumed a year ago.

  Our read is that the discipline is real but untested. Velmora has not yet faced a year in which holding flat cost it market share among its peers in the basin.
