text: Although India’s growth in percentage and volume terms exceeds China’s growth in our forecast, China still consumes significantly more oil. Total consumption of liquid fuels in India was 5.3 million b/d in 2023, while China consumed more than triple that amount at 16.4 million b/d in 2023, based on estimates in our December STEO.
