text: U.S. energy consumption declined slightly in 2023. Since reaching a record 99 quads in 2007, U.S. energy consumption has fluctuated between 89 quads and 97 quads per year. The combined consumption of petroleum and natural gas, the most-consumed energy sources in the United States in 2023, remained virtually unchanged from 2022 to 2023. Coal consumption fell 17% to 8 quads, the least since the 19th century, largely due to decreased use of coal for electricity generation.
