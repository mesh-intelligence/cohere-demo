text: On July 10 in New England, 468,403 megawatthours (MWh) of electricity was generated, 31% more than the previous five-year average, and natural gas-fired generation supplied more than half of all the electricity generated in the region. New England has more natural gas-fired generation capacity than it does petroleum- or coal-fired generation capacity; however, use of both also increased during the heat waves to meet the increase in electricity demand.
