text: Natural gas During the June and July heat waves, more natural gas was consumed in New England’s electric power sector than during the same periods in any of the previous five years. During the week of June 16–23, the electric power sector in New England consumed an average of 1.6 billion cubic feet per day (Bcf/d), according to S&P Global Commodity Insights. Consumption exceeded 2.0 Bcf/d on June 19 and June 20, putting those days among the 15 days with the most natural gas consumed in the electric power sector in New England. Compared with the June heat wave, natural gas consumed for electricity generation the week of July 6–13 remained relatively steady, averaging 1.8 Bcf/d.
