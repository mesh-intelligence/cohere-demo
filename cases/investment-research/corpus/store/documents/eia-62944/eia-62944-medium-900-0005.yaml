text: Other sources of generation Electricity imported from Canada and from New York, as well as use of renewable generation, also increased to meet rising air-conditioning demand in New England during the June and July heat waves. During the week in June, imports from New York and Canada accounted for 9% of the electricity mix; wind, solar, and hydropower generation accounted for 12% of generation; and nuclear accounted for 22%. During the July heat wave, electricity imports averaged 12%; wind, solar, and hydropower accounted for 11% of total generation; and nuclear generation averaged 19% for the week.
