text: Petroleum and coal Use in New England of petroleum and coal to generate electricity also increased during both periods of strong electricity demand. Petroleum- and coal-fired generation make up small percentages of all the generating capacity in New England and are used when electricity demand spikes under extremely hot or cold conditions. On July 11, coal-fired generation made up 2% of the generation supply mix, or 7,038 MWh, compared with an average of 223 MWh in the first half of 2024.
