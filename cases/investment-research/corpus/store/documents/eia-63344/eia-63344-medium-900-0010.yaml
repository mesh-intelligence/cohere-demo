text: In our September STEO, we forecast that annual natural gas-fired generation in ERCOT will fall by 5% between 2024 and 2025 to an annual total of 198 billion kWh in response to increased generation from renewable energy sources, particularly solar. Our scenario with stronger growth in large-load demand results in 8% more natural gas-fired generation in 2025 than the baseline forecast, at 213 billion kWh. Our low-growth scenario forecasts 12% less natural gas-fired generation than the baseline.
