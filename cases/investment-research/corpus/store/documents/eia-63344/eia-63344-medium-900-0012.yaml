text: The other major source of power generation that could change under different assumptions about electricity demand trends would be coal, which accounted for 14% of ERCOT generation in 2023. Like natural gas, coal has more flexible generation patterns than renewables, and so changes in demand are more likely to raise or lower coal-fired generation. In our low-growth scenario, we forecast 5% less ERCOT coal-fired generation in 2025 than the STEO base case forecast of 62 billion kWh and 12% more in the high-growth scenario.
