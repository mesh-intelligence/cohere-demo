text: These facilities consume large amounts of electricity, both to run their computing equipment and to keep them cool. Some of the larger facilities can consume as much electricity as a medium-sized power plant. In mid-2022, ERCOT developed a program for approving proposed LFL customers (those with an expected peak demand capacity of 75 megawatts [MW] or greater) to ensure grid reliability. The LFL Task Force publishes periodic status updates that indicate how much capacity has been approved and is expected in upcoming years.
