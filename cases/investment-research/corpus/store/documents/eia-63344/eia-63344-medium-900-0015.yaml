text: ERCOT set up its LFL program for large-load customers to help manage the impact of potentially strong growth in demand. By requiring approval of the projects and encouraging curtailment of demand when needed, the LFL process intends to minimize the risk of wholesale power prices spiking to levels of $1,000/MWh or more. Texas is pursuing other avenues to accommodate the expected increase in power demand from large computing facilities such as the Texas Energy Fund, which is designed to encourage development of new dispatchable generating capacity.
