text: The fastest-growing source of new electric generating capacity in the United States is solar power, with growth concentrated in Texas. Our base case STEO forecasts that solar generation in ERCOT by the electric power sector will grow by 54% in 2025 to 67 billion kWh. Solar power is generally dispatched as generation whenever it’s available because it does not have operating costs like fossil-fuel generators. It can also be curtailed to avoid grid congestion or if electricity demand is low at a particular time. In 2023, about 3% of solar output in ERCOT was curtailed. In our high-growth scenario, we forecast 2% more solar generation than in the base case in 2025 because less output would need to be curtailed.
