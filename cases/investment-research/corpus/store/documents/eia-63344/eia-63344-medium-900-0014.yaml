text: The scenario with less-than-expected growth in large-load demand reduces forecasted 2025 wholesale power by 11% from the base case STEO forecast, while the high-growth scenario increases prices by 17% from the base case. In both scenarios the largest differences from the base case scenario occur in the summer months. LFL demand was curtailed only during 10 hours of the high-growth and base case scenarios, averaging 23% of LFL in the high-growth scenario and 13% of LFL in the base case during those hours.
