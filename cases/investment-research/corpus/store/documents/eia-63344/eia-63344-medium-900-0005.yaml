text_sha256: 29e2d6836c9949f97cfdd024989866a845498ec7b1b91414b220604fbd1d006f
text: Although much planned capacity for large-load customers is awaiting approval from ERCOT, when or if the capacity will be brought online remains uncertain. ERCOT’s status update from early September indicates that projects representing about 26,500 MW of LFL capacity have applied to become operational by the end of 2025. This amount includes about 2,000 MW of capacity for projects that have not yet submitted plans and more than 12,000 MW of capacity for projects that currently have plans under review by ERCOT. Given the typical approval timeline, these projects are unlikely to come online by the end of next year.
