text: To analyze the potential effects of different levels of future large-load electricity demand on power generation and wholesale prices in ERCOT, we modeled two scenarios with different assumptions about 2025 LFL capacity and compared the results with the September STEO forecast as a base case. In all three cases, we assume that LFL facilities will be demand-responsive, cutting back part of their electricity consumption during hours when potential wholesale power prices exceed $100 per megawatthour (MWh). The actual level of curtailment observed could vary greatly from these assumptions depending on whether the large-load customer believes the incentives are worthwhile.
