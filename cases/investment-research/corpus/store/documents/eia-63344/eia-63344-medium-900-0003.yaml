text_sha256: afc7223740c4903aa200f3adc40d1d8309c0b51c9f119d3540adaa990ecece51
text: Certain large-load facilities, primarily cryptocurrency mining facilities but also data centers and some industrial factories, have entered into voluntary curtailment agreements with ERCOT to temporarily reduce their power consumption during periods of particularly high system demand or low generator availability. As part of the program, LFL facilities can participate in ERCOT’s energy and ancillary service markets. This flexibility in large-load operations can help mitigate some of the effects that strong growth in electricity demand is having on the ERCOT system.
