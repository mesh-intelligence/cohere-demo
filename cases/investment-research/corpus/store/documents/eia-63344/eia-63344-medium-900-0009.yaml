text: The largest source of electricity generation in ERCOT is natural gas, accounting for 45% of that region’s generation in 2023. We assume that existing and planned generating capacity is the same across the three scenarios, and our different assumptions about future electricity demand have the most effect on natural gas generation. In reality, the electric power sector could respond to the expected level of future demand by expanding the capacity available from other sources of generation.
