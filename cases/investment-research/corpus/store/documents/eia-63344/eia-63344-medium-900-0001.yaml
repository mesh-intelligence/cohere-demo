text_sha256: 9cfd296854bad31fb3b3297124e2dc6e7866a2d6094f9c18df72221a400da151
text: In the United States, electricity consumption is growing fastest in Texas, where the Electric Reliability Council of Texas (ERCOT) manages 90% of the load on the state’s power grid. One of the main sources of growing demand for power is large-scale computing facilities such as data centers and cryptocurrency mining operations, although their future demands are uncertain. In our latest Short-Term Energy Outlook (STEO), we expect electricity demand from customers identified by ERCOT as large flexible load (LFL) will total 54 billion kilowatthours (kWh) in 2025, up almost 60% from expected demand in 2024. This expected demand from LFL customers would represent about 10% of total forecast electricity consumption on the ERCOT grid next year.
