text: In our baseline September STEO, we forecast that ERCOT’s electricity load across all types of customers will grow by 5% from 464 billion kWh in 2024 to 487 billion kWh in 2025. In contrast, in our low-growth scenario, overall ERCOT load would grow by only 1% next year, and in our high-growth scenario, ERCOT load would grow by 10%. For both the low- and high-growth scenarios, we assume all other factors (such as generator fuel costs and non-LFL) remain the same as in the baseline forecast.
