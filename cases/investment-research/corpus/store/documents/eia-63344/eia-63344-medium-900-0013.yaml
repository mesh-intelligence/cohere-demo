text: The effect of uncertain future electricity consumption is most evident in wholesale power prices, which reflect how well generating supply can meet electricity demand. As a representative wholesale price for ERCOT, the STEO uses average settlement point prices (SPP) during peak hours at the North zone hub, which includes the Dallas-Fort Worth metropolitan area. The base case STEO forecasts ERCOT wholesale power prices in 2025 will average about $27/MWh, which would be 22% lower than our expected wholesale price for 2024. Lower prices are a result of expected lower fuels costs for natural gas along with increased penetration of solar generation.
