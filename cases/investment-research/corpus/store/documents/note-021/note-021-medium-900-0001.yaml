text: |-
  Brannock Drilling Services expects its Permian customers' 2025 budgets to come in flat to slightly lower, based on early conversations. The one exception it mentions is private operators, who are more sensitive to the current oil price than public companies are.

  Contractor commentary tends to lead formal guidance by a few months, though Brannock also has an interest in presenting a stable outlook to its lenders.
