      EOG Resources, Inc. (EOG) reported the following values in its Form 10-Q filed 2024-05-02 for fiscal 2024 Q1.

      Reported revenue was $6.12 billion for the period 2024-01-01 to 2024-03-31.

      Reported net income was $1.79 billion for the period 2024-01-01 to 2024-03-31.

      Reported operating cash flow was $2.90 billion for the period 2024-01-01 to 2024-03-31.

      Reported total assets was $44.80 billion as of 2024-03-31.

      Reported cash and cash equivalents was $5.29 billion as of 2024-03-31.
