text: |-
  Velmora Energy has withdrawn from Project Larkspur, having concluded that firm capacity contracts give it most of the takeaway protection it wanted at far less capital. Sablecrest Midstream's gathering assets stay with it.

  Wall-crossed staff only until compliance confirms the matter is closed. The outcome bears on Velmora's capital plan, and the deal team should not share that inference across the barrier.
