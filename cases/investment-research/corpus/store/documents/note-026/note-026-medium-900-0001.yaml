text: |-
  Sablecrest Midstream's planning case has Permian associated gas growing again in 2025 even if oil-directed activity stays flat, because gas-to-oil ratios rise as wells age and as operators target gassier benches.

  That matters for the discipline debate. Flat drilling budgets do not imply flat gas supply when the gas is a byproduct of oil decisions.
