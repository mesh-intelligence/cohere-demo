text: |-
  On October 14, California Governor Gavin Newsom signed bill Abx2-1 into law, empowering California regulators to set and adjust minimum petroleum product inventory levels for refiners in the state, in part to address the state’s fuel price volatility. Shortly after, refiner Phillips 66 announced plans to close its Wilmington refinery in Los Angeles by the end of 2025, citing uncertainty surrounding the long-term sustainability of the refinery.

  The new law empowers the California Energy Commission (CEC) to develop and impose minimum storage level requirements for refined transportation fuels for each refiner in the state. The law allows regulators to adjust minimum storage volumes based on regional and seasonal market conditions, refinery size, and storage capacity. It also empowers the CEC to consider the use of a tradable mechanism for compliance with the minimum inventory law, which the state has used in the past for programs such as its Low Carbon Fuel Standard (LCFS).

  The bill is intended to prevent wide swings in the gasoline price. California retail gasoline prices are consistently among the highest in the country and regularly exceed the U.S. average price by more than $1 per gallon. While multiple factors contribute to higher retail gasoline prices in California, including higher crude oil costs and higher refining costs on the West Coast, the region has also historically maintained lower inventory levels relative to the rest of the country.
