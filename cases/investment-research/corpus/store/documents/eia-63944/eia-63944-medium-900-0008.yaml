text: Weak refinery margins have persisted on the West Coast and in the United States overall since the middle of this year. In May 2024, the crack spread for Los Angeles CARBOB (California Reformulated Blendstock for Oxygenate Blending)—an indicator of the profitability of refining gasoline from crude oil—dropped to 50 cents per gallon, about half of what it was the previous May. The Los Angeles spread hasn’t been below 50 cents per gallon on average in the month of May since 2019. Lower crack spreads in the second half of 2024 have been an issue for all U.S. refiners, not only those on the West Coast. The narrower spreads partly reflect global market conditions including more international refining capacity and weaker demand compared with the higher margin environment in 2022 and 2023.
