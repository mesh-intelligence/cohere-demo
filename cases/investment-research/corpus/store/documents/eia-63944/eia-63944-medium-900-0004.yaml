text_sha256: 94e0cbfc1b78104f50b3bc14693f9e68bb14f36b610bfde1d8ccbcb6d038c246
text: Market participants often use inventories to assess the availability of petroleum products. If inventories drop too low, retailers can struggle to secure the product they need, which increases prices as product becomes scarce. After removing pipeline volumes from total inventories, gasoline inventories in California have been consistently lower than the U.S. average on a days-of-supply basis. Days of supply is a measure of inventory relative to demand and is taken by dividing stock levels (in barrels) by consumption (in barrels per day). California’s inventory has averaged just over 20 days of supply over the last five years (2019–23), compared with the U.S. average of 21.6 days.
