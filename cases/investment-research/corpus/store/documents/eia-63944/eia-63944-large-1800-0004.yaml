text: Refinery crack spreads on the West Coast are typically higher than they are in other parts of the country, in part because of tighter supply-demand balances in the region, reflected by the lower average days of supply. Refiners in California must comply with the state’s Cap-and-Trade program, which requires them to bid for emissions allowances, as well as the state’s LCFS, which requires refiners (and importers or wholesalers) to buy carbon credits according to the volume of carbon-emitting fuels (such as gasoline and petroleum diesel) that they supply to the market. The costs of compliance with these measures are partly reflected in the wider wholesale crack spreads. As a result, higher crack spreads alone may not necessarily indicate higher net profits for refiners in the state, although they do indicate relatively higher prices for gasoline overall. The West Coast also tends to have higher refiner acquisition costs for crude oil because crude oil production is limited in the region and routes to import crude oil are often longer. The higher acquisition costs do not directly affect the crack spread for gasoline, but they do contribute to higher overall fuel prices.
