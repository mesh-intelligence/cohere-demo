text: The disconnect in gasoline and diesel prices suggests that gasoline imports are likely to grow in importance as a source of future supply for the state. Unlike increasing in-state refinery production, importers can import gasoline when they expect it will be in demand without producing surplus volumes of other fuels with lower margins. However, importers face longer shipping times between when an order is placed from abroad and when a cargo of gasoline or another fuel ultimately arrives in the state. Importers must also locate foreign refiners capable of meeting the specifications on California’s unique gasoline formulation, CARBOB.
