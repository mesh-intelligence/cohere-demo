text: The new law empowers the California Energy Commission (CEC) to develop and impose minimum storage level requirements for refined transportation fuels for each refiner in the state. The law allows regulators to adjust minimum storage volumes based on regional and seasonal market conditions, refinery size, and storage capacity. It also empowers the CEC to consider the use of a tradable mechanism for compliance with the minimum inventory law, which the state has used in the past for programs such as its Low Carbon Fuel Standard (LCFS).
