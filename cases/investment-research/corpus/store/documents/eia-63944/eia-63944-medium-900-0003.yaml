text: The bill is intended to prevent wide swings in the gasoline price. California retail gasoline prices are consistently among the highest in the country and regularly exceed the U.S. average price by more than $1 per gallon. While multiple factors contribute to higher retail gasoline prices in California, including higher crude oil costs and higher refining costs on the West Coast, the region has also historically maintained lower inventory levels relative to the rest of the country.
