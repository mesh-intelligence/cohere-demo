text: On October 14, California Governor Gavin Newsom signed bill Abx2-1 into law, empowering California regulators to set and adjust minimum petroleum product inventory levels for refiners in the state, in part to address the state’s fuel price volatility. Shortly after, refiner Phillips 66 announced plans to close its Wilmington refinery in Los Angeles by the end of 2025, citing uncertainty surrounding the long-term sustainability of the refinery.
