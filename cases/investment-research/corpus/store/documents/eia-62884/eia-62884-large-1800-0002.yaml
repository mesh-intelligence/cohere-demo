text: |-
  Producers make decisions on drilling and completion operations based on market conditions, prices, and infrastructure. A downward trend in the DUC count means producers are completing more wells than they are drilling.

  The metric we use for production from new wells is the first full month of production from each completed well. Aggregate production from new wells depends on both the number of wells completed and those wells’ initial production rates.

  We also measure how production is changing from existing wells, which we define as wells that have been producing for more than one month. Wells usually produce at their highest rate when they first start producing and pressure in the reservoir is high. As oil and natural gas are produced, the pressure in the reservoir falls, and production from the well declines. We monitor and forecast the monthly difference in aggregate production of existing wells and update our model as more accurate data become available.

  We use these drilling metrics, combined with production trends, to provide insights into how different basins are performing relative to one another based on ratios derived from the reported data series. We base our analysis of productivity and efficiency across various oil- and natural gas-producing regions on the insights we develop comparing these ratios by basin. For example, the decline in the number of DUC wells is less pronounced in the Permian region compared with the rest of the Lower 48 states. This trend suggests that as wells are completed in the Permian (removed from the DUC inventory), new wells are being drilled (added to the DUC inventory) at a faster pace than in other regions.

  U.S. crude oil and natural gas production has been increasing despite a decline in the number of active rigs since late 2022. Since early 2023, the Permian region has had more active rigs than the rest of the Lower 48 states and has continued to complete hundreds of wells (or prepare them for production) each month.
