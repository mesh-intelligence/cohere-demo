text: |-
  Producers make decisions on drilling and completion operations based on market conditions, prices, and infrastructure. A downward trend in the DUC count means producers are completing more wells than they are drilling.

  The metric we use for production from new wells is the first full month of production from each completed well. Aggregate production from new wells depends on both the number of wells completed and those wells’ initial production rates.
