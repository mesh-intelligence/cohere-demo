text_sha256: 34a18375799c8710871f29d4aa3c411c42f08861742e37a2eb19f12a254bec03
text: We use these drilling metrics, combined with production trends, to provide insights into how different basins are performing relative to one another based on ratios derived from the reported data series. We base our analysis of productivity and efficiency across various oil- and natural gas-producing regions on the insights we develop comparing these ratios by basin. For example, the decline in the number of DUC wells is less pronounced in the Permian region compared with the rest of the Lower 48 states. This trend suggests that as wells are completed in the Permian (removed from the DUC inventory), new wells are being drilled (added to the DUC inventory) at a faster pace than in other regions.
