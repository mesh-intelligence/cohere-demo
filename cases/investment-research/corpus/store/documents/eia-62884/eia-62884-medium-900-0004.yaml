text_sha256: b1063da7a283920c0192fc80b85bb0bee602a686c54c4b92543a64eddcf685da
text: |-
  The metric we use for production from new wells is the first full month of production from each completed well. Aggregate production from new wells depends on both the number of wells completed and those wells’ initial production rates.

  We also measure how production is changing from existing wells, which we define as wells that have been producing for more than one month. Wells usually produce at their highest rate when they first start producing and pressure in the reservoir is high. As oil and natural gas are produced, the pressure in the reservoir falls, and production from the well declines. We monitor and forecast the monthly difference in aggregate production of existing wells and update our model as more accurate data become available.
