text: In previous years, rapid growth in crude oil and natural gas production in the Permian region was temporarily constrained by the ability to move that production out of the region. Based on several projects currently under development, we expect that new pipeline capacity will deliver crude oil and natural gas from the Permian region to demand centers and alleviate transportation constraints. Enbridge announced that it is increasing Permian takeaway capacity by expanding its Gray Oak pipeline by 120,000 b/d before the end of 2025.
