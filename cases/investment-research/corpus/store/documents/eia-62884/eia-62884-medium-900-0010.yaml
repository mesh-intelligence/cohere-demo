text: 'Similarly, new natural gas pipelines are soon coming online: the 580-mile Matterhorn Express Pipeline, which is expected to enter service in the third quarter of 2024, will be able to transport up to 2.5 Bcf/d of natural gas from the Waha Hub in West Texas to Katy, Texas. The pipeline will receive natural gas from upstream Permian Basin connections and from direct connections at processing facilities in the Midland Basin before connecting to the Agua Blanca Pipeline.'
