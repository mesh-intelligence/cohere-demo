text: In our latest Short-Term Energy Outlook (STEO), we forecast that crude oil production in the United States will grow to an average of 13.7 million barrels per day (b/d) and marketed natural gas production will grow to an average of 114.3 billion cubic feet per day (Bcf/d) in 2025. Most of the forecast growth in oil and natural gas production comes from the Permian region of western Texas and eastern New Mexico, where we expect productivity gains, new and expanded infrastructure, and high crude oil prices will support rising production.
