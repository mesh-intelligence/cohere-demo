    text: |-
      ConocoPhillips (COP) reported the following values in its Form 10-Q filed 2024-10-31 for fiscal 2024 Q3.

      Reported revenue was $13.04 billion for the period 2024-07-01 to 2024-09-30.

      Reported net income was $2.06 billion for the period 2024-07-01 to 2024-09-30.

      Reported operating cash flow was $15.67 billion for the period 2024-01-01 to 2024-09-30.

      Reported total assets was $96.70 billion as of 2024-09-30.

      Reported cash and cash equivalents was $5.22 billion as of 2024-09-30.
