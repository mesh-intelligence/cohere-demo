text: |-
  Marathon Petroleum Corporation (MPC) reported the following values in its Form 10-Q filed 2024-08-06 for fiscal 2024 Q2.

  Reported net income was $1.51 billion for the period 2024-04-01 to 2024-06-30.

  Reported operating cash flow was $4.77 billion for the period 2024-01-01 to 2024-06-30.

  Reported capital expenditure was $1.07 billion for the period 2024-01-01 to 2024-06-30.

  Reported total assets was $85.23 billion as of 2024-06-30.

  Reported cash and cash equivalents was $4.44 billion as of 2024-06-30.
