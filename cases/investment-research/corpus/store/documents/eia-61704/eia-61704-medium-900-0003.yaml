text: Domestic ethane consumption, measured as product supplied, rose 5% in 2023 to 2.1 million b/d. In the United States, ethane is consumed almost exclusively in the petrochemical industry as a feedstock. Two new petrochemical crackers, located in Port Arthur, Texas, and in Monaca, Pennsylvania, ramped up operations in 2023 after coming on line in late 2022. Ethane consumption in the Gulf Coast (PADD 3), where most crackers are located, increased 4% from 2022 to 2.0 million b/d. Ethane consumption on the East Coast (PADD 1) more than doubled, averaging 38,000 b/d in 2023, a 22,000 b/d increase from 2022.
