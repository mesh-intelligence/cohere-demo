text: U.S. ethane exports averaged a record 471,000 b/d during 2023, a 57,000-barrel increase from the previous record set the year before. Strong ethane exports were driven by growth in global petrochemical sector demand and rising tanker capacity. Low prices for U.S. ethane compared with other feedstocks globally contributed to the record exports. China imported 45% of U.S. ethane exports in 2023, followed by India (16%), Canada (14%), and Norway (10%).
