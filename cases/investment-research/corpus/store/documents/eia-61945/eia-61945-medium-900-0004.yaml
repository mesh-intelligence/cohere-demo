text: Japan’s ample natural gas storage capacity contributes to the country’s energy security by helping to meet seasonal demand peaks and ensuring that natural gas remains available in case of interruption in global LNG supplies. Japan does not have international pipeline interconnections and imports about 98% of its natural gas in the form of LNG. LNG intended for consumption and additional volumes designated as reserves or inventory are stored in above-ground cryogenic storage tanks co-located at more than 30 of Japan’s LNG import terminals. Japan has the world’s largest LNG storage capacity, estimated to total 425.1 billion cubic feet (Bcf) of natural gas according to data from GIIGNL.
