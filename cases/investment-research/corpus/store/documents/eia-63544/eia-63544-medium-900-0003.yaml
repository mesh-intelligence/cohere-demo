text: U.S. energy consumption has increased steadily since 1974, although total consumption growth is less than total production growth. Between January and July 2024, U.S. energy consumption was 32%, or 13.2 quads, more than the same period in 1974. Consumption growth is due to several factors including population growth and increased economic activity. However, primary energy consumption has generally decreased on both a per capita basis and in terms of energy consumed per dollar of GDP since the 1970s. Increased energy efficiency has contributed to these decreases.
