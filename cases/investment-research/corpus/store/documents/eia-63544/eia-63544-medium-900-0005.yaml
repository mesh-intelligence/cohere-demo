text: Evolution of our data collection The MER, which predates the establishment of the U.S. Department of Energy in 1977, was first published by the Federal Energy Administration. The MER has grown from 22 tables and 55 graphs in its first issue to 101 tables and 182 graphs in the October 2024 publication. Recent data additions include electric vehicle stocks and electricity use, electricity net summer capacity and capacity factors, and a new total energy flow diagram. For a full list of changes and additions to the MER back to 2000, see the What’s New in the Monthly Energy Review page.
