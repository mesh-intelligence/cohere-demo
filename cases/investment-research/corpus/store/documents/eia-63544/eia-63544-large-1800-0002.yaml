text: |-
  The increase in energy production over the last two decades has turned the United States into the world’s largest crude oil and natural gas producer today and from a net energy importer to a net energy exporter starting in 2019. U.S. net energy imports in the first seven months of 1974 were about 6.8 quads. The United States exported a net total of about 5.0 quads during the same period in 2024. The main driver of this shift has been growing exports of crude oil and petroleum products and liquefied natural gas (LNG) over the last 15 years.

  Evolution of our data collection The MER, which predates the establishment of the U.S. Department of Energy in 1977, was first published by the Federal Energy Administration. The MER has grown from 22 tables and 55 graphs in its first issue to 101 tables and 182 graphs in the October 2024 publication. Recent data additions include electric vehicle stocks and electricity use, electricity net summer capacity and capacity factors, and a new total energy flow diagram. For a full list of changes and additions to the MER back to 2000, see the What’s New in the Monthly Energy Review page.
