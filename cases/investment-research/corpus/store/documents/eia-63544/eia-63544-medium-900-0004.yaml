text: The increase in energy production over the last two decades has turned the United States into the world’s largest crude oil and natural gas producer today and from a net energy importer to a net energy exporter starting in 2019. U.S. net energy imports in the first seven months of 1974 were about 6.8 quads. The United States exported a net total of about 5.0 quads during the same period in 2024. The main driver of this shift has been growing exports of crude oil and petroleum products and liquefied natural gas (LNG) over the last 15 years.
