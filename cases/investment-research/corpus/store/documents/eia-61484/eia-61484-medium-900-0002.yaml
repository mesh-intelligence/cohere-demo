text_sha256: 1aba3364636184d882ba18038bb29d36399c2fae954df0df6f0f224d7147220a
text: U.S. dry natural gas production generally rose throughout 2023, averaging a record high of 105.7 billion cubic feet per day (Bcf/d) in December 2023, according to data from S&P Global Commodity Insights. Following a temporary decline in production in mid-January due to winter storm Heather, production has remained relatively high since January 26, averaging over 104.1 Bcf/d. Natural gas consumption in the U.S. residential and commercial sectors so far this winter heating season (November 1, 2023–March 31, 2024) averaged about 5% (2.0 Bcf/d) lower than the five-year (2019–23) average, at 35.8 Bcf/d.
