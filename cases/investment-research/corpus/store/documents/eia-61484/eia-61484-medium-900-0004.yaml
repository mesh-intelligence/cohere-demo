text: Since February 7, the Henry Hub daily natural gas price has been below $2.00/MMBtu, reaching its lowest price on February 20; six of the record-low daily prices when adjusting for inflation occurred this month. The last time the Henry Hub price was this low was in 2020, when it averaged $2.05/MMBtu for the year. In 2020, low prices were largely due to the economic effects of the COVID-19 pandemic, including low natural gas consumption, and the mild 2019–20 winter, which ended with relatively high natural gas storage inventories.
