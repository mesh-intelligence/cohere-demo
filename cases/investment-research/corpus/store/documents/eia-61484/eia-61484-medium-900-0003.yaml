text: Because of high production and relatively low consumption, less natural gas has been withdrawn from storage this winter. For the week ending February 16, U.S. working natural gas inventories averaged 12% above the year-ago average and nearly 22% above the five-year (2019–23) average, according to our Weekly Natural Gas Storage Report. Relatively high storage levels indicate an oversupplied market and contribute to lower natural gas prices.
