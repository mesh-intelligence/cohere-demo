text: The U.S. benchmark Henry Hub daily natural gas price averaged $1.50 per million British thermal units (MMBtu) on February 20, 2024, the lowest price in inflation-adjusted dollars since at least 1997, according to data from Refinitiv Eikon. High natural gas production, low natural gas consumption, and higher natural gas inventories than the previous five-year (2018–22) average contributed to prices declining for much of 2023 and the first two months of 2024.
