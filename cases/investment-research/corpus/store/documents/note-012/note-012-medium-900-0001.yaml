text: |-
  Fenwright Power is restricted while our commodities desk discusses a long-term gas tolling agreement with it. The contract would tie a new gas-fired plant to data-center demand it expects in its service area.

  Sector analysts should avoid referencing Fenwright's plant economics or its load forecast until the restriction lifts.
