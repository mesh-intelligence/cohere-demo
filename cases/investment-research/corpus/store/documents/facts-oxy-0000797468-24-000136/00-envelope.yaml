    text: |-
      Occidental Petroleum Corporation (OXY) reported the following values in its Form 10-Q filed 2024-08-07 for fiscal 2024 Q2.

      Reported revenue was $6.82 billion for the period 2024-04-01 to 2024-06-30.

      Reported operating cash flow was $4.40 billion for the period 2024-01-01 to 2024-06-30.

      Reported capital expenditure was $3.55 billion for the period 2024-01-01 to 2024-06-30.

      Reported total assets was $76.22 billion as of 2024-06-30.

      Reported cash and cash equivalents was $1.84 billion as of 2024-06-30.
