text_sha256: 2039046862f30ff2f616f9d01477c2001a5e90ae1e60abd334fd4564e27db0d7
text: 'Pricing hubs provide transactional flexibility to buyers and sellers in the natural gas industry. The integrated North American market has close to 200 pricing hubs, which vary by size, location, type, liquidity, and age. Pricing hubs convey market information and make it easier for buyers and sellers to arrange natural gas deals in physical and financial markets across many time periods: intra-day, daily, weekly, balance-of-month, monthly, seasonally, and annually. Changes in prices at natural gas hubs tend to be reflected in movements in prices at nearby power market hubs or zones. A mix of private price reporting agencies and exchanges offer services and platforms to help buyers, sellers, and market observers obtain pricing information. Pricing hubs are dynamic; new ones are established or are retired based on market conditions and consumer preferences.'
