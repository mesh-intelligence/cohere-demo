text: Northeast region (defined as New York, New England, and Pennsylvania) Algonquin Citygate is an important pricing hub in the northeastern United States, and prices at this hub reflect natural gas market dynamics in Boston, Massachusetts, and elsewhere in New England. New England relies heavily on natural gas for heating in the winter months, but supplies are constrained by the region’s limited natural gas pipeline capacity and changing fuel mix. Price volatility at Algonquin Citygate is typically related to these periods of peak demand.
