text: Midwest region At Chicago Citygate in Illinois, seven major interstate pipelines transporting natural gas from Canada, the Southwest, and the Gulf of Mexico converge. Chicago Citygate, the primary pricing hub for end users in Chicago and parts of the upper Midwest, is linked to three pipelines that transport natural gas from Henry Hub, increasing the linkage of prices between the two hubs. This market is also close to storage, and abundant infrastructure helps to moderate seasonal and daily price volatility at this hub.
