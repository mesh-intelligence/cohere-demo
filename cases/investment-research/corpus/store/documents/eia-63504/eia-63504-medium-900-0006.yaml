text: Pacific region SoCal Citygate is the major natural gas pricing hub in Southern California in the Los Angeles Basin, with substantial natural gas consumption by the various local sectors, averaging about 2.5 billion cubic feet per day (Bcf/d) in 2023. SoCal Citygate prices reflect the price of moving natural gas from diverse nearby basins and Mexico into the Los Angeles metro area’s distribution system. Prices also include the cost of transporting natural gas from the California border to the distribution system in the greater Los Angeles Basin. SoCal Citygate traded at prices that were historically low for this hub through the first eight months of 2024, due to milder winter conditions, increased solar generation, more natural gas in storage, and increased hydroelectric power generation.
