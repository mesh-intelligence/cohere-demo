text: The Houston Ship Channel (HSC) is in southeastern Texas in the Port of Houston, surrounded by numerous natural gas and processing plants along the Gulf Coast. The HSC market is diverse, providing price transparency and liquidity for exports markets, industrial and process gas uses, and power generation. Production from the nearby Eagle Ford shale formation accounted for about 6% of total marketed natural gas in the United States last year. Growing LNG exports and related facilities that process the hydrocarbon gas liquids present in natural gas in this region have also further increased the significance of this hub, as have increased natural gas exports via pipeline to Mexico.
