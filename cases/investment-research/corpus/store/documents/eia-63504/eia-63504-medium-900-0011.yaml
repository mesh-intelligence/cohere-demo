text: Transco Zone 6 NY is a key pricing hub primarily serving New York City. Named after the Transcontinental Gas Pipe Line Company, Transco is the main pipeline serving the U.S. eastern seaboard. Price volatility at Transco Zone 6 NY tends to be reflected in locational marginal prices in the New York Independent System Operator’s zones in New York City (Zone J) and Long Island (Zone I). Historically, disruptions or constraints along this long-distance pipeline quickly affected prices, but recently, production in the Appalachian Basin has muted those effects. Competing needs for deliveries along the Transco network can contribute to higher prices at Transco Zone 6 NY, especially in the winter.
