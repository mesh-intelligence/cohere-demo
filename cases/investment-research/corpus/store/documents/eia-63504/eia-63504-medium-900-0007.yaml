text: Opal is a key natural gas pricing hub in southwestern Wyoming. The Kern River Gas Transmission pipeline, which is connected to the Opal Hub, is the only interstate pipeline that delivers natural gas directly from the Rocky Mountain region to Southern California. This pipeline receives about 25% of the Rocky Mountain’s natural gas supply, and its deliveries account for approximately 25% of California’s natural gas demand, according to pipeline owner BHE. Operations at Opal’s large nearby processing plant often influence price volatility.
