text: Northwest Sumas is the key pricing hub along the British Columbia-Washington border for natural gas in the Pacific Northwest, providing customers in the Pacific Northwest with natural gas supply diversity. Sumas prices reflect market conditions in the Pacific Northwest, such as the state of the regional hydroelectric market, natural gas storage availability, space heating needs, upstream gas conditions in British Columbia, and increasing power burn.
