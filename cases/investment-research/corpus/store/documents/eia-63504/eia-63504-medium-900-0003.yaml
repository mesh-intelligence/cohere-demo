text: |-
  A closer look at key pricing hubs around the United States

  South Central region Henry Hub in Erath, Louisiana, has many features that make it an important pricing benchmark: pipeline interconnectivity, proximity to storage and production, access to diverse markets, and lots of buyers and sellers of natural gas, especially with growing export markets for natural gas. Henry Hub is the delivery location for natural gas futures contracts transacted on the New York Mercantile Exchange (NYMEX) that go to physical settlement. Most natural gas at U.S. trading hubs is priced relative to Henry Hub, which is also an increasingly relevant benchmark for global liquefied natural gas (LNG) purchases, as U.S. exports increase and as Henry Hub price indexation is used to price deliveries at U.S. export terminals.
