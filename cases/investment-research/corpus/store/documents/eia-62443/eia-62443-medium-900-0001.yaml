text: Annual jet fuel consumption in the United States grew in 2023 for the third year in a row but remained below the pre-pandemic peak in 2019, suggesting U.S. aviation had not fully returned to normal operations in the third year after the onset of the COVID-19 pandemic. U.S. jet fuel consumption averaged 1.65 million barrels per day (b/d) in 2023, 5% below the pre-pandemic high in 2019. So far this year, airline passenger volumes have surpassed 2019 levels and are consistently higher than in 2023.
