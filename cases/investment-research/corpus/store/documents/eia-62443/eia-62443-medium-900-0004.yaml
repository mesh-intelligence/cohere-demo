text: U.S. activity by foreign-based commercial passenger airlines continued to lag pre-pandemic activity in 2023 and was the major reason for less U.S. jet fuel consumption. In terms of available seat-miles, a measure of aircraft carrying capacity, foreign-based carriers offered 14% less capacity in 2023 than in 2019 for routes between the United States and international destinations. Over the same period, U.S.-based carriers increased their capacity for international routes by 2% and for domestic routes by 4%. Total available seat-miles for all routes were 2% less in 2023 than in 2019.
