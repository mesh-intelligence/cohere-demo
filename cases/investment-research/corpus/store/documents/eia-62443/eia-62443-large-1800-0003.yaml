text: The increasing fuel efficiency of newer airplanes has also limited U.S. jet fuel consumption. Commercial airlines continue to improve the fuel economy of their fleets to reduce operating costs. The average fuel economy of U.S. commercial carriers in terms of available seat-miles per gallon increased to 65.5 seat-miles per gallon in 2023 compared with 64.9 seat-miles per gallon in 2019. As aircraft manufacturers engineer and deliver more energy-efficient aircraft and engines into service, new aircraft, whether acquired to expand capacity or replace existing capacity, help to increase fuel efficiency in the commercial fleet.
