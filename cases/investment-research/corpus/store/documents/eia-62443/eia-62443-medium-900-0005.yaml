text: Declining air freight activity was another factor for slower growth in U.S. jet fuel consumption in 2023. Early in the pandemic, consumers spent less on services and more on goods, increasing jet fuel consumption by freight carriers. Air freight activity in terms of pounds transported increased by 12% from 2020 to 2021. Since then, freight activity from 2021 to 2023 declined 12% as supply chain constraints eased and spending on goods returned to typical levels, reducing jet fuel consumption by freight carriers.
