text_sha256: 001a3a7edf4fe19bcef37abe10b6f73f13d609f1c132b2854417ac8d25f39648
text: Petroleum products. In 2023, Mexico was the largest export market for U.S. petroleum products. Mexico has an aging refinery system and struggles to maintain the output needed to satisfy its domestic petroleum product demand. As a result, Mexico imports U.S. petroleum products such as gasoline, diesel fuel, and propane. Petroleum products accounted for 87% of the total energy exports from the United States to Mexico in 2023. U.S. petroleum product exports to Mexico averaged 1.2 million b/d in 2023, up 1% from 2022. Although the volume of exports increased, the value of U.S. petroleum product exports decreased by 9% when adjusted for inflation, dropping to $36 billion in 2023 from $40 billion in 2022.
