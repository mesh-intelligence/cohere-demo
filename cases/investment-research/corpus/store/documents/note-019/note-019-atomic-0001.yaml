text: |-
  Corvale Refining has deferred a proposed unit expansion, citing the margin outlook and competition from new capacity abroad. It will keep spending on reliability and on low-carbon compliance, which management treats as non-discretionary.

  The split between discretionary growth and required compliance spending is worth drawing out when comparing refiners' capital plans with those of upstream producers.
