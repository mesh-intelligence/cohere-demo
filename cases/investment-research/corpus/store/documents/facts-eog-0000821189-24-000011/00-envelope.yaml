    text: |-
      EOG Resources, Inc. (EOG) reported the following values in its Form 10-K filed 2024-02-22 for fiscal 2023 FY.

      Reported revenue was $24.19 billion for the period 2023-01-01 to 2023-12-31.

      Reported net income was $7.59 billion for the period 2023-01-01 to 2023-12-31.

      Reported operating cash flow was $11.34 billion for the period 2023-01-01 to 2023-12-31.

      Reported total assets was $43.86 billion as of 2023-12-31.

      Reported cash and cash equivalents was $5.28 billion as of 2023-12-31.
