      Marathon Petroleum Corporation (MPC) reported the following values in its Form 10-Q filed 2024-11-05 for fiscal 2024 Q3.

      Reported net income was $622.0 million for the period 2024-07-01 to 2024-09-30.

      Reported operating cash flow was $6.46 billion for the period 2024-01-01 to 2024-09-30.

      Reported capital expenditure was $1.72 billion for the period 2024-01-01 to 2024-09-30.

      Reported total assets was $79.83 billion as of 2024-09-30.

      Reported cash and cash equivalents was $4.00 billion as of 2024-09-30.
