text: |-
  EOG Resources, Inc. (EOG) reported the following values in its Form 10-Q filed 2024-08-01 for fiscal 2024 Q2.

  Reported revenue was $6.03 billion for the period 2024-04-01 to 2024-06-30.

  Reported net income was $1.69 billion for the period 2024-04-01 to 2024-06-30.

  Reported operating cash flow was $5.79 billion for the period 2024-01-01 to 2024-06-30.

  Reported total assets was $45.22 billion as of 2024-06-30.

  Reported cash and cash equivalents was $5.43 billion as of 2024-06-30.
