text: In our latest Short-Term Energy Outlook, we forecast that U.S. working natural gas inventories will be 3,954 billion cubic feet (Bcf) by the end of October, the most natural gas in U.S. storage since November 2016. We forecast less-than-average cumulative injections for the rest of the injection season (through October) because inventories were relatively well supplied in March and because we expect more U.S. consumption of natural gas than average this summer and relatively flat natural gas production.
