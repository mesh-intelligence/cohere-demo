text: At the end of March 2024, 38% more working natural gas was stored in inventories in the South Central region than on average over the previous five years (2019–23). Injections into natural gas storage so far this injection season in the South Central region have been below the five-year average, although we expect them to follow a similar pattern to the past several years, with withdrawals in both July and August.
