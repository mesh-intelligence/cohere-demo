text: Working natural gas inventories in the United States follow a seasonal pattern, generally increasing from April through October, which we consider the injection season, when natural gas consumption is relatively low. Inventories decrease from November through March, the withdrawal season, when natural gas consumption is relatively high. However, in the South Central region, where more natural gas is stored than in any other region, we occasionally see withdrawals of natural gas in the summer. Some of the nation’s most flexible storage capability is located in the South Central region’s salt caverns, which can be drawn down quickly. The South Central’s unique seasonal pattern has become more prominent as the use of natural gas for electric power generation has increased in Texas and surrounding states.
