text: Because of its flexibility and proximity to LNG terminals, South Central storage capacity is used to help manage fluctuations in natural gas deliveries to LNG terminals. For example, during times of maintenance or operational disruptions at LNG terminals and less domestic consumption, natural gas is injected into storage until demand increases. Similarly, during periods of extreme heat in the summer and corresponding demand for air conditioning, natural gas is withdrawn quickly from storage and consumed in power plants to meet demand for electricity.
