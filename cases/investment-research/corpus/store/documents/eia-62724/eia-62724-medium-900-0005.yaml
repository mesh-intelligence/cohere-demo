text: As summers have gotten warmer and natural gas-fired generation capacity has increased, natural gas consumption in the electric power sector has increased to meet air-conditioning demand, developing a second, smaller peak in the year, typically in July or August. Much of the increased U.S. natural gas demand since 2012 has come from the southern United States, including Texas and Louisiana. The second peak in consumption in the summer shows up in the inventory pattern in the South Central region as another prominent withdrawal period.
