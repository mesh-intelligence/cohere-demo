text: |-
  Guyana, situated on South America's northern coast neighboring Venezuela, Suriname, and Brazil, has emerged as a significant contributor to growth in the global supply of crude oil. Since starting production in 2019, Guyana has increased its crude oil production to 645,000 barrels per day (b/d) as of early 2024, all from the Stabroek block.

  Guyana increased crude oil production by an annual average of 98,000 b/d from 2020 to 2023, making it the third-fastest growing non-OPEC producing country during this period. Crude oil production has been the largest contributor to Guyana’s economic growth in recent years. In 2022, Guyana’s GDP grew by 62.3%, the highest real GDP growth in the world that year, according to the International Monetary Fund (IMF).

  Guyana's most recent estimate of recoverable oil and natural gas resources is more than 11 billion oil-equivalent barrels, and developers are still exploring the country’s offshore waters. Guyana's discovered oil and natural gas resources are currently located offshore within the Guyana-Suriname Basin of the Atlantic Ocean.

  The first significant oil discovery in offshore Guyana was made by ExxonMobil in 2015 at what is now the Liza project in the Stabroek block. Since then, ExxonMobil and its partners, Hess and the China National Offshore Oil Corporation (CNOOC), have made more than 30 additional offshore oil and natural gas discoveries within the Stabroek block.
