text: Russia, Saudi Arabia, and Iraq were China’s main sources of crude oil imports in 2023. Compared with 2022, China’s 2023 crude oil imports increased the most from Russia, Iran, Brazil, and the United States. China’s largest volumetric increase in crude oil imports in 2023 was from Russia. From 2019 to 2021, China obtained 15% of its crude oil imports from Russia, second only to Saudi Arabia. In 2023, Russia became China’s top source of crude oil imports, supplying 19% of China’s crude oil imports (2.1 million b/d). This increase was the result of discounts related to sanctions and price caps on crude oil from Russia following its full-scale invasion of Ukraine in 2022.
