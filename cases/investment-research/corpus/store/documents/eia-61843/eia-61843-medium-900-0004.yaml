text: Although China’s overall crude oil imports increased, crude oil imports from a few of its largest sources decreased. Notably, after crude oil from Russia became available at a discount when sanctions were imposed, China decreased its crude oil imports from Western Europe, where crude oil prices were relatively high. China’s crude oil imports from Norway decreased 100,000 b/d from 2022 to 2023, and China continued to import much smaller volumes of crude oil from the United Kingdom than before crude oil from Russia was discounted.
