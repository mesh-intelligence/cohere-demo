text: The next largest increases in China’s crude oil imports came from Iran, Brazil, and the United States. Customs data indicate that China imported 54% more crude oil (1.1 million b/d) from Malaysia in 2023 than in 2022. However, crude oil imports from Malaysia exceeded Malaysia’s total crude oil production. Industry analysts believe that much of the oil shipped from Iran to China was relabeled as originating from countries such as Malaysia, the United Arab Emirates, and Oman to avoid U.S. sanctions against countries engaging in petroleum transactions with Iran. In 2023, China increased crude oil imports from Brazil by 52%, from 498,000 b/d to 755,000 b/d, and from the United States by 81%, from 158,000 b/d to 286,000 b/d.
