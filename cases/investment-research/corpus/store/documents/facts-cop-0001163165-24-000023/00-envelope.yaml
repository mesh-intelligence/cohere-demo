    text: |-
      ConocoPhillips (COP) reported the following values in its Form 10-Q filed 2024-05-02 for fiscal 2024 Q1.

      Reported revenue was $13.85 billion for the period 2024-01-01 to 2024-03-31.

      Reported net income was $2.55 billion for the period 2024-01-01 to 2024-03-31.

      Reported operating cash flow was $4.99 billion for the period 2024-01-01 to 2024-03-31.

      Reported total assets was $95.35 billion as of 2024-03-31.

      Reported cash and cash equivalents was $5.57 billion as of 2024-03-31.
