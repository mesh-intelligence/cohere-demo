    text: |-
      Velmora Energy's operations team reports drilled-and-completed costs per lateral foot down several percent from last year, mostly from simultaneous fracturing and fewer days per well. They attribute little of the gain to service-cost deflation.

      If the gains come from design and not from prices, they should persist even if service costs rise. That is the distinction to test against reported capital expenditure across the sector.
