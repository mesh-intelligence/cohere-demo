      Sablecrest Midstream expects new long-haul pipeline capacity to reduce the frequency of negative Waha prices late in the year. Velmora Energy, a customer, is more cautious, and notes that associated gas growth has a habit of filling new pipes faster than planned.

      Both views can be right. A memo should separate the near-term relief at Waha from the longer question of how quickly associated gas grows into the new capacity.
