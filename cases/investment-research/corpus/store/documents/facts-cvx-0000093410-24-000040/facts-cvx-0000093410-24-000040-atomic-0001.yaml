text: |-
  Chevron Corporation (CVX) reported the following values in its Form 10-Q filed 2024-08-07 for fiscal 2024 Q2.

  Reported revenue was $51.18 billion for the period 2024-04-01 to 2024-06-30.

  Reported net income was $4.43 billion for the period 2024-04-01 to 2024-06-30.

  Reported operating cash flow was $13.12 billion for the period 2024-01-01 to 2024-06-30.

  Reported capital expenditure was $8.05 billion for the period 2024-01-01 to 2024-06-30.

  Reported total assets was $260.64 billion as of 2024-06-30.

  Reported cash and cash equivalents was $4.01 billion as of 2024-06-30.
