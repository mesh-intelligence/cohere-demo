text: |-
  Although several electrolyzer projects are planned in the United States, traditional SMR technology produces most of the hydrogen commercially consumed in the United States today.

  The SMR process applies high-temperature steam to methane and a catalyst to produce hydrogen, carbon monoxide, and carbon dioxide. Industrial facilities and petroleum refineries primarily use natural gas as the source of methane for hydrogen production. SMR units can be fitted with carbon capture and storage (CCS) capabilities to reduce the carbon footprint of hydrogen production by storing carbon dioxide (CO 2) underground. This technology is not new; since 2013, the Coffeyville Resources Nitrogen Fertilizers plant in Oklahoma has been capturing CO 2 created by hydrogen production and delivering it for enhanced oil recovery.

  For more information on hydrogen, please visit our Energy Explained page on hydrogen.
