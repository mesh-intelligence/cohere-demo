text: |-
  We are currently developing a new hydrogen supply model and adjusting consumption models to better incorporate hydrogen projections in our Annual Energy Outlook for 2025. We will host a working group discussion with stakeholders on June 12, 2024.

  Electrolyzers versus Steam Methane Reforming (SMR) Electrolyzers produce hydrogen through electrolysis, a process that separates hydrogen from water using an electrical current, with oxygen as the only byproduct. Because SMRs use hydrocarbons as feedstock, their byproducts include carbon monoxide and carbon dioxide, which must be captured and sequestered to achieve net-zero emissions. Hydrogen produced by electrolyzers is considered carbon-neutral if the electricity consumed is generated from renewable resources.
