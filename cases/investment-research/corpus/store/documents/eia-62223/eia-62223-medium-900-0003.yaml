text_sha256: 4253d04ed92ca00d94b70accf8832f5a1b1025e632738703e92b7c758519979d
text: Hydrogen is a critical input for petroleum refining and fertilizer production, and it can also be used as a storable fuel for electric power generation to be used in hydrogen gas turbines or blended with natural gas for use in traditional gas turbines. It is the simplest element found naturally on earth and is traditionally separated out of hydrocarbons, such as natural gas and coal, through a process known as steam methane reforming (SMR). The 10 MMmt of hydrogen produced annually in the United States is almost completely supplied by SMRs or produced as byproduct hydrogen obtained from a chemical plant or other facility where hydrogen is not the main product. Using our Manufacturing Energy Consumption Survey 2018 —the most recent year for which we have data—and our Annual Refinery Capacity Report, we estimate current U.S. SMR capacity totals 7.6 MMmt of hydrogen a year.
