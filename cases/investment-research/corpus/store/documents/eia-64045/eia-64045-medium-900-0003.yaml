text: Category 3–5 hurricanes Hurricanes Milton and Helene, major hurricanes (Category 3, 4, or 5) that made landfall on Florida’s Gulf Coast on September 26 and October 9, respectively, caused major power outages and damage to electricity infrastructure on their paths through Florida to the Appalachian Mountains in states such as Georgia, South Carolina, North Carolina, Tennessee, and Virginia, as well as disruptions to petroleum product supply chains in Florida.
