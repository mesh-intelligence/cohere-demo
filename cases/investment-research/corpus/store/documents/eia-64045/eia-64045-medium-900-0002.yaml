text: The National Oceanic Atmospheric Association (NOAA) reported 18 named storms in 2024 (winds of 39 miles per hour [mph] or greater). Eleven of those storms had wind speeds of 74 mph or more, classifying them as hurricanes, and five of those intensified to major hurricanes (winds of 111 mph or greater). Five hurricanes made landfall in the continental United States (Beryl, Debby, Francine, Helene, and Milton), with two storms (Helene and Milton) making landfall as major hurricanes. An average hurricane season has 14 named storms, 7 hurricanes, and 3 major hurricanes, according to NOAA.
