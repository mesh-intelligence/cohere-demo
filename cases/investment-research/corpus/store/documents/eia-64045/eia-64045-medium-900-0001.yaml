text: The 2024 Atlantic hurricane season, which ran from June 1 through November 30, exhibited above-average activity with more named storms and hurricanes than usual, including several that disrupted U.S. energy infrastructure, primarily on the Gulf Coast and in the Southeast. Energy impacts from hurricanes this season were most notable in electricity markets, although Hurricanes Francine, Helene, and Rafael forced some oil and natural gas production from fields in the Gulf of Mexico to be shut in.
