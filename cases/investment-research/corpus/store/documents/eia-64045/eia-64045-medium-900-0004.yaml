text: Category 1–2 hurricanes Three other named storms (Beryl, Debby, and Francine) made landfall in the United States earlier in the hurricane season as either Category 1 or 2 hurricanes. Hurricane Beryl became the earliest Atlantic Basin Category 5 hurricane on record on July 1, before weakening to a Category 1 hurricane and making landfall on the Texas Gulf Coast, a major hub for the U.S. energy industry, on July 8. Due to the weakening, Hurricane Beryl resulted in minimal effects on the U.S. Gulf Coast oil and natural gas industry. Hurricane Debby, which made landfall on August 5 in the Big Bend area of western Florida, also had minimal effects on the U.S. Gulf Coast oil and natural gas industry.
