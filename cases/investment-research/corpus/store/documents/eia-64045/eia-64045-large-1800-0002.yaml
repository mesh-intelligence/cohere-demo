text: |-
  Category 1–2 hurricanes Three other named storms (Beryl, Debby, and Francine) made landfall in the United States earlier in the hurricane season as either Category 1 or 2 hurricanes. Hurricane Beryl became the earliest Atlantic Basin Category 5 hurricane on record on July 1, before weakening to a Category 1 hurricane and making landfall on the Texas Gulf Coast, a major hub for the U.S. energy industry, on July 8. Due to the weakening, Hurricane Beryl resulted in minimal effects on the U.S. Gulf Coast oil and natural gas industry. Hurricane Debby, which made landfall on August 5 in the Big Bend area of western Florida, also had minimal effects on the U.S. Gulf Coast oil and natural gas industry.

  Impacts on the oil and natural gas industry The paths of the major hurricanes, Milton and Helene, took them away from the most prolific oil- and natural gas-producing areas near Texas, Louisiana, and Mississippi, but oil and natural gas companies evacuated some platforms and shut in some production from fields in the Gulf of Mexico as a precautionary measure. Hurricane Rafael in November weakened significantly before reaching the U.S. oil and natural gas production hub in the Gulf of Mexico, allowing offshore producers to quickly return to normal operations.
