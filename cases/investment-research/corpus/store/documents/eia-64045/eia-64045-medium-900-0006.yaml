text: We estimate that unplanned outages of crude oil production in the U.S. Gulf of Mexico due to storms averaged 295,000 barrels per day (b/d) in September and 110,000 b/d in November, accounting for 16% and 5%, respectively, of total crude oil production from federal Gulf of Mexico waters in those months. Unplanned outages of natural gas production in the Gulf of Mexico due to storms averaged 0.20 billion cubic feet per day (Bcf/d) in September and 0.07 Bcf/d in November, accounting for 11% and 3%, respectively, of total natural gas production from federal Gulf of Mexico waters in those months. We did not register any widespread storm-related outages in October.
