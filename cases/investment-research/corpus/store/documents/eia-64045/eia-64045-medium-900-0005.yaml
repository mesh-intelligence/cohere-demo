text: Impacts on the oil and natural gas industry The paths of the major hurricanes, Milton and Helene, took them away from the most prolific oil- and natural gas-producing areas near Texas, Louisiana, and Mississippi, but oil and natural gas companies evacuated some platforms and shut in some production from fields in the Gulf of Mexico as a precautionary measure. Hurricane Rafael in November weakened significantly before reaching the U.S. oil and natural gas production hub in the Gulf of Mexico, allowing offshore producers to quickly return to normal operations.
