text: |-
  Quillon Basin Resources is reviewing whether to defer completions on its gas-directed wells while Henry Hub trades near recent lows. A field contact says crews remain under contract through the second quarter, so any deferral would come with a standby cost.

  We treat this as an early signal rather than a decision. The company has not said so publicly, and its associated gas volumes would keep flowing regardless of what it does with dry gas wells.
