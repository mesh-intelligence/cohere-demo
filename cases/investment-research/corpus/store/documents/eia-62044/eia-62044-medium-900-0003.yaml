text: In February 2023, a coalition of G7 countries, the EU, and Australia prohibited the brokering, financing, shipping, and insuring of petroleum products of Russian origin by maritime vessels under their jurisdiction and set a price cap on premium-to-crude petroleum products, such as diesel, for other importing countries. According to data from the Centre for Research on Energy and Clean Air, the percentage of Russia’s oil product shipments owned or insured by EU or G7 countries declined from an estimated 80% in 2022 to 58% in 2023 because of the prohibition. In addition, Russia’s export revenues for oil products and other chemicals declined 14%, from $104 billion to $89 billion.
