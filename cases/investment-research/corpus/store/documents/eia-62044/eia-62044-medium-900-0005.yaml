text: Sustained price caps resulting in increased export demand to countries not imposing the sanctions and refinery outages in early 2024 have reduced diesel and gasoline supply to Russia’s domestic market, which has led to increased domestic fuel prices and periodic fuel export bans in Russia. Monthly refinery runs began declining in January 2024 because of refinery outages from reported drone strikes and sanctions. An estimated 14% of Russia’s refining capacity came offline in the first quarter of 2024, even though declines do not usually occur until spring seasonal maintenance.
