text_sha256: 70d49948a8a7a9f3690ffa2acee9bf1debc644091ab6c29c96379e1b949ff75f
text: Diesel made up 40% of Russia’s seaborne petroleum products exports in 2023, increasing 8% from 0.9 million barrels per day (b/d) in 2022 to 1.0 million b/d in 2023. Brazil received 13% (136,000 b/d) of these exports in 2023, and Saudi Arabia received 6% (61,000 b/d), increasing each country’s shares from less than 1% in 2022. Türkiye, a non-EU member, received 13% (122,000 b/d) in 2022 and 31% (315,000 b/d) in 2023, and four countries in Africa—Libya, Tunisia, Morocco, and Ghana—each increased annual seaborne diesel imports from Russia by more than 20,000 b/d. By comparison, the rest of Europe, excluding Türkiye, received 67% (626,000 b/d) of Russia’s seaborne diesel exports in 2022 and 5% (53,000 b/d) in 2023.
