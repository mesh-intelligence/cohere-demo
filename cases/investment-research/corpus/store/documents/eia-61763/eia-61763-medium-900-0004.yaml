text: Based on data from MECS and our Petroleum Supply Annual (PSA), total U.S. production of hydrogen in 2018 was 10 million metric tons, of which 40% was merchant hydrogen sold by industrial gas companies. About two-thirds was sourced from the steam methane reformer (SMR) process, which mainly uses natural gas as a feedstock. The remaining one-third of hydrogen production came as a byproduct of other chemical processes. A small but growing amount of hydrogen is also produced from electrolysis of water—a process that separates water molecules into hydrogen and oxygen.
