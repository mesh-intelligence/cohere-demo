text: The highest U.S. natural gas prices in 2023 were in the Pacific states of California, Oregon, and Washington where the price of natural gas charged to power generators averaged $6.96/MMBtu through October. As a consequence, the Pacific Northwest had the highest U.S. wholesale electricity prices as well, averaging $82 per megawatthour (MWh) last year. We expect fuel costs to remain somewhat elevated in the Pacific Northwest, and we forecast the region's wholesale power prices to average $67/MWh in 2024.
