text: U.S. wholesale power prices are typically calculated on an hourly or daily basis and are designed to reflect market conditions at a specific time. Market stresses, such as extremely high temperatures or temporary supply constraints, can lead to spikes in wholesale prices. For example, wholesale prices in the ERCOT market (which covers most of Texas) exceeded $2,500/MWh during a handful of hours in August 2023, which resulted in ERCOT's monthly price averaging $355/MWh. Prices also spiked temporarily in the western wholesale markets during summer 2023.
