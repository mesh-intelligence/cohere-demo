text: We expect U.S. electricity prices this year will be relatively similar to 2023 in many of the wholesale markets operating in the Eastern Interconnection, where forecast 2024 wholesale prices outside of the Northeast generally range between $30/MWh and $40/MWh. The wholesale markets in the Northeast, specifically New York and New England, generally have some of the highest wholesale prices in the nation after the Pacific Northwest. We expect the Northeast wholesale prices to increase in 2024, averaging $48/MWh in New York (up 26%) and $60/MWh in New England (up 45%).
