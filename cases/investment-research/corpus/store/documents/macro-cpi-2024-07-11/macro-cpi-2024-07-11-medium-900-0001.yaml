text: |-
  (NOTE: This news release was reissued on July 11, 2024. BLS inadvertently published an index value and related 1-month and 12-month percent changes for inpatient hospital services for June 2024 that did not meet publication criteria. These data have been removed from tables 2, 6, and 7 of the news release. These data were not published in the database.)

  The Consumer Price Index for All Urban Consumers (CPI-U) declined 0.1 percent on a seasonally adjusted basis, after being unchanged in May, the U.S. Bureau of Labor Statistics reported today. Over the last 12 months, the all items index increased 3.0 percent before seasonal adjustment.
