text: The all items index rose 3.0 percent for the 12 months ending June, a smaller increase than the 3.3-percent increase for the 12 months ending May. The all items less food and energy index rose 3.3 percent over the last 12 months and was the smallest 12-month increase in that index since April 2021. The energy index increased 1.0 percent for the 12 months ending June. The food index increased 2.2 percent over the last year.
