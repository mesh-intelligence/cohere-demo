    text: |-
      ConocoPhillips (COP) reported the following values in its Form 10-K filed 2024-02-15 for fiscal 2023 FY.

      Reported revenue was $56.14 billion for the period 2023-01-01 to 2023-12-31.

      Reported net income was $10.96 billion for the period 2023-01-01 to 2023-12-31.

      Reported operating cash flow was $19.96 billion for the period 2023-01-01 to 2023-12-31.

      Reported total assets was $95.92 billion as of 2023-12-31.

      Reported cash and cash equivalents was $5.63 billion as of 2023-12-31.
