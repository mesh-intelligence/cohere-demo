    text: |-
      Chevron Corporation (CVX) reported the following values in its Form 10-Q filed 2024-05-02 for fiscal 2024 Q1.

      Reported revenue was $48.72 billion for the period 2024-01-01 to 2024-03-31.

      Reported net income was $5.50 billion for the period 2024-01-01 to 2024-03-31.

      Reported operating cash flow was $6.83 billion for the period 2024-01-01 to 2024-03-31.

      Reported capital expenditure was $4.09 billion for the period 2024-01-01 to 2024-03-31.

      Reported total assets was $261.65 billion as of 2024-03-31.

      Reported cash and cash equivalents was $6.28 billion as of 2024-03-31.
