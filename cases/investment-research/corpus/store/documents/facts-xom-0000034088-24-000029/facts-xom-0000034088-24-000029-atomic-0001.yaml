text: |-
  Exxon Mobil Corporation (XOM) reported the following values in its Form 10-Q filed 2024-04-29 for fiscal 2024 Q1.

  Reported revenue was $83.08 billion for the period 2024-01-01 to 2024-03-31.

  Reported net income was $8.22 billion for the period 2024-01-01 to 2024-03-31.

  Reported operating cash flow was $14.66 billion for the period 2024-01-01 to 2024-03-31.

  Reported capital expenditure was $5.07 billion for the period 2024-01-01 to 2024-03-31.

  Reported total assets was $377.92 billion as of 2024-03-31.

  Reported cash and cash equivalents was $33.32 billion as of 2024-03-31.
