text: |-
  Tessarine Petroleum moved to the restricted list this week after our capital markets group began work on a potential senior notes offering. Published research on the name is suspended until the group confirms the matter has closed.

  Analysts on the energy team should not discuss capital spending or leverage at Tessarine with investing clients while the restriction stands.
