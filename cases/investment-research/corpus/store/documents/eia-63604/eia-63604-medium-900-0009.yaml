text: Canada and Mexico do not impose tariffs on exports of U.S. ethane-derived chemicals because of reciprocal free-trade agreements. These countries also benefit from proximity and being able to import these products over land at lower cost compared with waterborne imports. However, exports to overseas destinations have also grown since 2017, with the exception of 2021 when the global pandemic led to lower demand.
