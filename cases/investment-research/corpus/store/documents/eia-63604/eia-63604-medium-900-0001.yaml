text: |-
  Updated December 11, 2024 to correct units of measure in charts.

  U.S. exports of ethane and ethane-based petrochemicals reached an all-time high of 21.6 million metric tons (MMmt) in 2023, up 134% since the United States began exporting ethane in 2014 and 17% more than in 2022, according to data from the U.S. Census Bureau. The rapid expansion of U.S. ethane and ethane-based petrochemical exports has been fueled by the growth in domestic ethane production, which has increased with the country’s natural gas production and the buildout of export and production infrastructure.
