text: |-
  U.S. ethane exports increased to a record high of 2.9 MMmt in 2023, up 12% from 2022. In 2023, U.S. ethane was mostly exported to China, which accounted for 45% (1.4 MMmt) of U.S. ethane exports, followed by India (16%), Canada (14%), Norway (9%), and the United Kingdom (7%).

  U.S. ethane exports to China increased fastest between 2022 and 2023, rising 35% last year. China’s Satellite Petrochemical has begun ethylene production at two new ethane crackers since 2021, which has increased domestic ethane demand in China. Ethane exports to Norway rose the second fastest, rising 32% to 280,000 metric tons in 2023. Other importers of U.S. ethane include Belgium, Brazil, Canada, Mexico, and Sweden.
