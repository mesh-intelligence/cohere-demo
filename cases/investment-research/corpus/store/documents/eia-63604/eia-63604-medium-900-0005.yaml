text_sha256: 0287966423b0b5c27ecd25eefcf6344629957007a332c9a8d1d12c589eceea92
text: Ethane’s high ethylene yields and cost advantages over naphtha in ethylene production have driven export volumes of ethane higher since 2014. Most petrochemical crackers have some flexibility in switching between ethane and naphtha as a feedstock, depending on the relative profitability of each feedstock. In the United States, cracking ethane to produce ethylene has historically generated higher profit margins compared with the margins from cracking naphtha, the most common feedstock in Western Europe and East Asia. Global petrochemical manufacturers looking to secure low-cost ethane feedstock to produce ethylene are developing new petrochemical crackers and associated infrastructure.
