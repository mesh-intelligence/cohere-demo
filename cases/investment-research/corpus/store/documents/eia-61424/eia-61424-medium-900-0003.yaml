text: Texas, with an expected 6.4 GW, and California, with an expected 5.2 GW, will account for 82% of the new U.S. battery storage capacity. Developers have scheduled the Menifee Power Bank (460.0 MW) at the site of the former Inland Empire Energy Center natural gas-fired power plant in Riverside, California, to come on line in 2024. With the rise of solar and wind capacity in the United States, the demand for battery storage continues to increase. The Inflation Reduction Act (IRA) has also accelerated the development of energy storage by introducing investment tax credits (ITCs) for stand-alone storage. Prior to the IRA, batteries qualified for federal tax credits only if they were co-located with solar.
