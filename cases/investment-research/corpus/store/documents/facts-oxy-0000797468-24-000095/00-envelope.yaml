    text: |-
      Occidental Petroleum Corporation (OXY) reported the following values in its Form 10-Q filed 2024-05-07 for fiscal 2024 Q1.

      Reported revenue was $5.97 billion for the period 2024-01-01 to 2024-03-31.

      Reported net income was $888.0 million for the period 2024-01-01 to 2024-03-31.

      Reported operating cash flow was $2.01 billion for the period 2024-01-01 to 2024-03-31.

      Reported capital expenditure was $1.78 billion for the period 2024-01-01 to 2024-03-31.

      Reported total assets was $74.28 billion as of 2024-03-31.

      Reported cash and cash equivalents was $1.27 billion as of 2024-03-31.
