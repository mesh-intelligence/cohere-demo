text_sha256: ccefb83236c2d154b0ca2b269d0022280133fdbfaf0cf66a54e76554a2272d56
text: The number of new wells added every year in the United States has fluctuated over the past decade. Although the number of new wells notably peaked at 13,745 in 2014, subsequent activity dipped before showing signs of returning in June 2016. The number of new wells fell by nearly 40% (4,829 wells) in 2020 to 7,147 because of the economic impact of the COVID-19 pandemic. Since then, the number of new crude oil wells has increased in every year at a slower pace compared with pre-pandemic rates. In 2022, the number of new crude oil wells was the same as in 2017. In the first half of 2023, drillers increased the number of new wells by 12% (624 wells) compared with the same period in 2022. This growth in the number of new wells indicates that growth in production is supported increasingly by increased productivity despite fewer operating drilling rigs compared with the past.
