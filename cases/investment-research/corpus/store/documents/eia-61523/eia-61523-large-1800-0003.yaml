text: In our February Short-Term Energy Outlook, we forecast a dip in production in early 2024 because winter weather caused some operators to shut in production. We forecast production will continue to decline through the second and third quarters of 2024. We forecast crude oil production to climb again in 2025, and we expect it to exceed the November 2023 peak in February 2025.
