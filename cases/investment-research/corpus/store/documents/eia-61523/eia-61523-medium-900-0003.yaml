text: The rig count is the number of active oil rigs in the United States as published by Baker Hughes. Traditionally, the number of active oil-directed rigs is a leading indicator of future crude oil production because more active rigs can drill more new wells. Recently, U.S. crude oil production has increased because of technological advancements and efficiency gains despite a 69% decrease in the number of active rigs since 2014.
