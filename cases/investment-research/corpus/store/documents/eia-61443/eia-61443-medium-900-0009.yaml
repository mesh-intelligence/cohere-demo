text: As more booking slots opened in January, the number of vessels transiting the Panama Canal increased, and VLGC rates from Houston to Chiba dropped to $86 per metric ton. Benchmark VLGC rates for the U.S. Gulf Coast to Chiba, Japan, (East Asia) route reached a record high at the end of September 2023. VLGC rates on this route reached $250 per metric ton for the week ending September 29, the highest since rates were first published in 2016. By the last week of December, rates were $222 per metric ton. VLGC rates have reached record highs because of the delays at the Panama Canal and the longer distances traveled for the vessels that opted to travel on alternative routes. Further distances incur higher fuel costs.
