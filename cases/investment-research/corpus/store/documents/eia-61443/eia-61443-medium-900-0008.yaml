text: In January 2024, LPG volumes decreased through the Suez Canal by 84% and around the Cape of Good Hope by 44% compared with December 2023. Shipments through the Suez Canal decreased more than shipments around the more risk-averse Cape of Good Hope. In contrast, LPG volumes increased in the Panama Canal in January. But in the Suez Canal, January U.S. ethane export volumes stopped because all shipments that regularly transited through the Suez Canal from the United States to India decided to use the longer Cape of Good Hope route.
