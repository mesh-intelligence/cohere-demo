text: The Panama Canal offers daily booking slots that can be booked ahead of time depending on the type of vessel, with some reserved slots auctioned for a fee, used mostly by Very Large Gas Carriers (VLGCs). Auctioned slots currently have a base rate of $100,000 and are useful for short-term, spot cargos. Following an increase in water levels in November and December, the Panama Canal Authority opened more booking slots mid-December 2023 and allowed more transits and volumes to go through in January 2024 than previously planned.
