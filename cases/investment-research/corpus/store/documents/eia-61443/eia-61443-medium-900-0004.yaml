text: LPG includes propane, normal butane, and isobutane. In November and December 2023, 23% less U.S. LPG flowed through the Panama Canal than on average from January to October 2023. U.S. ethane flows through the Panama Canal were 73% lower. LPG and ethane together account for 63% of the U.S. petroleum product exports that cross the Panama Canal. Refined petroleum products such as gasoline, diesel, and naphtha account for most of the other petroleum products, but transit volumes for these fuels have not changed overall.
