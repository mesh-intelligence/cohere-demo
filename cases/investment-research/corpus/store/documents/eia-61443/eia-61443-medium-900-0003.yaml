text_sha256: 35151b16f358acfdd1d88194df7f83bf15bb47133505dc274af567b441c1882a
text: At the end of July 2023, only 32 daily booking slots were made available to transit the Panama Canal, down from the normal 36. Daily booking slots were further reduced to 24 for most of November, while 22 slots per day were reserved in December and 20 slots per day in January. Although transits were scheduled to decrease to 18 per day in February, the Panama Canal Authority issued an advisory in mid-December that increased January’s transits to 24 per day. Transit slots that opened up in January allowed more VLGC voyages through the Panama Canal, increasing January 2024 LPG transit volumes by 12% and ethane transit volumes by 67% compared with December 2023.
