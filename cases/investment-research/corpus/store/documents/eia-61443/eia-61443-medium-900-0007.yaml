text: A journey from the United States to Asia through the Suez Canal requires navigating the Red Sea and then the Bab el-Mandeb Strait. In mid-November, attacks on vessels by Yemen-based Houthi rebels decreased transit volumes through the Bab el-Mandeb in December and increased transit volumes around the Cape of Good Hope. In late-November and in December, shipments of U.S. LPG rose 135% around the Cape of Good Hope. Ethane tankers, which are almost exclusively VLECs en route to Asia, also shifted to routes around the Cape of Good Hope. One China-bound VLEC from the United States per month starting in August took the longer route, according to vessel tracking data. In November, 87% less U.S. ethane moved through the Suez Canal compared with monthly averages earlier in the year, a route that makes regular export runs to India.
