text_sha256: 2f0a9ac3a57750c94c66d396385c7b70f3eaf381b55156dc6c8cbd12bf0157e3
text: LPG typically travels on VLGCs, and ethane travels on Very Large Ethane Carriers (VLECs), which use the Neopanamax locks, a newer, larger set of locks in the Panama Canal. Similar to shipping LPG and ethane, the economics of shipping refined petroleum products—such as gasoline, diesel, and jet fuel—improve as the size of the ship and the distance traveled increase. Although VLGCs and VLECs travel mostly to countries in Asia, U.S. refined petroleum products typically travel shorter distances, mostly to the west coast of South America after transiting the Panama Canal. Smaller vessels are used for these shorter runs, and refined petroleum products mostly travel on Panamax-sized ships, which fit into the older, smaller Panamax locks.
