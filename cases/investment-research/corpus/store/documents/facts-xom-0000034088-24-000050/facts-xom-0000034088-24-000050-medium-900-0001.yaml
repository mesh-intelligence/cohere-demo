  Exxon Mobil Corporation (XOM) reported the following values in its Form 10-Q filed 2024-08-05 for fiscal 2024 Q2.

  Reported revenue was $93.06 billion for the period 2024-04-01 to 2024-06-30.

  Reported net income was $9.24 billion for the period 2024-04-01 to 2024-06-30.

  Reported operating cash flow was $25.22 billion for the period 2024-01-01 to 2024-06-30.

  Reported capital expenditure was $11.31 billion for the period 2024-01-01 to 2024-06-30.

  Reported total assets was $460.71 billion as of 2024-06-30.

  Reported cash and cash equivalents was $26.46 billion as of 2024-06-30.
