text: Battery storage. We also expect battery storage to set a record for annual capacity additions in 2024. We expect U.S. battery storage capacity to nearly double in 2024 as developers report plans to add 14.3 GW of battery storage to the existing 15.5 GW this year. In 2023, 6.4 GW of new battery storage capacity was added to the U.S. grid, a 70% annual increase.
