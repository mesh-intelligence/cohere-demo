text: Refinery margins have fallen in part because of relatively weak demand for petroleum products, particularly distillate fuel oil. In 2024, U.S. product supplied of distillate fuel oil (the proxy we use for consumption) averaged 6% less than in 2023 and 8% than in 2019 from June through September, mostly due to declining manufacturing activity and the increasing use of biofuels in place of conventional, petroleum-based diesel fuels on the West Coast. Gasoline and jet fuel consumption were slightly below 2023 levels for the same months, and they both remain 6% below 2019 levels.
