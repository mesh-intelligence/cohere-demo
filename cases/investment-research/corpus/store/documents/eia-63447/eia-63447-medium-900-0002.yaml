text: The recent drop in refinery margins is a departure from the past two years. Following the lows in 2020, decreases in U.S. refinery capacity and recovering petroleum product demand supported stronger U.S. refinery margins. This trend was particularly true on the West Coast, where several refineries closed or converted operations to renewable diesel in response to its increasing use in the region.
