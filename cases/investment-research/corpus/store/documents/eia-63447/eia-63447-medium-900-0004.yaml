text: Outside of the United States, petroleum product demand has been weak due to slowing economic activity in China and Europe. In addition, increasing adoption of electric vehicles, biofuels, and liquefied natural gas use in trucking is steadily reducing petroleum fuel consumption across much of Asia and Europe. Refinery margins have also been under pressure due to new refining capacity abroad. Kuwait’s 615,000-barrel-per-day (b/d) Al-Zour refinery reached full refining capacity early in 2024, Oman’s 230,000-b/d Duqm refinery has begun operations, and Nigeria’s 650,000-b/d Dangote refinery has been ramping up refining activity. In response to low refinery margins, some global refiners have reduced refinery runs, and some in Europe have announced plans to close or reduce capacity.
