text: The LNG volumes contracted in 2023 are relatively evenly split between offtake companies based in Europe and those based in Asia, indicating the likely destination for those cargoes. However, destination flexibility is a common feature of most of the SPAs, where the buyer can deliver LNG to any destination as long as it complies with DOE export authorizations and U.S. law.
