text_sha256: b2a2e0df301ae9c7b634c48edc0348890d4060a468e83a9c0a4206a76eb60d04
text: The terms in the SPAs signed last year were typical of many long-term U.S. LNG export agreements. About three-quarters of the volumes in the 2023 SPAs had a contract duration of 20 years, beginning when the project starts commercial operations; the earliest start date would be the third quarter of 2024. Moreover, about 94% of the volumes in the SPAs were sold on a free-on-board (FOB) basis, which means the buyer takes ownership of the LNG at the loading terminal and pays for the product at that delivery point. More than one-half of the 2023 SPAs are indexed to the U.S. benchmark Henry Hub natural gas price compared with about two-thirds of the SPAs signed in 2022. The volumes in the remaining 2023 SPAs would be using a different pricing mechanism, such as indexing to an oil benchmark price or another natural gas benchmark price.
