text: |-
  Chevron Corporation (CVX) reported the following values in its Form 10-Q filed 2024-11-07 for fiscal 2024 Q3.

  Reported revenue was $50.67 billion for the period 2024-07-01 to 2024-09-30.

  Reported net income was $4.49 billion for the period 2024-07-01 to 2024-09-30.

  Reported operating cash flow was $22.80 billion for the period 2024-01-01 to 2024-09-30.

  Reported capital expenditure was $12.11 billion for the period 2024-01-01 to 2024-09-30.

  Reported total assets was $259.23 billion as of 2024-09-30.
