text: |-
  Quillon Basin Resources is on the restricted list while our lending group works on an amendment to its reserve-based credit facility. The borrowing base review uses a price deck below the current strip for natural gas.

  Analysts covering the name should treat its liquidity discussion as restricted, and should not use the borrowing-base inputs in any sector work.
