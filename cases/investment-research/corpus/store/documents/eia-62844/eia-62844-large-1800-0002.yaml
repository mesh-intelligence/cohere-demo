text: Mexico’s Energia Costa Azul LNG terminal on the west coast is also currently under construction; it has an export capacity of 0.4 Bcf/d for Phase 1 and an additional 1.6 Bcf/d for Phase 2 (proposed). Developers proposed other LNG export projects for Mexico’s west coast, including Saguaro Energia LNG (2.0 Bcf/d capacity), Amigo LNG (1.0 Bcf/d capacity), Gato Negro LNG (0.6 Bcf/d capacity), Salina Cruz LNG (0.4 Bcf/d capacity), and Vista Pacifico LNG (0.5 Bcf/d capacity), with a combined export capacity of nearly 4.5 Bcf/d.
