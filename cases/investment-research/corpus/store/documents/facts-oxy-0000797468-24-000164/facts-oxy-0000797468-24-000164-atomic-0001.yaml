text: |-
  Occidental Petroleum Corporation (OXY) reported the following values in its Form 10-Q filed 2024-11-12 for fiscal 2024 Q3.

  Reported revenue was $7.17 billion for the period 2024-07-01 to 2024-09-30.

  Reported operating cash flow was $8.08 billion for the period 2024-01-01 to 2024-09-30.

  Reported capital expenditure was $5.24 billion for the period 2024-01-01 to 2024-09-30.

  Reported total assets was $85.80 billion as of 2024-09-30.

  Reported cash and cash equivalents was $1.76 billion as of 2024-09-30.
