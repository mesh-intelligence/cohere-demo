    text: |-
      Sablecrest Midstream's commercial team expects Permian residue gas takeaway to stay tight until new long-haul capacity enters service. They report that their own gathering system ran near capacity through the winter, with shippers asking about firm volumes further out than usual.

      If that holds, negative Waha pricing remains a recurring feature for producers without firm transport, and it favors operators who locked in capacity early.
