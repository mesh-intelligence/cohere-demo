      Ardenfall Gas Gathering reports that throughput held near last year's level even with Appalachian producers curtailing some volumes in the spring. Minimum volume commitments cushion its revenue, but producers are asking about shorter terms on new dedications.

      Shorter contract terms would matter more than current throughput for gatherers in the region if low prices persist.
