text: After averaging just under $6.50/MMBtu in 2022, the Henry Hub price declined to $3.27/MMBtu in January 2023, driven by warmer-than-average weather and reduced natural gas consumption in most of the United States. The Henry Hub price remained relatively low for all of 2023 because of strong natural gas production and more natural gas in storage.
