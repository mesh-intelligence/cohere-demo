text_sha256: 4a9acd91354988f86e50ee258bd4c4765e0eca224358cd6ab49fa12e258a814e
text: We expect the U.S. benchmark natural gas spot price at the Henry Hub to average under $3.00 per million British thermal units (MMBtu) in 2024 and 2025 in our January Short-Term Energy Outlook (STEO). The annual average Henry Hub prices in 2024 and 2025 increase from 2023 in our forecast because we expect natural gas demand growth to outpace natural gas supply growth. Despite increased demand, our forecast prices for 2024 and 2025 are less than half the annual average price in 2022 and are only slightly higher than the $2.54/MMBtu we reported for 2023.
