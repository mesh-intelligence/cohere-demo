text: We expect these drivers of low prices to continue over the next two years, as U.S. natural gas production remains relatively flat but grows enough to set new record highs. In our January STEO, U.S. dry natural gas production increases 1.5 billion cubic feet per day (Bcf/d) in 2024 from record highs in 2023 to average 105.0 Bcf/d. We forecast dry natural gas production increases again in 2025 by 1.3 Bcf/d to average 106.4 Bcf/d. Working natural gas inventories were above the previous five-year (2018–22) average for all of 2023, and we expect inventories will remain above the five-year average in 2024 and 2025 because of continued increases in natural gas production.
