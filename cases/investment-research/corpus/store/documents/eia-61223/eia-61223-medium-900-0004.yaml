text: We also expect U.S. demand for natural gas—total natural gas consumption plus natural gas exports—to increase in 2024 and 2025, driven by growth in liquefied natural gas (LNG) exports, which we forecast to increase by 4% (0.5 Bcf/d) in 2024 and 17% (2.1 Bcf/d) in 2025. Consumption of natural gas in 2024 increases in the residential sector by 4% (0.5 Bcf/d) and in the commercial sector by 3% (0.3 Bcf/d) because we expect colder winter weather than in 2023. Last year started and ended with warmer-than-average temperatures.
