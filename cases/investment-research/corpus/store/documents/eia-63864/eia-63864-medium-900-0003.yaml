text: Net injections into natural gas storage during the injection season totaled 1,640 Bcf, 21% less than the five-year average. Weekly injections ranged from a maximum of 96 Bcf in late May to 10 Bcf in mid-July. Although natural gas is typically injected into storage in the summer, withdrawals occasionally occur, particularly in the Pacific and South Central regions. The U.S. South Central region has exhibited a unique seasonal pattern in recent years with weekly net natural gas withdrawals following early summer injections, particularly at the salt dome facilities, to meet summer cooling demand. For the week ending August 9, withdrawals in the South Central region and Pacific region combined totaled 29 Bcf, with a net withdrawal of 6 Bcf from U.S. natural gas storage, the first net withdrawal from U.S. storage during the summer since July 2016.
