text: Working natural gas in storage in the Lower 48 states ended the natural gas injection season with 3,922 billion cubic feet (Bcf), according to estimates based on data from our Weekly Natural Gas Storage Report released on November 7. U.S. inventories are starting winter 2024–25 with the most natural gas since 2016. Inventories are currently 6% above the five-year (2019–23) average, despite less-than-average injections into storage throughout the entire injection season, which runs April 1 through October 31. Less natural gas than the five-year average was injected in nearly every week during the 2024 injection season, in part because starting inventories were relatively full.
