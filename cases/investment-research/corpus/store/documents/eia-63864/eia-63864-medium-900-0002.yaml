text: Natural gas inventories in the Lower 48 states at the end of March 2024 (the end of withdrawal season) totaled 2,282 Bcf, 25% more than at the same time in 2023 and 40% more than the five-year average for March. This enabled storage operators to reach their end-of-season targets with smaller natural gas injections. Low natural gas prices in 2024 encouraged producers to curtail production, which also reduced natural gas available for injections.
