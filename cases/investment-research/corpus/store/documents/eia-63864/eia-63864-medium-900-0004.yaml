text: Natural gas injections into storage for the weeks ending October 25 and November 1 (the last two weeks of injection season) exceeded their five-year averages, further boosting the volume of natural gas in storage. In our November Short-Term Energy Outlook, we forecast natural gas withdrawals during the 2024–25 heating season will total 1,957 Bcf and that inventories will be 6% above the five-year (2020–24) average at the end of March 2025.
