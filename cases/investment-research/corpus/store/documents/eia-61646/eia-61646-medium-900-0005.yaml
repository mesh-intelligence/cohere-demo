text: Natural gas production costs depend on many factors, including the cost of drilling wells. The Haynesville formation is 10,500 feet to 13,500 feet deep, which is much deeper than other formations, such as the Marcellus in the Appalachia region, which is 4,000 to 8,500 feet deep. Because the deeper wells make drilling wells in the Haynesville more expensive than in the Marcellus and other shale plays, natural gas prices have to be relatively high to make drilling economical. The Henry Hub spot price averaged $2.54 per million British thermal units (MMBtu) in 2023 compared with $6.42/MMBtu in 2022.
