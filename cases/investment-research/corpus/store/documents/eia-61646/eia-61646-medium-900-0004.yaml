text_sha256: d4c1402383b4d2640dd3fbebd136ed7ef20ce851db88c4c4f12f27429737ab10
text: In 2023, the Haynesville region, in Louisiana and Texas, accounted for 13%, or 16.8 Bcf/d, of gross natural gas withdrawals, a 1.4 Bcf/d increase from 2022. In 2022, natural gas production in the Haynesville region had grown by 2.1 Bcf/d. Natural gas production growth in the Haynesville slowed in 2023 because low U.S. natural gas prices decreased rig activity in the region. Producers averaged 49 active rigs per month in the Haynesville in 2023, compared with 55 active rigs in 2022. The higher relative cost to produce natural gas in the Haynesville region played a role in reducing rig activity and subsequently slowing production growth in 2023.
