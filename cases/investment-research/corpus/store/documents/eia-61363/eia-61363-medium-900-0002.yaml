text: Ships transiting between Europe and Asia via the Suez Canal must pass through the Bab el-Mandeb Strait, which connects the Red Sea to the Gulf of Aden. The Bab el-Mandeb Strait is an important oil and natural gas chokepoint, accounting for 12% of seaborne oil trade and 8% of liquefied natural gas (LNG) trade in the first half of 2023. Major oil and natural gas companies that are avoiding the Red Sea include Equinor, which operates mostly natural gas carriers, and bp, which operates both oil and natural gas carriers. As of January 23, 2024, other major energy companies pausing Red Sea transits include Euronav, QatarEnergy, Torm, Shell, and Reliance.
