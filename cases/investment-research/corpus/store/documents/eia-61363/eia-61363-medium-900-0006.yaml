text: In December, 24% less LNG and 1% more liquefied petroleum gas (LPG) were traded globally compared with the rest of 2023. Vessel restrictions at the Panama Canal due to a drought are causing more VLGCs leaving from the United States to head east toward either the Suez Canal or the Cape of Good Hope. LPG flows through the Bab el-Mandeb increased by 59% in 2023 compared with 2022 because water conservation efforts at the Panama Canal began in January 2023, causing delays and higher costs for VLGCs. The Combined Maritime Forces, a partnership representing 39 nations, warned ships to avoid the Bab el-Mandeb Strait on January 12, which will likely reduce passages through January 2024.
