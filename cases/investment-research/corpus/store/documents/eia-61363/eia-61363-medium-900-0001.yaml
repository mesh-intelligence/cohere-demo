text: After Yemen-based Houthi militia attacks on commercial ships transiting the Red Sea started in November 2023, some vessels began opting to avoid the Bab el-Mandeb chokepoint—a narrow strait that borders the Yemeni coast and is the southern entrance to the Red Sea. Instead, they’re choosing to take longer, more costly routes around the tip of Africa.
