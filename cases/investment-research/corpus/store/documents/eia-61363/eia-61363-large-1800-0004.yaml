text: Clean petroleum product tanker rates for routes that cross the Bab el-Mandeb Strait and Suez Canal increased in December 2023 because of the ongoing conflict in the Red Sea. Because routes going through the Red Sea have elevated risk insurance premiums, these costs are passed on to tanker rates. For the four tanker rates that pass through the Red Sea, the average increase was 20% in December compared with November, according to Argus Freight. Long-range 1 tankers traveling from the western coast of India to the UK Continent increased the most (23%), and tankers traveling from the Mideast Gulf to the UK Continent increased the least (16%). Rates for dirty tankers, which mostly transport crude oil, have been relatively unchanged from the elevated prices in November. Brent crude oil spot prices for the week ending November 17, 2023, the week before attacks on ships in the Red Sea began, were $82 per barrel (b). Since then, prices have traded in range, and they closed at $79/b as of January 18, 2024.
