text: Vessels that do not pass through the Suez Canal via the Bab el-Mandeb Strait and Red Sea can go around southern Africa via the Cape of Good Hope, but that route can add significant time to the voyage, depending on the ship’s origin and its destination. A typical voyage from the Persian Gulf to the Amsterdam-Rotterdam-Antwerp petroleum trading hub (ARA) via the Suez Canal takes 19 days. If the ship takes the Cape of Good Hope route, it takes nearly 35 days to reach the ARA. For products leaving the U.S. Gulf Coast and heading toward Asia, vessels typically pass through the Panama Canal, which is nearly a month-long trip. Due to the ongoing drought and restrictions at the Panama Canal, more Very Large Gas Carriers (VLGCs), which primarily carry propane and butane, started going through the Suez Canal. Now some of these VLGCs are going around the Cape of Good Hope. A journey from the U.S.
