text: After the attacks began in November, flows of oil, refined products, and natural gas passing through the Bab el-Mandeb Strait slowed. About 18% less crude oil flowed through the Bab el-Mandeb in December than on average from January to November 2023. Most crude oil trade that goes through the Bab el-Mandeb Strait leaves Russia and Iraq en route to Asia and the Mediterranean, respectively. Clean petroleum product flows through the Bab el-Mandeb Strait were 30% lower in December than the rest of 2023. The majority of petroleum product trade leaves Saudi Arabia and India bound for Europe and leaves Russia bound for Asia.
