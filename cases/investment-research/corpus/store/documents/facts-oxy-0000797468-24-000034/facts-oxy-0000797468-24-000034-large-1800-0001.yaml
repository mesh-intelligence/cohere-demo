text: |-
  Occidental Petroleum Corporation (OXY) reported the following values in its Form 10-K filed 2024-02-14 for fiscal 2023 FY.

  Reported revenue was $28.26 billion for the period 2023-01-01 to 2023-12-31.

  Reported net income was $4.70 billion for the period 2023-01-01 to 2023-12-31.

  Reported operating cash flow was $12.31 billion for the period 2023-01-01 to 2023-12-31.

  Reported capital expenditure was $6.27 billion for the period 2023-01-01 to 2023-12-31.

  Reported total assets was $74.01 billion as of 2023-12-31.

  Reported cash and cash equivalents was $1.43 billion as of 2023-12-31.
