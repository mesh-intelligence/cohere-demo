text: |-
  Marrowick Capital has engaged our team on a confidential sale process for Ardenfall Gas Gathering, its private Appalachian gathering business. Indicative timing has first-round bids in the autumn, and the seller's valuation case rests on a gas price recovery in 2025.

  Wall-crossed staff only. The process is not public, and the existence of the mandate may not be shared across the barrier.
