text: |-
  On Project Larkspur, Velmora Energy lowered its indicative range after diligence on Sablecrest Midstream's contract book showed more volumes rolling off by 2027 than it had assumed. Sablecrest has not responded, and the process may slow.

  Wall-crossed staff only. This changes how the deal team reads Velmora's appetite for vertical integration, and it must not inform any published view on either company.
