text: We typically publish annual and monthly statistics for vented and flared natural gas in the Natural Gas Annual in September of each year. We rely on federal and state data, each with different reporting requirements. To derive the preliminary estimates for this analysis, we used data from federal and state agencies that have already reported through 2023. These data included reports from the states and the Federal Offshore Gulf of Mexico that made up 62.5% of total reported U.S. natural gas gross withdrawals and 98.9% of reported natural gas vented and flared in 2022. We estimated the vented and flared statistics for the states that have not reported the full 2023 period by applying a weighted average growth rate from the reported states.
