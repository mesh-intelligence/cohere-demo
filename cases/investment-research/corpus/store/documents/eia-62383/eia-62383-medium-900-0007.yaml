text: U.S. federal and state regulators have introduced many initiatives over the last 10 years to reduce greenhouse gas emissions and the associated lost tax and royalty revenue, although rules vary by state. Many of these initiatives are at the state level, such as the capture targets set by the North Dakota Industrial Commission and adjustments to the permitted flaring exemptions revised by the Railroad Commission of Texas.
