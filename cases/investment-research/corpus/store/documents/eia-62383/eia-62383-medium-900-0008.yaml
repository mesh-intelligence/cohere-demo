text: The U.S. Department of Energy’s Methane Mitigation Technologies program was established in 2016 to fund research and development of technologies and infrastructure to reduce greenhouse gas emissions. In 2022, the Inflation Reduction Act (IRA) established the Methane Emissions Reduction program to help reduce emissions of methane and other greenhouse gases from the oil and natural gas sector. The IRA further authorized the EPA to collect an annual Waste Emissions Charge on methane emissions exceeding given thresholds. In April 2024, the Bureau of Land Management finalized the Waste Prevention Rule, which tightened previous standards for the capture of natural gas and leak detection and repair.
