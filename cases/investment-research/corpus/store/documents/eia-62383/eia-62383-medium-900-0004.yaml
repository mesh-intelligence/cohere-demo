text: The states with the most reported vented and flared natural gas are Texas, North Dakota, and Wyoming. In 2023, North Dakota, Wyoming, and California, as well as the Federal Offshore Gulf of Mexico, have the highest rates of reported vented or flared natural gas relative to their gross withdrawals of natural gas. In 2023, we estimate operators in North Dakota flared 5.1% of gross withdrawals, and those in Wyoming vented and flared 4.4% of their gross withdrawals. Combined, this rate amounts to 0.3 Bcf/d of the two states’ 6.5 Bcf/d of gross withdrawals, or about half of the volume of vented or flared natural gas in the United States reported in 2023 so far.
