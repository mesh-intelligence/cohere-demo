corpus: ukraine-2022
corpus_version: "1.0"
synthetic: false
synthetic_notice: |-
  This corpus mixes real and invented material and a figure measured over it
  must say so. Four tiers are real published reporting: daily assessments from
  the Institute for the Study of War, messages from twelve Telegram news
  channels, an air-defence record of missile and drone strikes, and daily loss
  figures from the Ukrainian General Staff. Each tier records its source,
  licence, and retrieval date in a README beside the data.

  The humint tier is entirely invented. Its sources, its collecting
  organization, and its classification markings are fictional demonstration
  labels written over the public rumour stream so that clearance-gated
  retrieval has classified-looking material to gate. No document in this corpus
  is, or derives from, actual classified material.
