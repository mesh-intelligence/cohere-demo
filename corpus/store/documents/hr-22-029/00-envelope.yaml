segments:
  - role: summary
    searchable: true
    text: '1. (C) SUMMARY: A commodities-trade source with European defence-industrial contacts reports those contacts read the reported EUR 2bn increase to the European Peace Facility (ref: UNIAN Telegram msg 82796, citing Bloomberg) as a signal that member states are moving from drawdown of existing stocks to funded new production, and are positioning for multi-year order flow. END SUMMARY.'
  - role: body
    searchable: true
    text: 2. (C) Source MURANO (B4 - protect) reported on December 8 that two contacts at European defence primes described the top-up as the point at which reimbursement certainty makes new-build ammunition lines worth financing, and expected the first funded orders to concentrate on 155mm and air-defence interceptors.
  - role: comment
    searchable: true
    text: '3. (C) FIELD COMMENT: MURANO reports his contacts accurately; the production-ramp inference is theirs and commercially motivated (graded 4). Useful as an early indicator of the shift from stock transfer to funded production that the security-assistance file tracks. END COMMENT.'
