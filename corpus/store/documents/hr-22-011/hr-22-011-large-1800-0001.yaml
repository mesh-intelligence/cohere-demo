  3. (C) FIELD COMMENT: Ref public reporting (BBC Russia Telegram msg 34649). KESTREL relays sentiment, not evidence; graded 4. Note for pattern file: third violent death of a senior occupation official this quarter with an inward-looking rumor trail. END COMMENT.
