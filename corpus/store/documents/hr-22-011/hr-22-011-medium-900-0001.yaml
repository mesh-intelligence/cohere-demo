text: |-
  1. (C) SUMMARY: Milblogger-circle discussion of the September 16 bombing that killed LNR prosecutor-general Gorenko leaned toward an internal score-settling explanation rather than the official sabotage narrative, citing the access required to place the device. END SUMMARY.

  2. (C) Source KESTREL (C4 - protect) reported on September 17 that closed Z-channel discussion emphasized the device functioned inside a guarded building and that Gorenko had been involved in disputes over detained commercial assets. Two participants with claimed Luhansk connections predicted arrests within the LNR apparatus rather than a UA-attributed case.
