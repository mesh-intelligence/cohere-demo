text: |-
  1. (C) SUMMARY: Milblogger back-channel traffic before and after the April 20 Belgorod detonation supports the accidental-release explanation for an RF aerial bomb, and indicates the sortie was part of a planned strike toward Kharkiv with the newly modified glide kits. END SUMMARY.

  2. (C) Source KESTREL (C4 - protect) reported on April 21 that aviation-adjacent closed channels discussed, hours before the event, an intent to demonstrate "new heavy work" on the Kharkiv axis (consistent with the public UNIAN item, Telegram msg 95901), and afterward shifted to recriminations over a release-mechanism fault on a modified FAB-500 class weapon, including a claimed grounding order for the modification pending inspection.

  3. (C) FIELD COMMENT: The glide-kit modification program is tracked in the technical file; an emergency grounding, if real, offers a short window of reduced glide-bomb activity to observe in the signals feed. KESTREL grading caveats apply. END COMMENT.
