text: |-
  1. (C) SUMMARY: Commodity-market counterparties treat the May 4 Ilsky refinery UAV strike (four airframes per public sourcing) as confirmation of a recurring Ukrainian deep-strike capability against Krasnodar-area energy infrastructure, and have begun repricing accordingly; one counterparty reported informal guidance to route product contracts away from named coastal facilities. END SUMMARY.

  2. (C) Source MURANO (B4 - protect) reported on May 5 that two Russian trading counterparties independently cited the Ilsky event (ref: Meduza Telegram msg 83097, citing RIA's law-enforcement source on four UAVs, one unexploded) in renegotiating delivery-risk terms, and that a Novorossiysk-linked contact described new rooftop observation posts and jammer installations at two facilities.
