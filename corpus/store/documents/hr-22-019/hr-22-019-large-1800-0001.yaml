text: |-
  1. (S//NF) SUMMARY: Allied liaison confirms the substance of December 20 press reporting that the next US assistance package includes a Patriot battery, adding that crew training will run approximately ten weeks at a US installation and that a second battery from a European donor is under discussion. END SUMMARY.

  2. (S//NF) Source LATTICE (A1 - liaison channel) advised on December 21 that the transfer decision was made and would be announced in connection with a senior Ukrainian visit to Washington; the CNN-sourced public item (ref: RBK Telegram msg 65214) is accurate on content, early on confirmation.

  3. (S//NF) The European second-battery discussion is pre-decisional and NOFORN; premature disclosure is assessed likely to complicate the donor's domestic approval.

  4. (S//NF) FIELD COMMENT: Air-defense order-of-battle file updated. Note for the demo record: this report shows a case where public reporting and privileged reporting agree on facts but differ on status and releasability. END COMMENT.
