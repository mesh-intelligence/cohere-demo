text: |-
  2. (C) Source KESTREL (C4 - protect) reported on February 26 that two channels serving Belarusian security personnel briefly carried, then deleted, references to a night exchange of fire and a casualty evacuation near the border, and that administrators cited instructions to treat the event as non-existent.

  3. (C) FIELD COMMENT: KESTREL relays sentiment and deleted-post content, not evidence (graded 4). The pattern - official denial plus a suppressed local trace - matches earlier cases (HR-22-018). Whether the incident reflects sabotage, a defector group, or an accident cannot be judged from this reporting. END COMMENT.
