text: |-
  1. (C) SUMMARY: Closed milblogger discussion contradicts the Belarusian border committee's February 26 denial (ref: TASS Telegram msg 182291) of a border incident, indicating a real exchange of fire occurred near the Ukrainian frontier involving Belarusian border troops and an unidentified group, with an information clamp ordered. END SUMMARY.

  2. (C) Source KESTREL (C4 - protect) reported on February 26 that two channels serving Belarusian security personnel briefly carried, then deleted, references to a night exchange of fire and a casualty evacuation near the border, and that administrators cited instructions to treat the event as non-existent.
