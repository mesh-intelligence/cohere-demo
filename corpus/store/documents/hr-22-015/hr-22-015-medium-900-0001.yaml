text: |-
  1. (S) SUMMARY: A Kherson administration source assesses that the forced relocation of right-bank residents announced as "evacuation" is functioning as preparation to abandon the right bank: administrative apparatus, archives, and collaborator families moved first, and bank-branch cash operations ceased. END SUMMARY.

  2. (S) Source ORACLE-7 (B2 - strictly protect), displaced from Kherson but in daily contact with residents, reported on November 7 that occupation-administration offices in three raions he tracks stopped functioning between October 28 and November 3, with equipment loaded toward the left bank; remaining checkpoints were manned by newly arrived mobilized personnel unfamiliar with the area.
