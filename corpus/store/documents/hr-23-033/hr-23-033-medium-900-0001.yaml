text: |-
  1. (S//NF) SUMMARY: Allied liaison confirms the March 14 loss of a US MQ-9 over the Black Sea resulted from deliberate RF Su-27 fuel-dumping and a subsequent propeller strike, contradicting the RF framing that the aircraft manoeuvred itself into the water (public RF line ref: TASS Telegram msg 184264). END SUMMARY.

  2. (S//NF) Source LATTICE (A1 - liaison channel) advised on March 14 that sensor reconstruction showed two passes with fuel release ahead of the UAV before contact damaged a propeller blade, forcing the operators to ditch the airframe; recovery of wreckage by either side is assessed unlikely given depth. The reconstruction detail is NOFORN.
