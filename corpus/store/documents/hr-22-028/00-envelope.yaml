    text: '1. (C) SUMMARY: A source in the Kharkiv oblast emergency-services coordination centre corroborates the oblast administration''s July 21 figure of at least 17 wounded from shelling of the city, and adds that strikes clustered on two residential districts in the early morning, consistent with tube-artillery rather than missile fire. END SUMMARY.'
  - role: body
    searchable: true
    text: 2. (C) Source AMBER (B3 - protect), an emergency-services coordinator, reported on July 21 that dispatch logs recorded 17 wounded and two killed across the Saltivka and Nemyshlianskyi districts between 0400 and 0600 local, and that impact patterns and fragment recovery indicated multiple-launch and towed-artillery fire from the northeast.
  - role: comment
    searchable: true
    text: '3. (C) FIELD COMMENT: Consistent with the public statement of the oblast head (ref: Meduza Telegram msg 65056, itself hedged as wartime unverified). AMBER reports dispatch data firsthand; the weapon-type inference is his own and graded accordingly. Corroborates the sustained-bombardment pattern in the signals feed for the Kharkiv axis this period. END COMMENT.'
