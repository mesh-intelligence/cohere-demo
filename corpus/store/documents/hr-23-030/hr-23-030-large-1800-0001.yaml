text: |-
  1. (S) SUMMARY: A Central Asian government-adjacent source assesses that the RF MFA's January 12 dismissal of claims that Moscow threatens Armenian security (ref: TASS Telegram msg 176334) is damage control over a genuine and deepening rupture, and reports that CSTO member states are quietly hedging as Moscow's security guarantees lose credibility. END SUMMARY.

  2. (S) Source VERMILION (B2 - strictly protect) reported on January 12 that regional foreign-ministry contacts view Yerevan's refusal to host CSTO exercises and its appeals outside the bloc as a signal the alliance's mutual-defence core is hollow while Russian forces are fixed in Ukraine, and that his own ministry has quietly widened defence-procurement conversations beyond Russian suppliers.

  3. (S) FIELD COMMENT: The public denial is accurate as a denial; the analytically load-bearing content is the observable hedging by CSTO members, of which VERMILION's ministry is one. Consistent with the distancing reported at HR-22-012. END COMMENT.
