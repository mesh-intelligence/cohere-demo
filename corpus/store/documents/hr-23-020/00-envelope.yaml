segments:
  - role: summary
    searchable: true
    text: '1. (C) SUMMARY: Liaison-derived detail supports press reporting that Spain will contribute four to six Leopard 2A4s: of 53 stored hulls at Zaragoza, an initial technical survey found roughly one in four economically restorable on a useful timeline, which drives the low offer number. END SUMMARY.'
  - role: body
    searchable: true
    text: '2. (C) Source LATTICE (A1 - liaison channel, releasable summary) advised on February 2 that the Spanish survey completed in late January graded the stored fleet into three condition classes; the four-to-six figure in public reporting (ref: RBK Telegram msg 67640, citing El Pais sources) corresponds to class-one hulls plus workshop capacity through spring.'
  - role: comment
    searchable: true
    text: '3. (C) FIELD COMMENT: Useful calibration for coalition armor-delivery projections: press numbers this period generally reflect political intent; restorable-condition surveys are the binding constraint for stored-fleet donors. END COMMENT.'
