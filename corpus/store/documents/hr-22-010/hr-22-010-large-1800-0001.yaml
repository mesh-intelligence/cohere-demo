text: |-
  1. (S//NF) SUMMARY: Allied liaison confirms the substance of August 26 press reporting that RF intelligence surveilled Ukrainian soldiers training at German ranges, documenting two vehicle-based observation probes and small-UAV overflights at one site. END SUMMARY.

  2. (S//NF) Source LATTICE (A1 - liaison channel) advised on August 27 that host military counterintelligence documented repeated presence of the same two rental vehicles near a training area during UA artillery instruction windows, and recovered imagery from a commercial UAV downed inside the perimeter. Attribution to an RF service is assessed probable but not yet evidentiary.

  3. (S//NF) LATTICE requested that the UAV recovery not be acknowledged publicly; press reporting (ref: UNIAN Telegram msg 69775, citing Spiegel) does not include it.

  4. (S//NF) FIELD COMMENT: Force-protection implications forwarded to the training-mission security cell. Collection interest in training throughput mirrors the Warsaw case (HR-22-004). END COMMENT.
