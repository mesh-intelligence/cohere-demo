text: |-
  1. (U//FOUO) SUMMARY: Debrief of a displaced resident of Kreminna provides second-hand, partial support for public claims that RF soldiers shot residents identified as pro-Ukrainian, while differing on scale. END SUMMARY.

  2. (U//FOUO) The interviewee, a woman who left Kreminna in late June via Starobilsk, stated during a July 9 voluntary debrief that neighbors described two incidents in May in which men were taken from their homes after denunciations and later found dead; she named the street but did not witness events herself.

  3. (U//FOUO) Interviewee had not heard of killings "in the street" as described in the public statement of the Luhansk oblast head (ref: Meduza Telegram msg 63936, itself flagged as unconfirmed), and believed the number involved was smaller than rumored.
