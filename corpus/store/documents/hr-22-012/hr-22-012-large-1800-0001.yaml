text: |-
  1. (S) SUMMARY: A Kazakhstani government-adjacent source confirms the official denial that Astana plans to suspend CSTO membership, while reporting genuine internal guidance to minimize participation in CSTO activities that could be portrayed as supporting RF operations in Ukraine. END SUMMARY.

  2. (S) Source VERMILION (B2 - strictly protect) told this station on September 15 that the social-media exit rumor (denied publicly by the MFA, ref: RIA News Telegram msg 177924) has no basis in any decision source is aware of, but that ministries received informal guidance in August to slow-walk CSTO exercise commitments and avoid new basing or transit concessions.

  3. (S) Source linked the guidance to public-opinion sensitivity after Yerevan-related CSTO criticism and to Astana's refusal to recognize the occupied-territory referenda.

  4. (S) FIELD COMMENT: The distinction between formal alignment and practical distancing is the analytically useful content here; the public rumor and denial are both accurate as far as they go. END COMMENT.
