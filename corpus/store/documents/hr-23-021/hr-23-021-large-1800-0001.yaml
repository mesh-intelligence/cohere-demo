text: |-
  1. (S) SUMMARY: A Moscow source corroborates the reported city quota of 27,000 contract soldiers, observing district-level recruitment infrastructure standing up in early March, and supports the reported framing that covert mobilization lists exist as a fallback if voluntary recruitment falls short. END SUMMARY.

  2. (S) Source SABLE (C3 - strictly protect) reported on March 27 that source's firm fitted out two district recruitment offices in the first half of March under contracts specifying daily processing capacity, and that a military-commissariat employee told source's site manager the city plan is "twenty-seven thousand by autumn, or the lists come out of the safe."

  3. (S) FIELD COMMENT: Independent corroboration of the Sota-sourced public figure (ref: Meduza Telegram msg 80886). Two reporting lines now support quota-driven contract recruitment as the preferred manpower mechanism, with a second mobilization wave held in reserve. Consistent with HR-22-017. END COMMENT.
