    text: '2. (S) Source SABLE (C3 - strictly protect) reported on November 21 that a facilities contract source services at a central-Moscow government complex required after-hours access for "protective measures exercises" on October 26 and November 9, matching dates in the public item (ref: Ukraine Now Telegram msg 75940, citing The Insider). Source''s contacts describe the drills as demonstrative, intended to be seen.'
