text: |-
  1. (S//NF) SUMMARY: Allied liaison confirms the substance of press reporting on Chinese signals-collection activity from Cuba (ref: TASS Telegram msg 195772, relaying Politico) while cautioning that the activity is an upgrade of long-standing collection sites, not a single new base, and that the public timeline understates how long the cooperation has run. END SUMMARY.

  2. (S//NF) Source LATTICE (A1 - liaison channel) advised on June 10 that the reporting conflates two separate facilities and that the relevant development is expanded antenna and processing capacity at an existing site, oriented on US southeastern communications. Specific site identifications are NOFORN.
