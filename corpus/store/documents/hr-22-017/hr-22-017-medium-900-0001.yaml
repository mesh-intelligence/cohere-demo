text: |-
  1. (C) SUMMARY: Facilities-level observations contradict the Kremlin line that mobilization is complete: a processing site source services was ordered winterized for continued use, and staff there expect intake to resume under the label of contract recruitment. END SUMMARY.

  2. (C) Source SABLE (C3 - strictly protect) reported on December 5 that a mobilization processing point outside Moscow, which paused intake in mid-November, tasked source's firm on November 30 with winterization and capacity maintenance "through spring," with site staff privately telling source's foreman that lists for a next wave exist at the rayon level.
