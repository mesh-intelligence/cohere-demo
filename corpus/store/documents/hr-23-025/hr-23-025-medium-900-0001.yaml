text: |-
  1. (S) SUMMARY: A source inside a Wagner-affiliated payments network reports the organization internally treats the Bakhmut operation as concluded as of May 20-21, with completion bonuses processed, accelerated releases for the convict cohort, and instructions to prepare transfer of positions to MoD units - alongside open contempt for the MoD in internal traffic. END SUMMARY.

  2. (S) Source TALWAR (C2 - strictly protect), an administrative employee in the payments network, reported on May 22 processing a completion-bonus tranche referencing "the fortress" and seeing movement orders for replacement by two MoD-subordinated formations, with handover friction expected. Internal messages mocked Zelensky's and the MoD's competing public characterizations (ref: RIA News Telegram msg 203327 on the Prigozhin-Zelensky exchange).
