text: |-
  1. (S//NF) SUMMARY: A source with second-hand access to senior Kyiv deliberations disputes the El Mundo claim that Ukraine is withdrawing its main force from Bakhmut, describing instead brigade rotations, thinning of the urban garrison, and a deliberate build on the flanks; the city fight continues for fixing effect. END SUMMARY.

  2. (S//NF) Source HALCYON (B2 - strictly protect) stated on April 25 that the anonymous-source withdrawal item (ref: Ukraine Now Telegram msg 94501) irritated the leadership because it conflated garrison thinning with abandonment while flank groupings are being assembled for a later counterstroke; source asked that this distinction be handled restrictively, hence NOFORN.
