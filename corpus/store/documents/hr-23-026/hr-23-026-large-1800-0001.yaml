text: |-
  1. (S//NF) SUMMARY: Within hours of Prigozhin's June 23 claim of an MoD strike on Wagner rear camps - publicly denied by the MoD (ref: Ukraine Now Telegram msg 101916) - the payments network source works in received instructions consistent with contingency footing: cash consolidation, personnel recall, and preparation of convoy fuel advances on the Voronezh axis. Source's office treated the strike claim as pretext, with staff told "the decision is already made." END SUMMARY.

  2. (S//NF) Source TALWAR (C2 - strictly protect) reported at 2140 local June 23 that his office was ordered to close out June pay early, issue fuel-card advances for named convoy segments Rostov-Voronezh, and stand by for "movement of the column north." Two colleagues reported parallel recall messages to released convict-cohort veterans in Rostov oblast.

  3. (S//NF) Source could not distinguish between an armed demonstration against the MoD and an attempt against state authority, and asked for exfiltration guidance, which station is handling separately.

  4. (S//NF) FIELD COMMENT: Graded 2 on documentary access. If corroborated in the next hours by movement observables, this reporting front-runs public awareness of an armed Wagner action inside Russia. Disseminated at FLASH precedence for that reason. END COMMENT.
