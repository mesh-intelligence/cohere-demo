text: |-
  1. (C) SUMMARY: Agricultural-commodity contacts assess that Polish farmer protests over Ukrainian grain (ref: RIA News Telegram msg 198804) reflect a structural glut in transit countries that will constrain the EU solidarity-lanes arrangement through the season, and that national import curbs are now likely regardless of Brussels' position. END SUMMARY.

  2. (C) Source MURANO (B4 - protect) reported on April 3 that counterparties handling Black Sea and overland grain flows describe storage in Poland, Romania, and Bulgaria as saturated, depressing local prices, and expect one or more transit states to impose unilateral import restrictions within weeks.

  3. (C) FIELD COMMENT: MURANO reports market conditions accurately; his interest is in the trade, so political forecasts are graded 4. Relevant to coalition-cohesion analysis: an internal EU dispute over Ukrainian exports is a friction point RF messaging is likely to exploit. END COMMENT.
