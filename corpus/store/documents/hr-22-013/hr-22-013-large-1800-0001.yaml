text: |-
  1. (C) SUMMARY: The customs supervisor at the Petropavlovsk road crossing corrects public reporting that the crossing closed on September 26: the crossing remained open, but RF border personnel began selectively refusing exit to military-age men, producing the queue collapse that read as closure from the Kazakhstani side. END SUMMARY.

  2. (C) Source VERMILION (B2 - strictly protect) reported on September 27 that inbound (from RF) processing on September 25-26 fell to roughly a third of the prior day's volume while the RF side pulled draft-eligible men from queues; he personally processed families whose adult male members had been turned back.

  3. (C) Source estimated cumulative military-age male entries at his crossing since the September 21 mobilization announcement in the low tens of thousands, and reported instructions on the Kazakhstani side to process without obstruction.

  4. (C) FIELD COMMENT: Ref public closure claim (Ukraine Now Telegram msg 68310, citing Orda). VERMILION's count is a direct observation at one crossing and anchors the wider mobilization-exodus estimate. END COMMENT.
