    text: '1. (C) SUMMARY: The customs supervisor at the Petropavlovsk road crossing corrects public reporting that the crossing closed on September 26: the crossing remained open, but RF border personnel began selectively refusing exit to military-age men, producing the queue collapse that read as closure from the Kazakhstani side. END SUMMARY.'
