text: |-
  1. (S//NF) SUMMARY: Allied liaison assesses the wave of letter-bombs sent to the Ukrainian embassy, the prime minister's residence, and defence sites in Spain (public arrest reported ref: RBK Telegram msg 67244) as a single coordinated campaign, and reports forensic and tasking indicators pointing to a Russian-directed or Russian-inspired sabotage network rather than a lone actor. END SUMMARY.

  2. (S//NF) Source LATTICE (A1 - liaison channel) advised on January 25 that device construction was common across the parcels and that the detained individual is assessed a facilitator, not the originator; the host service is pursuing a handling network with links outside Spain. Two indicators tying tasking to a Russian nexus are held NOFORN and must not appear in releasable product.
