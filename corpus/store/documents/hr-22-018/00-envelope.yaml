    text: 2. (C) Source KESTREL (C4 - protect) reported on December 13 that two closed channels serving mobilized soldiers' families carried requests for information about a specific unit billeted near Svatove, with administrators deleting posts naming a two-digit casualty figure and complaining of pressure "from the military department."
  - role: comment
