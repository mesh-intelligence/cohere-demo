    text: '3. (C) FIELD COMMENT: The public denial (ref: TASS Telegram msg 171507) is consistent with RF handling of the later, admitted Makiivka strike. KESTREL''s material is indirect but specific as to unit and billeting site; forwarded to targeting-effects assessment. Graded C4; the casualty figure itself should not be repeated in finished product without corroboration. END COMMENT.'
