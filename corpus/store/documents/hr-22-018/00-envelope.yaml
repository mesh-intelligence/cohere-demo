    text: '1. (C) SUMMARY: Closed milblogger-channel traffic contradicts the LNR militia officer''s public denial of heavy RF casualties from the reported strike near Svatove, referencing a mobilized-unit housing site and friction over delayed notification of families. END SUMMARY.'
